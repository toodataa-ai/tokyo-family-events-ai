name: One-time safely stage verified 2026-10-19 six-week event candidate
on:
  push:
    branches: [research/holiday-after-individual-fact-crawl-20261020]
    paths:
      - .github/workflows/holiday-data-staging-20261020.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: one-time-holiday-data-staging-20261019
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/checkout@v4
        with:
          ref: data-production
          path: data-src
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: production
          path: released
      - uses: actions/download-artifact@v4
        with:
          name: six-week-source-review-20261019-v2
          run-id: 39287812668
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm immutable data-production and no stale data-staging before processing
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          base="$(git -C data-src rev-parse HEAD)"
          if [ "$base" != "b1282eb0f24ec6436b1ef8cf52d3df597b262c0b" ]; then
            echo "Published data changed since independently measured search; refused"
            exit 1
          fi
          live="$(git -C data-src ls-remote origin refs/heads/data-staging | cut -f1)"
          if [ "$live" != "$base" ]; then
            echo "Existing data-staging has newer user data; refused to overwrite"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "BASE VERIFIED: $base"
      - name: Assemble candidate strictly from immutable previous records plus approved official evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-confirmation"
          python3 scanner/tools/holiday_after_staging_dryrun.py \
            --baseline data-src/site/data \
            --evidence "$RUNNER_TEMP/evidence" \
            --review-ledger scanner/research/2026-10-20-confirmed-13-promotion-source-evidence.json \
            --output "$RUNNER_TEMP/data-candidate/site/data" \
            > "$RUNNER_TEMP/staging-confirmation/candidate-audit.json"
          cp -a "$RUNNER_TEMP/data-candidate/site/data/." data-src/site/data/
          cd data-src
          node ../scanner/tools/holiday_after_history_candidate.mjs "${{ steps.guard.outputs.base }}" | tee "$RUNNER_TEMP/staging-confirmation/history-derived.json"
      - name: All strict released/staging data source, official, removal and history gates must PASS
        shell: bash
        run: |
          set -euo pipefail
          cd data-src
          python3 ../released/tools/validate_data.py --strict --min-image-coverage 0.70 site/data
          python3 ../released/tools/validate_decisions.py --strict site/data
          python3 ../scanner/tools/validate_official_schedule_audit.py site/data
          python3 ../scanner/tools/validate_protected_events.py --base-ref "${{ steps.guard.outputs.base }}" site/data
          python3 ../scanner/tools/validate_non_regression.py --base-ref "${{ steps.guard.outputs.base }}" site/data
          python3 ../released/tools/validate_rereview.py site/data --strict
          node ../scanner/tools/holiday_update_history.mjs --check --data-dir site/data --base-ref "${{ steps.guard.outputs.base }}"
          echo 'ALL REQUIRED STRICT DATA GATES PASSED' | tee "$RUNNER_TEMP/staging-confirmation/strict-pass.txt"
      - name: Run full application data consistency tests without app modification
        working-directory: scanner
        run: npm test
      - name: Allowlist differences and verify old data files are physically retained
        shell: bash
        run: |
          set -euo pipefail
          cd data-src
          git add -A -- site/data
          git diff --cached --name-status > "$RUNNER_TEMP/staging-confirmation/diff.txt"
          cat "$RUNNER_TEMP/staging-confirmation/diff.txt"
          if grep -E '^(D|R)[[:space:]]' "$RUNNER_TEMP/staging-confirmation/diff.txt"; then
            echo "A prior published file was deleted or renamed!"
            exit 1
          fi
          if ! awk 'NF>=2 && $2 !~ /^site\/data\/([0-9]{4}-[0-9]{2}-[0-9]{2}[^/]*\.json|manifest\.json|update_history\.json)$/ {bad=1; print "DISALLOWED", $2} END {exit bad}' "$RUNNER_TEMP/staging-confirmation/diff.txt"; then
            exit 1
          fi
          git diff --cached --check
          test -s "$RUNNER_TEMP/staging-confirmation/diff.txt"
          test "$(git status --porcelain | grep -cE '^[AM] ' || true)" -gt 0
      - name: Commit ONLY verified candidate to data-staging (never production)
        shell: bash
        run: |
          set -euo pipefail
          cd data-src
          base="${{ steps.guard.outputs.base }}"
          live="$(git ls-remote origin refs/heads/data-staging | cut -f1)"
          if [ "$base" != "$live" ]; then
            echo "Race: data-staging changed while validating. Refusing push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data-staging: 2026-10-19 six-week verified holiday-after candidate"
          git push origin "HEAD:refs/heads/data-staging"
          echo "DATA-STAGING SHA: $(git rev-parse HEAD)"
          echo "DATA-PRODUCTION SHA STILL: $base"
      - name: Upload strict proof (no publication trigger)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holiday-20261019-data-staging-proof
          path: ${{ runner.temp }}/staging-confirmation/
          retention-days: 30
          if-no-files-found: warn
