ください。同伴者二名以降は通常料金でご購入ください。","fee":"1250","isFeeFluctuation":false},{"segment":null,"subSegment":null,"fee":null,"isFeeFluctuation":false},{"segment":null,"subSegment":null,"fee":null,"isFeeFluctuation":false},{"segment":null,"subSegment":null,"fee":null,"isFeeFluctuation":false},{"segment":null,"subSegment":null,"fee":null,"isFeeFluctuation":false},{"segment":null,"subSegment":null,"fee":null,"isFeeFluctuation":false}]}],"ticketLinks":[{"linkTitle":"公式チケットサイト","linkUrl":"https://hamarikyu.tickets.teamlab.art/","wechatImageUrl":null}],"accessMajor":[{"title":"電車をご利用の方","description":"JR『新橋駅』南改札汐留口 徒歩12分\n都営大江戸線『築地市場駅』A1出口 徒歩7分"}],"notes":"\u003cp id=\"isPasted\"\u003e\u003cstrong\u003eチケット購入にあたっての注意事項\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・日時指定制になっており、完売する場合がございます。\u003c/p\u003e\u003cp\u003e・現地でのチケット販売はございません。\u003c/p\u003e\u003cp\u003e・完売していない場合は当日でも公式チケットサイトで購入が可能です。\u003c/p\u003e\u003cp\u003e・未使用のチケットはキャンセル可能です。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「キャンセルする」ボタンからお⼿続きください。来場予定日時を過ぎるとキャンセル不可となります。\u003c/p\u003e\u003cp\u003e・日時変更が可能です。\u003c/p\u003e\u003cp\u003e日時変更は3回まで変更できます。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「入場日を変更する」ボタンからお⼿続きください。\u003c/p\u003e\u003cp\u003eただし、下記の場合入場日時の変更はできません。\u003c/p\u003e\u003cp\u003e　3回日時変更済みチケットの場合\u003c/p\u003e\u003cp\u003e　種類の異なるチケットへの変更\u003c/p\u003e\u003cp\u003e　チケット完売日時、または、チケット残数が不足している日時への変更\u003c/p\u003e\u003cp\u003e　複数枚まとめて購⼊しているうちの⼀部のチケットのみの日時変更\u003c/p\u003e\u003cp\u003e　複数枚まとめて購入していて、それぞれ異なる日時への変更\u003c/p\u003e\u003cp\u003e　チケット販売開始前の日時への変更\u003c/p\u003e\u003cp\u003e　チケット料金改定後、チケット料金が異なる日時への変更\u003c/p\u003e\u003cp id=\"isPasted\"\u003e　来場予定日時を過ぎた場合の変更\u003c/p\u003e\u003cp\u003e・料金は税込の金額となります。\u003c/p\u003e\u003cp\u003e・障がい者手帳をお持ちの方へ\u003c/p\u003e\u003cp id=\"isPasted\"\u003e障がい者手帳をお持ちの方ご本人様と同伴者1名まで、障がいのある方向けチケットをご購入頂けます（子どもチケットで障がい者手帳をお持ちの場合、同伴者1名まで障がいのある方向けチケットをご購入頂けます）。\u003c/p\u003e\u003cp\u003e入場ゲートで手帳の確認を行いますので、同伴の方はご一緒にご入場ください。\u003c/p\u003e\u003cp\u003e各国で発行された障がい者手帳も対象です。\u003c/p\u003e\u003cp\u003e・子ども（中学生以下）の方のご利用には、18歳以上の保護者の同伴が必要です。無料の子ども含め、子ども3名につき保護者1名が必要です。\u003c/p\u003e\u003cp\u003e・未就学児は無料です。\u003c/p\u003e\u003cp\u003e・開場時間はチケット購入ページでの事前の告知を持って、変更になる可能性があります。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eご来場にあたっての注意事項\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・当展示のご利用の際のお怪我や損失・損害、その他トラブルなどにつきまして主催者は一切責任を負いません。\u003c/p\u003e\u003cp\u003e・チケットの転売は禁止しており、転売にて購入いただいたチケットではご入場頂けず、その場合も主催者は一切の責任を負いません。\u003c/p\u003e\u003cp\u003e・混雑やメンテナンス、天候の関係で、一部の作品をご体験いただけない場合がございます。\u003c/p\u003e\u003cp\u003e・季節により作品や作品の仕様が変更となる場合がございます。\u003c/p\u003e\u003cp\u003e・会場内にトイレはございます。\u003c/p\u003e\u003cp\u003e・主催者の都合により展示を中断・中止する場合がございます。\u003c/p\u003e\u003cp\u003e・暴風警報・大雨警報/注意報・雷注意報が発令されている場合は開催を中止または中断する場合がございます。\u003c/p\u003e\u003cp\u003e・その他荒天により安全が確保されないと判断した場合は、展示を中止または中断する場合があります。\u003c/p\u003e\u003cp\u003e・展示を中止する場合は公式SNSにて公表いたします。\u003c/p\u003e\u003cp\u003e・ご来場にかかる旅費などの補償は、展示中止の場合も行なっておりません。\u003c/p\u003e\u003cp\u003e・チケットに記載の開催時間に入場口にご来場いただき、入場列にお並びください。\u003c/p\u003e\u003cp\u003e・入場後の滞在時間に制限はございません。\u003c/p\u003e\u003cp\u003e・再入場はできません。\u003c/p\u003e\u003cp\u003e・混雑時はご入場まで屋外で長時間お待ちいただく場合もございます。季節によって防暑・防寒対策のご用意をお願いします。スケジュールには余裕を持ってご来場ください。\u003c/p\u003e\u003cp\u003e・入場待機列から離れる際は、必ず代表者の方がお残りください。\u003c/p\u003e\u003cp\u003e・補助犬（盲導犬・聴導犬・介助犬）を除き、ペットを連れてのご入場はできません。\u003c/p\u003e\u003cp\u003e※キャリーケース等に入れている場合でもご入場いただけません。\u003c/p\u003e\u003cp\u003e・補助犬のみご入場いただけます。安全上のため、ご入場は自己責任でお願いいたします。\u003c/p\u003e\u003cp\u003e・車椅子、ベビーカーでのご入場は可能ですが安全管理上、ご入場、ご体験いただけない作品（車椅子、ベビーカーでは通れない作品）がございます。\u003c/p\u003e\u003cp\u003e・貴重品は各自の責任にて管理をお願い致します｡万一､盗難･紛失が発生した場合、主催者は一切責任を負いません。\u003c/p\u003e\u003cp\u003e・会場内は暗く、高低差・不安定な足場の箇所が多数ございます。\u003c/p\u003e\u003cp\u003eご自身とお連れ様、ならびに他のお客様の行動に細心の注意を頂き、特にお子様連れのお客様は保護者様の監督責任のもと、安全にお過ごしくださいますようお願いします。\u003c/p\u003e\u003cp\u003e・降雨によって重くなった枯れ枝が落ちたり（落枝）、木が倒れる可能性があります。ご理解の上、十分ご注意ください。\u003c/p\u003e\u003cp\u003e万一、落下物があった場合は、お近くのスタッフまでお声掛けください。\u003c/p\u003e\u003cp\u003e・会場内には未舗装のエリアが多いため歩きやすい運動靴などでのご来場を推奨しております。また虫刺され防止のため肌の露出を避けた服装でお越しください。\u003c/p\u003e\u003cp\u003e・作品の特性上、光の点滅/点灯、大きい音などの演出がございます。\u003c/p\u003e\u003cp\u003e・環境保全のためゴミは各自お持ち帰りくださいますようご協力ください。\u003c/p\u003e\u003cp\u003e・各種メディアの取材・撮影が行われる場合がございます。写り込みに同意をいただけない場合は、お近くのスタッフにお声がけください。\u003c/p\u003e\u003cp\u003e・入場時に身分証のご提示をお願いする場合がございます。\u003c/p\u003e\u003cp\u003e身分証：免許証、各種保険証、学生証、パスポート、マイナンバーカード等、氏名/年齢が確認できるもの\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e手荷物に関して\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・下記のものは持ち込みを禁止しております。\u003c/p\u003e\u003cp\u003e　酒類、食べ物（お弁当等）\u003c/p\u003e\u003cp\u003e　全長50cm以上の荷物\u003c/p\u003e\u003cp\u003e　危険物、臭気物、生花など\u003c/p\u003e\u003cp\u003e　ペットボトル、水筒以外の蓋が無いドリンク類\u003c/p\u003e\u003cp\u003e　その他、スタッフが危険であると判断した物品\u003c/p\u003e\u003cp\u003e・キャリーバッグなどの大きな荷物がある場合はご入場いただけません。\u003c/p\u003e\u003cp\u003e・安全のため、お子様を乗せたままベビーカーを担がないでください。\u003c/p\u003e\u003cp\u003e・ベビーカーを含む手荷物のお預かりは行っておりません。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e禁止事項\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・体調不良・泥酔状態でのご入場はお断りしております。\u003c/p\u003e\u003cp\u003e・お写真・動画の撮影は可能ですが、他のお客様へご迷惑をおかけすることのないようにお気をつけください。\u003c/p\u003e\u003cp\u003e・フラッシュ撮影、および会場内でのドローンの使用は禁止しております。\u003c/p\u003e\u003cp\u003e・一脚、三脚、自分撮りスティック等の撮影補助機材の持ち込み、使用もお断りしております。\u003c/p\u003e\u003cp\u003e・事前承諾のない商業目的の撮影や取材はお断りしております。\u003c/p\u003e\u003cp\u003e・プロジェクター、センサー、ライト、その他機材には、作品維持ならびに安全のため絶対にお手を触れぬようお願い致します。\u003c/p\u003e\u003cp\u003e・会場内でのアメ・ガムを含む飲食はお断りしております。お飲物のみお召し上がりいただけます。\u003c/p\u003e\u003cp\u003e・会場内は火気厳禁となっております。全面禁煙のご協力をお願い致します。\u003c/p\u003e\u003cp\u003e・会場内で柵がある場所には入らないでください。\u003c/p\u003e\u003cp\u003e・立入禁止となっているエリア（作品展示エリア以外）への侵入は行わないでください\u003c/p\u003e\u003cp\u003e・スタッフの指示を守りお過ごしください。お守り頂けない場合は退場いただく場合がございます。\u003c/p\u003e","freeSection":[],"faq":{"faqList":[{"title":"チケットについて","slug":"hamarikyu-faq1","faqBox":[{"question":"当日券の販売はありますか？","answer":"完売していない場合は当日でも公式チケットサイトで購入が可能です。\n現地での当日券の販売はございません。"},{"question":"チケットの購入方法と支払方法は何がありますか？","answer":"公式チケットサイトで購⼊できます。\nクレジットカードがご利用いただけます。\nチケットの日時変更が「3回まで」とキャンセルも可能です（入場日時まで変更可能です）。\nまた、荒天時の中止情報などの最新情報を、購入時のメールアドレスへお知らせします。"},{"question":"購⼊したチケットの日付変更・キャンセルはできますか？","answer":"未使用のチケットはキャンセル可能です。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「キャンセルする」ボタンからお⼿続きください。来場予定日時を過ぎるとキャンセル不可となります。\n\n日時変更が可能です。\n日時変更は3回まで変更できます。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「入場日を変更する」ボタンからお⼿続きください。\nただし、下記の場合入場日時の変更はできません。\n　3回日時変更済みチケットの場合\n　種類の異なるチケットへの変更\n　チケット完売日時、または、チケット残数が不足している日時への変更\n　複数枚まとめて購⼊しているうちの⼀部のチケットのみの日時変更\n　複数枚まとめて購入していて、それぞれ異なる日時への変更\n　チケット販売開始前の日時への変更\n　チケット料金改定後、チケット料金が異なる日時への変更\n　来場予定日時を過ぎた場合の変更"}]},{"title":"入場について","slug":"hamarikyu-faq2","faqBox":[{"question":"雨天時も開催しますか？","answer":"開催いたします。ただし、会場の状況により中止中断する場合があります。最新情報は\u003ca href=\"https://x.com/teamlab_hama\" target=\"_blank\"\u003e公式SNS\u003c/a\u003eをご確認ください。"},{"question":"天候による中止・中断はありますか？","answer":"暴風警報・大雨警報・雷注意報が発令されている場合は、\n開場の遅延や開催を中止または中断する場合がございます。\n最新情報は\u003ca href=\"https://x.com/teamlab_hama\" target=\"_blank\"\u003e公式SNS\u003c/a\u003eをご確認ください。"},{"question":"キャリーバッグなど大きな荷物を持ち込んだり預けることはできますか？","answer":"キャリーバッグなどの大きな荷物がある場合はご入場いただけません。預ける場所もありませんので、事前に他でお預けいただきお越しください。"},{"question":"車椅子・ベビーカーで入場できますか？","answer":"車椅子、ベビーカーでのご入場は可能ですが安全管理上、ご入場、ご体験いただけない作品（車椅子、ベビーカーでは通れない作品）がございます。安全のため、お子様を乗せたままベビーカーを担がないでください。"}]},{"title":"会場内について","slug":"hamarikyu-faq3","faqBox":[]}],"exhibitionSlug":"hamarikyu"},"isEndedExhibition":false},"artistData":{"text":"アートコレクティブ。2001年から活動を開始。アート、サイエンス、テクノロジー、そして自然界の交差点を模索している国際的な学際的集団。アーティスト、プログラマ、エンジニア、CGアニメーター、数学者、建築家など、様々な分野のスペシャリストから構成されている。\n\nチームラボは、アートによって、自分と世界との関係と新たな認識を模索したいと思っている。人は、認識するために世界を切り分けて、境界のある独立したものとして捉えてしまう。その認識の境界、そして、自分と世界との間にある境界、時間の連続性に対する認知の境界などを超えることを模索している。全ては、長い長い時の、境界のない連続性の上に危うく奇跡的に存在する。\n\nチームラボの作品は、ビクトリア国立美術館（メルボルン）、ニュー・サウス・ウェールズ州立美術館（シドニー）、南オーストラリア州立美術館（アデレード）、オーストラリア国立美術館（キャンベラ）、アモス・レックス（ヘルシンキ）、ロサンゼルス現代美術館（ロサンゼルス）、アジア美術館（サンフランシスコ）、ボルサン・コンテンポラリー・アート・コレクション（イスタンブール）、アジア・ソサエティ（ニューヨーク）などに収蔵されている。\n\n\u003ca href=\"https://www.teamlab.art/jp/\" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003eteamlab.art\u003c/a\u003e\n\n\u003ca href=\"https://docs.google.com/document/d/1tovV6F_EAcvgkjSLJg0JNfya2vkWQPz5Ts9u4LEhQII/edit?usp=sharing \" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003eBiographical Documents\u003c/a\u003e"},"aboutData":[],"event":{"organizers":"東京都／東京国際文化芸術祭実行委員会","coOrganizers":null,"specialSponsors":null,"sponsors":null,"supporters":null,"additionalEvents":[{"title":"プロデューサー","text":"\u003cp\u003e杉山 央（新領域株式会社）\u003c/p\u003e","titleImageUrl":null},{"title":"助成","text":"\u003cp\u003e令和８年度 日本博による地域固有文化コンテンツ創出補助事業\u003c/p\u003e","titleImageUrl":null},{"title":"ARTE TOKYO 公式サイト","text":"\u003cp\u003e\u003ca href=\"https://artetokyo.jp/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://artetokyo.jp/\u003c/a\u003e\u003c/p\u003e","titleImageUrl":null}]},"news":[{"title":"teamLab Takes Over a 400-Year-Old Edo Garden! Special Night Exhibition Arrives at Tokyo's Hama-rikyu","slug":"livejapan261028","externalUrl":null,"mediaPublishedAt":"Oct 28, 2026","mediaTitle":"LIVE JAPAN","externalMediaUrl":"https://livejapan.com/en/in-tokyo/in-pref-tokyo/in-tokyo_train_station/article-a0005957/","text":"Calling all teamLab fans! Tokyo’s historic Hama-rikyu Gardens—boasting over 400 years of rich history—is getting an enchanting after-dark makeover. Blending the serene landscape of a traditional Edo-period feudal lord's retreat with cutting-edge digital art, the outdoor night exhibition \"teamLab Hama-rikyu\" runs for a limited time from November 25 to December 24, 2026.(Excerpt from the text)"},{"title":"チームラボが夜の浜離宮恩賜庭園をアート空間に。「チームラボ 浜離宮」が11月25日から開催","slug":"bijutsutecho261027","externalUrl":null,"mediaPublishedAt":"2026年10月27日","mediaTitle":"美術手帖","externalMediaUrl":"https://bijutsutecho.com/magazine/news/exhibition/33240","text":"東京・中央区の浜離宮恩賜庭園を舞台に、アートコレクティブ・チームラボによる夜間アートプロジェクト「チームラボ 浜離宮」が開催される。会期は11月25日〜12月24日。\u003cbr\u003e\n本企画は、東京都および東京国際文化芸術祭実行委員会が主催する新たな文化芸術祭「ARTE TOKYO（アルテ・トーキョー）」の特別企画として実施されるもの。アートとテクノロジーを掛け合わせた都市型プロジェクトを数多く手がけてきた杉山央（新領域株式会社）をプロデューサーに迎える。(本文抜粋)"},{"title":"東京都、浜離宮でチームラボ展　国際芸術祭のプログラムで夜間帯活用","slug":"nikkei261026","externalUrl":null,"mediaPublishedAt":"2026年10月26日","mediaTitle":"日本経済新聞 電子版","externalMediaUrl":"https://www.nikkei.com/article/DGXZQOCC235220T21C26A0000000/","text":"東京都は11月から、国が特別名勝・特別史跡に指定する浜離宮恩賜庭園（東京・中央）で夜間にアート集団のチームラボ（東京・千代田）の野外アート展を開く。閉園する午後5時以降の時間帯を活用し、庭園の新たな魅力を発信する。(本文抜粋)"},{"title":"teamLab at Hama-rikyu Gardens, Nov 25–Dec 24, 2026","slug":"tokyocheapo261026","externalUrl":null,"mediaPublishedAt":"Oct 26, 2026","mediaTitle":"Tokyo Cheapo","externalMediaUrl":"https://tokyocheapo.com/events/teamlab-hamarikyu-gardens/","text":"This is going to be popular. For a limited time, international art collective teamLab is lighting up one of Tokyo’s oldest gardens after dark. The Edo-period Hamarikyū Gardens will become an outdoor nighttime art space, filled with glowing works that shift with the wind, the rain, and the people walking past.(Excerpt from the text)"},{"title":"チームラボ、夜の野外アート展を「浜離宮恩賜庭園」で開催","slug":"timeout261025","externalUrl":null,"mediaPublishedAt":"2026年10月25日","mediaTitle":"タイムアウト東京","externalMediaUrl":"https://www.timeout.jp/tokyo/ja/news/teamlab-hama-rikyu-gardens-102526","text":"「浜離宮恩賜庭園」で、チームラボによる夜の野外アート展「チームラボ 浜離宮」が2026年11月25日（水）から12月24日（木）まで開催される。本展は、アートや演劇、音楽、イルミネーションなど、多彩な文化芸術を結びつけるフェスティバル「ARTE TOKYO」の特別企画。国の特別名勝・特別史跡に指定されている歴史ある庭園を舞台に、自然や人々の存在によって変化するアート空間を創出する。(本文抜粋)"},{"title":"「チームラボ 浜離宮」夜の浜離宮恩賜庭園で、卵形の立体から木々へ光と音が広がる","slug":"fashionpress261024","externalUrl":null,"mediaPublishedAt":"2026年10月24日","mediaTitle":"ファッションプレス","externalMediaUrl":"https://www.fashion-press.net/news/152397","text":"東京・浜離宮恩賜庭園で、夜の野外アート展「チームラボ 浜離宮」が、2026年11月25日(水)から12月24日(木)まで開催される。「チームラボ 浜離宮」は、約400年の歴史を持つ浜離宮恩賜庭園を舞台に、光と音のアートを楽しめる展覧会。江戸時代から続く庭園に、風や雨によって姿を変える作品や、人が触れると光と音で反応する作品などが登場する。庭園の木々も、人が近づくと強く光り、周囲の木々へと光と音が広がっていく。(本文抜粋)"},{"title":"“teamLab: Hama-rikyu Gardens” Opens in Tokyo. The Garden Transforms into an Art Space Through Nature and Human Presence","slug":"hamarikyu261023","externalUrl":null,"mediaPublishedAt":"Oct 23, 2026","mediaTitle":null,"externalMediaUrl":null,"text":"\u003cp style=\"margin:0 0 24px;\"\u003e\nOn view from November 25 to December 24, 2026. Tickets Now on Sale\n\u003c/p\u003e\n\n\u003cdiv style=\"display: flex; justify-content: center;\"\u003e\n\u003ciframe style=\"max-width:600px; aspect-ratio:16/9;\" width=\"100%\" height=\"100%\" src=\"https://www.youtube.com/embed/LthhB9f9Jc8?si=M9Ly4okbqgvNnxsR\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen\u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\u003cp style=\"text-align:center; margin-top:8px; font-size:12px; line-height:1.7; color:#7D7A75; margin-bottom: 35px;\"\u003eHighlight Video: \u003ca href=\"https://www.teamlab.art/e/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eteamLab: Hama-rikyu Gardens\u003c/a\u003e, Tokyo ©︎ teamLab \u003cbr\u003e\n*Previous exhibition footage. Shot in real space. No AI or CGI.\n\u003c/p\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nteamLab is opening an outdoor nighttime art exhibition, \u003ca href=\"https://www.teamlab.art/e/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eteamLab: Hama-rikyu Gardens\u003c/a\u003e, in Tokyo. The exhibition will be open from Wednesday, November 25 to Thursday, December 24, 2026.\u003cbr\u003e\u003cbr\u003e\n\nHama-rikyu Gardens is a representative example of a daimyo garden—a garden belonging to a feudal lord—from the Edo period (1603 - 1868). Its tidal pond, Shioiri-no-ike, draws seawater from Tokyo Bay, its scenery changing with the ebb and flow of the tides.\u003cbr\u003e\nFor approximately 400 years, this site has remained in use, its role evolving from a falconry ground to a retreat for the shogun family, then an imperial detached palace, and finally a garden for the public.\u003cbr\u003e\u003cbr\u003e\n\nIn this exhibition, the garden, with its long continuity of time, becomes an art space. Influenced by the wind and rain, as well as by the ever-changing forest, this art space is transformed by the existence of the people of today.\u003cbr\u003e\u003cbr\u003e\n\nThe exhibition is held in Hama-rikyu Gardens as a special project of ARTE TOKYO (Tokyo International Festival of Arts and Culture), organized by the Tokyo Metropolitan Government and the Executive Committee for the Tokyo International Festival of Arts and Culture, with Ou Sugiyama (SHINRYOIKI, Inc.) as the producer of the project.\u003cbr\u003e\u003cbr\u003e\n\nTickets are now available through the official ticket website.\u003cbr\u003e\n\u003ca href=\"https://hamarikyu.tickets.teamlab.art/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003ehttps://hamarikyu.tickets.teamlab.art/\u003c/a\u003e\n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003e【Featured Artworks (Partial List)】\u003cbr\u003e\u003cbr\u003e\nPillars of Constant Flux\n\u003c/h2\u003e\n\n\u003cfigure style=\"max-width:600px; width:100%; margin:32px auto;\"\u003e\n\u003cimg src=\"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/fae3933d-8278-4d69-dece-8ec189479e00/public\" alt=\"\" loading=\"lazy\" style=\"display:block; width:100%; height:auto;\"\u003e\n\u003cfigcaption style=\"text-align:center; margin-top:8px; font-size:12px; line-height:1.7; color:#7D7A75;\"\u003eteamLab, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/pillars-constantflux-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003ePillar of Constant Flux\u003c/a\u003e\u003c/i\u003e, 2026-, from the series Pillars that Dance with the Wind, 2023- © teamLab *Composite image. Not an actual exhibition photo.\n\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nThe artwork is strongly influenced by the environment, such as wind, rain, and humidity, significantly changing its movement and height. As long as the environment that gives rise to existence is maintained and the flow continues, the artwork’s existence is maintained even whilst it constantly changes shape.\u003cbr\u003e\u003cbr\u003e\n\nIt is continually moving, flexible, soft, and fragile.\n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003eAutonomous Resonating Life\u003c/h2\u003e\n\n\u003cfigure style=\"max-width:600px; width:100%; margin:32px auto;\"\u003e\n\u003cimg src=\"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/2e7039ec-78dd-4e8b-c9c8-946f9fe28800/public\" alt=\"\" loading=\"lazy\" style=\"display:block; width:100%; height:auto;\"\u003e\n\u003cfigcaption style=\"text-align:center; margin-top:8px; font-size:12px; line-height:1.7; color:#7D7A75;\"\u003eteamLab, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/resonatinglife-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eAutonomous Resonating Life\u003c/a\u003e\u003c/i\u003e, 2017- © teamLab\u003cbr\u003e\n*Photo from a previous exhibition. Shot in real space. No AI or CGI.\n\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nEach Ovoid, when pushed by a person, shines brightly, sounds a tone, and rises back up on its own. The surrounding Ovoids then resonate one after another, continuously transmitting the same light and tone.\u003cbr\u003e\u003cbr\u003e\n\nThe light and color of the ovoids continues to resonate out to the surrounding artwork, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/resonatingtrees-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eResonating Trees\u003c/a\u003e\u003c/i\u003e. The artwork space is transformed by people’s actions, making people and the environment part of the artwork. \n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003eResonating Microcosms - Solidified Light\u003c/h2\u003e\n\n\u003cfigure style=\"max-width:600px; width:100%; margin:32px auto;\"\u003e\n\u003cimg src=\"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/ab10d6ac-f01d-4760-e184-87876432a800/public\" alt=\"\" loading=\"lazy\" style=\"display:block; width:100%; height:auto;\"\u003e\n\u003cfigcaption style=\"text-align:center; margin-top:8px; font-size:12px; line-height:1.7; color:#7D7A75;\"\u003eteamLab, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/resonatingmicrocosms-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eResonating Microcosms - Solidified Light\u003c/a\u003e\u003c/i\u003e, 2022-, from the series teamLabBall, 2009- © teamLab *Photo from a previous exhibition. Shot in real space. No AI or CGI.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nWhen each ovoid is pushed over by a person, it shines brightly and emits a sound tone as it rights itself. The surrounding ovoids also respond one after another, and the same light color and tone continues to resonate out. The artwork space is transformed by people's actions, making people and the environment part of the artwork.\u003cbr\u003e\u003cbr\u003e\n\nThe patterns of color that appear within the ovoid exist as infinite possibilities until they are seen, and only at the moment it is viewed from a certain perspective is a single appearance fixed. They continue to transform in response to the viewer's moving body, the fluctuations of the sculpture itself, and the surrounding environment.\n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003eResonating Trees\u003c/h2\u003e\n\n\u003cfigure style=\"max-width:600px; width:100%; margin:32px auto;\"\u003e\n\u003cimg src=\"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/8506f59e-421a-4b14-19cb-2136082fcd00/public\" alt=\"\" loading=\"lazy\" style=\"display:block; width:100%; height:auto;\"\u003e\n\u003cfigcaption style=\"text-align:center; margin-top:8px; font-size:12px; line-height:1.7; color:#7D7A75;\"\u003eteamLab, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/resonatingtrees-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eResonating Trees\u003c/a\u003e\u003c/i\u003e, 2014- © teamLab\u003cbr\u003e*Photo from a previous exhibition. Shot in real space. No AI or CGI.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nEach tree shines brightly and resonates a tone when people or wild animals approach it. The surrounding trees respond one after another, continuously transmitting the light and tone.\u003cbr\u003e\u003cbr\u003e\n\nThe trees also resonate with the surrounding artwork, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/resonatinglife-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eAutonomous Resonating Life\u003c/a\u003e\u003c/i\u003e, creating a continuous flow of light and tone with each other. If a wave of light approaches from the depths of the trees, it signifies the presence of people or wild animals there. The artwork space is transformed by the body, the behavior of others and wild animals, as well as the surrounding artworks, making the people and the environment a part of the work. \n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003eSpherical Crystallized Light\u003c/h2\u003e\n\n\u003cfigure style=\"max-width:600px; width:100%; margin:32px auto;\"\u003e\n\u003cimg src=\"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/0e793862-cb81-436b-6722-e7c50debbc00/public\" alt=\"\" loading=\"lazy\" style=\"display:block; width:100%; height:auto;\"\u003e\n\u003cfigcaption style=\"text-align:center; margin-top:8px; font-size:12px; line-height:1.7; color:#7D7A75;\"\u003eteamLab, \u003ci\u003e\u003ca href=\"https://www.teamlab.art/ew/sphericalcrystallizedlight-hamarikyu/hamarikyu/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003eSpherical Crystallized Light\u003c/a\u003e\u003c/i\u003e, 2024, from the series \u003ci\u003eBubble Universe: Spherical Crystallized Light, Wobbling Light, and Environmental Light - One Stroke\u003c/i\u003e, 2023 © teamLab\u003cbr\u003e\n*Photo from a previous exhibition. Shot in real space. No AI or CGI.\u003c/figcaption\u003e\n\u003c/figure\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nWhat are you looking at? And does it exist?\u003cbr\u003e\u003cbr\u003e\n\nA sphere of light exists in the center of a transparent sphere. However, this sphere of light does not exist.\u003cbr\u003e\nThere is no material, such as glass, on the surface of the sphere of light; this sphere is made only of light. However, in the physical world, light does not solidify, and light does not become a spherical mass. In other words, this sphere of light does not exist.\nThis sphere does not exist in the physical world, but is a Cognitive Sculpture that exists in the world of perception. Its materials are light, body, and perception. A sculpture that is shaped by the dynamic body and perception of the person experiencing it, and that only appears and exists in the world of perception of the person experiencing it. When it exists in perception, it exists.\u003cbr\u003e\nThe artwork questions perception and existence, and opens up the possibility of new existence that is different from material existence.\n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003eteamLab: Hama-rikyu Gardens Concept \u003c/h2\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nHama-rikyu Gardens is a representative example of a daimyo garden—a garden belonging to a feudal lord—from the Edo period (1603 - 1868). Its tidal pond, Shioiri-no-ike, draws seawater from Tokyo Bay, its scenery changing with the ebb and flow of the tides. The site was originally a coastal marshland covered with reeds, where the Tokugawa shoguns hunted waterfowl with hawks. Land reclamation began around 1654, and a residence known as “Kofu Hama-yashiki” was subsequently built here. During the reign of the sixth shogun (1709 - 1712), it became known as “Hama-goten” and served the shogun family for approximately 160 years. With the beginning of the Meiji era, it became an imperial detached palace. Although many of its buildings were lost to earthquakes and war, the gardens opened to the public in 1946 as a gift from the Imperial Family.\u003cbr\u003e\u003cbr\u003e\n\nFor approximately 400 years, this site has remained in use, its role evolving from a falconry ground to a retreat for the shogun family, then an imperial detached palace, and finally a garden for the public. In this exhibition, the garden, with its long continuity of time, becomes an art space. Influenced by the wind and rain, as well as by the ever-changing forest, this art space is transformed by the existence of the people of today.\u003cbr\u003e\u003cbr\u003e\n\nAs we wander through the garden’s forest, walking where layers of time and the present intersect, nature and people, the long continuity of time and the present, all form a continuity without boundaries.\n\u003c/p\u003e\n\n\u003ch2 style=\"margin:clamp(40px,6vw,48px) 0 16px; font-size:clamp(18px,3.2vw,20px); line-height:1.6; font-weight:700;\"\u003eMessage from Ou Sugiyama, Producer of the Hama-rikyu Art Project (SHINRYOIKI, Inc.)\u003c/h2\u003e\n\n\u003cp style=\"margin:0 0 24px;\"\u003e\nA garden designated as a Special Place of Scenic Beauty and a Special Historic Site of Japan with a long and distinguished history. We are deeply honored to present \"teamLab: Hama-rikyu Gardens\" in this irreplaceable setting, together with the internationally renowned art collective teamLab.\u003cbr\u003e\nWith the utmost respect for the garden's history and natural environment, passed down since the Edo period, we will create an experience through art that reveals a distinctive side of Hama-rikyu after dark, unlike anything seen during the day. We look forward to sharing these unique sights with visitors from across Japan and around the world.\n\u003c/p\u003e"}],"meta":{},"recommendExhibitions":[],"nearbyExhibitions":[{"title":"Universe of Water Particles on the Living Wall","url":"/e/ginzasix/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/mv3EFmTT7JxKWcstnmG8LK/public","term":"2017.4.20(木) - 常設","label":"Public Art","address":"GINZA SIX, 銀座, 東京","lpUrl":null},{"title":"MoonFlower Sagaya Ginza, Art by teamLab","url":"/e/sagaya/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/2nt7p2MsmAGs5Gq3Rim3JT/public","term":"2017.4.01(土) - ","label":"Restaurant","address":"MoonFlower Sagaya Ginza, 東京","lpUrl":null},{"title":"森ビル デジタルアート ミュージアム：エプソン チームラボボーダレス","url":"/e/tokyo/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/Yt5eET5oZzm6FBicauQUSY/public","term":"2024.2.09(金) - 常設","label":"teamLab Museum","address":"麻布台ヒルズ, 東京","lpUrl":null},{"title":"チームラボプラネッツ TOKYO DMM","url":"/e/planets/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/public","term":"2018.7.07(土) – 2027年末","label":"teamLab Museum","address":"豊洲, 東京","lpUrl":null},{"title":"Continuous Life in Cubes of Light - Copper","url":"/e/mirailabpalette/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/GKNr6ShsZK2sz554cWtAnF/public","term":"2020.1.14(火) - 常設","address":"MIRAI LAB PALETTE, 東京","lpUrl":null}
