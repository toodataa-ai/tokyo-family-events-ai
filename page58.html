2-bb23-3a89ee0a19da",1518591100346,{"baseWidth":185,"height":191,"isAutoHeight":24,"width":185,"workingState":24},600,"web",1518792996878,"4.2.0",[196,209,234,241,269,279,296,307,318,328,351,360,374,381,388,401,433,463,481,521,532,541,568,581,588,599,606,613,623,638,665,673,678,682,686,690,694,698,702,706,710,714,718,722,726,730,734,738,742,746,750,754,758,762,766,770,774,778,782,786,790],{"head":197,"id":201,"position":202,"type":204,"uuid":205,"symbolIds":206},{"meta":198,"title":200},{"description":199,"og:image":19},"謎解きは新たな次元へ。「ヰ空間（いくうかん）」は、現実と虚構の境界を越える没入型体験レーベルです。スクリーンの中では決して味わえない、リアルで没入感あふれる新しい体験をお届けいたします。「この街で何かが起こるかもしれない」というワクワク感、そして現実世界が物語に侵食されるドキドキ感を、あなた自身の足で確かめてください。","ヰ空間｜謎解きは新たな次元へ","\u002F",{"x":203,"y":203},0,"page","bf9fed39-ac7e-4c42-aa12-40d655a39612",[207,208],"b5a6493f-8294-4d8d-8441-c6971bd0aaf9","2c3ce8ff-1aae-4bb4-9620-4402963c9236",{"head":210,"id":231,"type":204,"uuid":232,"symbolIds":233},{"customCode":211,"favicon":226,"meta":227,"title":230},{"bodyEnd":212,"headEnd":217},[213],{"memo":214,"src":215,"uuid":216},"yell-logic","\u003Cscript>\n(function () {\n  const $ = (id) => document.getElementById(id);\n\n  \u002F\u002F ---------- 定数 ----------\n  const IMAGE_BASE = 'https:\u002F\u002Fres.cloudinary.com\u002Fdtyklfxyu\u002Fimage\u002Fupload\u002F%E3%82%A2%E3%82%A4%E3%83%89%E3%83%AB\u002F';\n  const LP_URL = 'https:\u002F\u002Fi-ku-kan.com\u002Fmixstars';\n\n  \u002F\u002F ---------- メンバー定義 ----------\n  const MEMBERS = {\n    mano:    { nick: 'まのまの',   fullName: '天野茉乃',   label: 'まのまの (天野 茉乃)',   color: '#FF7BAC', heart: '🩷', secretKeyword: 'まのまのしか勝たん', quoteUrl: 'https:\u002F\u002Fx.com\u002Fi_kukan\u002Fstatus\u002F2115035795606102424' },\n    towa:    { nick: 'とわさま',   fullName: '西園寺冬和', label: 'とわさま (西園寺 冬和)', color: '#55C7FF', heart: '🩵', secretKeyword: '冬和をセンターに',     quoteUrl: 'https:\u002F\u002Fx.com\u002Fi_kukan\u002Fstatus\u002F2115389065004744994' },\n    iroha:   { nick: 'のいちゃん', fullName: '矢野いろは', label: 'のいちゃん (矢野 いろは)', color: '#FFDD3A', heart: '💛' },\n    midori:  { nick: 'はつせみ',   fullName: '初瀬翠',     label: 'はつせみ (初瀬 翠)',     color: '#A4EC74', heart: '💚' },\n    nonoka:  { nick: 'もっち',     fullName: '望月野々香', label: 'もっち (望月 野々香)',   color: '#C9A2F3', heart: '💜' },\n    manager: { nick: 'マネージャー', fullName: '⬛︎⬛︎⬛︎⬛︎', label: 'マネージャー',       color: '#000000', heart: '🖤', quoteUrl: 'https:\u002F\u002Fx.com\u002Fi_kukan\u002Fstatus\u002F2117195018263822620' },\n  };\n\n  \u002F\u002F ---------- 状態（モーダルが後から出ても再適用できるよう保持） ----------\n  const state = { current: null, written: '', shareUrl: '' };\n\n  \u002F\u002F ---------- 特殊演出判定 ----------\n  \u002F\u002F ・マネージャー選択（メッセージ任意）\n  \u002F\u002F ・mano + 「まのまのしか勝たん」\n  \u002F\u002F ・towa + 「冬和をセンターに」\n  function isSpecial() {\n    const key = state.current;\n    const m = MEMBERS[key];\n    if (!m) return false;\n    if (key === 'manager') return true;\n    return !!m.secretKeyword && state.written.includes(m.secretKeyword);\n  }\n\n  function confirmImageUrl() {\n    const key = state.current;\n    if (!key) return '';\n    const name = isSpecial() ? `special_${key}` : `normal_${key}`;\n    return IMAGE_BASE + name + '.png';\n  }\n\n  function shareText() {\n    const m = MEMBERS[state.current];\n    if (!m) return '';\n    if (isSpecial()) {\n      const tags = '#ミクスタ謎　#ヰ空間';\n      \u002F\u002F 引用元ポストがあるメンバーは、末尾にポストURLを置いて引用形式にする\n      if (m.quoteUrl) {\n        return (\n          `私は${m.fullName}の秘密のメッセージを発見した${m.heart}\\n` +\n          `あなたも好きなメンバーにメッセージを送ろう✉️\\n` +\n          `${LP_URL}\\n` +\n          `\\n` +\n          `${tags}\\n` +\n          m.quoteUrl\n        );\n      }\n      return (\n        `私は${m.fullName}の秘密のメッセージを発見した${m.heart}\\n` +\n        `あなたも好きなメンバーにメッセージを送ろう✉️\\n` +\n        `\\n` +\n        `${tags}\\n` +\n        LP_URL\n      );\n    }\n    return (\n      `私は${m.nick}を応援した${m.heart}\\n` +\n      `あなたも好きなメンバーにメッセージを送ろう✉️\\n` +\n      `\\n` +\n      `#ミクスタ謎　#ヰ空間\\n` +\n      LP_URL\n    );\n  }\n\n  function shareUrl() {\n    return 'https:\u002F\u002Ftwitter.com\u002Fintent\u002Ftweet?text=' + encodeURIComponent(shareText());\n  }\n\n  \u002F\u002F 現在の状態をDOMに反映する。要素が無ければスキップ（後で再実行される）\n  \u002F\u002F ※ 値が同じなら書き込まない（Observerとの無限ループ防止）\n  let applying = false;\n  function applyState() {\n    if (applying) return;\n    applying = true;\n    try {\n      const m = MEMBERS[state.current];\n      Object.keys(MEMBERS).forEach((k) => {\n        const el = $('select-' + k);\n        if (!el) return;\n        const color = (m && k === state.current) ? m.color : '';\n        if (el.style.backgroundColor !== color) el.style.backgroundColor = color;\n      });\n      const selected = $('selected');\n      if (selected && m && selected.textContent !== m.label) selected.textContent = m.label;\n      const written = $('written');\n      if (written && written.textContent !== state.written) written.textContent = state.written;\n\n      \u002F\u002F 送信完了後の画像・シェアリンク（モーダルが後から出ても反映）\n      if (state.shareUrl) {\n        const img = $('confirm-image');\n        const imgUrl = confirmImageUrl();\n        if (img && imgUrl && img.getAttribute('src') !== imgUrl) img.setAttribute('src', imgUrl);\n        const share = $('x-share');\n        if (share && share.getAttribute('href') !== state.shareUrl) {\n          share.setAttribute('href', state.shareUrl);\n          share.setAttribute('target', '_blank');\n          share.setAttribute('rel', 'noopener');\n        }\n      }\n      wrapManagerKeyword();\n    } finally {\n      applying = false;\n    }\n  }\n\n  function select(key) {\n    if (!MEMBERS[key]) return;\n    state.current = key;\n    applyState();\n  }\n\n  \u002F\u002F ---------- 「マネージャー」のspan化（何度呼んでも二重にならない） ----------\n  function wrapManagerKeyword() {\n    const root = $('manager-text');\n    if (!root || root.dataset.wrapped === '1') return;\n    const keyword = 'マネージャー';\n    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);\n    const targets = [];\n    while (walker.nextNode()) {\n      if (walker.currentNode.nodeValue.includes(keyword)) targets.push(walker.currentNode);\n    }\n    targets.forEach((node) => {\n      const frag = document.createDocumentFragment();\n      const parts = node.nodeValue.split(keyword);\n      parts.forEach((part, i) => {\n        if (part) frag.appendChild(document.createTextNode(part));\n        if (i \u003C parts.length - 1) {\n          const span = document.createElement('span');\n          span.className = 'manager-keyword';\n          span.textContent = keyword;\n          \u002F\u002F Studio側の span スタイルを打ち消し、親のテキストスタイルだけを継承させる\n          span.style.cssText =\n            'all: unset !important;' +\n            'display: inline !important;' +\n            'font: inherit !important;' +\n            'color: inherit !important;' +\n            'line-height: inherit !important;' +\n            'letter-spacing: inherit !important;' +\n            'white-space: inherit !important;' +\n            'cursor: pointer !important;';\n          frag.appendChild(span);\n        }\n      });\n      node.parentNode.replaceChild(frag, node);\n    });\n    \u002F\u002F 親が display:flex \u002F grid の場合、キーワードspanが別アイテムとして横に並び\n    \u002F\u002F 折り返しが崩れるため、中身全体を1つのラッパーで包んで1アイテムにまとめる\n    const wrapper = document.createElement('span');\n    wrapper.style.cssText =\n      'all: unset !important;' +\n      'display: inline !important;' +\n      'font: inherit !important;' +\n      'color: inherit !important;' +\n      'line-height: inherit !important;' +\n      'letter-spacing: inherit !important;' +\n      'white-space: inherit !important;' +\n      'text-align: inherit !important;' +\n      'flex: 1 1 auto !important;' +\n      'min-width: 0 !important;';\n    while (root.firstChild) wrapper.appendChild(root.firstChild);\n    root.appendChild(wrapper);\n    root.dataset.wrapped = '1';\n  }\n\n  \u002F\u002F ---------- DOMの変化を監視して、モーダル出現時に状態を再適用 ----------\n  \u002F\u002F 連続した変化は1フレームにまとめて1回だけ処理する\n  let scheduled = false;\n  const observer = new MutationObserver(() => {\n    if (applying || scheduled) return;\n    scheduled = true;\n    requestAnimationFrame(() => {\n      scheduled = false;\n      applyState();\n    });\n  });\n  observer.observe(document.body, { childList: true, subtree: true });\n  applyState();\n\n  \u002F\u002F ---------- towa-tap 5回連続 ----------\n  let tapCount = 0;\n  let tapTimer = null;\n\n  \u002F\u002F ---------- 表示切替ヘルパー ----------\n  function flash(id) {\n    const el = $(id);\n    if (!el) return;\n    el.style.display = 'inline-block';\n    setTimeout(() => { el.style.display = 'none'; }, 3000);\n  }\n\n  \u002F\u002F ---------- 全クリックを document で受けて振り分け（イベント委譲） ----------\n  document.addEventListener('click', (e) => {\n    const t = e.target;\n    const hit = (id) => t.closest('#' + id);\n\n    \u002F\u002F 1. towa-tap\n    if (hit('towa-tap')) {\n      tapCount++;\n      clearTimeout(tapTimer);\n      tapTimer = setTimeout(() => { tapCount = 0; }, 1000);\n      if (tapCount >= 5) {\n        tapCount = 0;\n        location.href = 'https:\u002F\u002Fi-ku-kan.com\u002Fmixstar\u002Ftowa-message';\n      }\n      return;\n    }\n\n    \u002F\u002F 2. box-*\n    for (const key of ['mano', 'towa', 'iroha', 'midori', 'nonoka']) {\n      if (hit('box-' + key)) { select(key); return; }\n    }\n\n    \u002F\u002F 3. check-content\n    if (hit('check-content')) {\n      const message = $('message');\n      state.written = message ? message.value : '';\n      applyState();\n      return;\n    }\n\n    \u002F\u002F 4. マネージャー（文字列 or #select-manager）\n    if ((t.classList && t.classList.contains('manager-keyword')) || hit('select-manager')) {\n      select('manager');\n      return;\n    }\n\n    \u002F\u002F 5. submit\n    if (hit('submit')) {\n      const hasMember = state.current !== null;\n      \u002F\u002F マネージャーはメッセージ任意\n      const hasMessage = state.current === 'manager' || state.written.trim() !== '';\n      if (!hasMember) flash('member-error');\n      if (!hasMessage) flash('message-error');\n      if (hasMember && hasMessage) {\n        state.shareUrl = shareUrl();\n        const confirmEl = $('confirm');\n        const completeEl = $('complete');\n        if (confirmEl) confirmEl.style.display = 'none';\n        if (completeEl) completeEl.style.display = 'flex';\n        applyState(); \u002F\u002F confirm-image \u002F x-share を反映\n      }\n      return;\n    }\n\n    \u002F\u002F 6. x-share\n    if (hit('x-share')) {\n      const el = hit('x-share');\n      \u002F\u002F href が埋め込まれていればブラウザのリンク遷移に任せる\n      if (el.tagName === 'A' && el.getAttribute('href')) return;\n      const url = state.shareUrl || shareUrl();\n      if (!url) return;\n      window.open(url, '_blank', 'noopener');\n      return;\n    }\n  });\n})();\n\u003C\u002Fscript>","992792b9-886c-4cb1-a37c-3f0880c8071e",[218],{"memo":219,"src":220,"tags":221,"uuid":225},"overlay disabler","\u003Cstyle>\n  #carouselbuttongroup {\n    pointer-events: none !important;\n    -webkit-user-select: none !important;\n    user-select: none !important;\n    -webkit-touch-callout: none !important;\n    -webkit-tap-highlight-color: transparent !important;\n  }\n\u003C\u002Fstyle>",[222],{"children":223,"tagName":224},"#carouselbuttongroup {\n    pointer-events: none !important;\n    -webkit-user-select: none !important;\n    user-select: none !important;\n    -webkit-touch-callout: none !important;\n    -webkit-tap-highlight-color: transparent !important;\n  }","style","0a53a649-cdef-4b4d-9107-143587a6b001","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F59890ccf-7a24-44a6-989a-88b1ccc6f5b1",{"description":228,"og:image":229},"ヰ空間による自宅型没入体験キット。あなたは、デビュー直前に解散となったアイドルグループ「MIXStars」にまつわる品々を手にいれる。あなたの推理で彼女たちの隠された裏の顔に迫ろう。","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002Fb5a68390-3f90-4384-9fa2-d661ccf8c040","MIXStars Project　(ミクスタ)","mixstars","fc47702f-764b-401a-b569-7b83b7b99af3",[],{"head":235,"id":238,"type":204,"uuid":239,"symbolIds":240},{"meta":236,"title":19},{"robots":237},"noindex","mixstars\u002Ftowa-message","dc5491b2-e0e6-4ece-af7f-08c70d35a763",[],{"head":242,"id":266,"type":204,"uuid":267,"symbolIds":268},{"customCode":243,"favicon":261,"meta":262,"title":265},{"bodyEnd":244,"headEnd":253},[245,249],{"memo":246,"src":247,"uuid":248},"New Code 1","\u003C!-- ===== LOADING overlay (Studio custom code \u002F body) ===== -->\n\u003Cdiv id=\"ld-overlay\" role=\"status\" aria-live=\"polite\">\n  \u003Cvideo id=\"ld-video\" class=\"ld-bg\" src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002FRQqJNgn3qg\u002Fs-356x680_9ce2f66d-d52b-407a-905e-14c85dc07408.mp4\" autoplay muted loop playsinline>\u003C\u002Fvideo>\n  \u003Ccanvas id=\"ld-canvas\" class=\"ld-bg\" hidden>\u003C\u002Fcanvas>\n\n  \u003Cdiv class=\"ld-ui\">\n    \u003Cdiv class=\"ld-label\">LOADING\u003C\u002Fdiv>\n    \u003Cdiv class=\"ld-meter\">\u003Cdiv id=\"ld-fill\" class=\"ld-fill\">\u003C\u002Fdiv>\u003C\u002Fdiv>\n    \u003Cdiv class=\"ld-glow ld-glow-l\">\u003C\u002Fdiv>\n    \u003Cdiv class=\"ld-glow ld-glow-r\">\u003C\u002Fdiv>\n  \u003C\u002Fdiv>\n\u003C\u002Fdiv>\n\n\u003Cstyle>\n  \u002F* オーバーレイ本体と中身すべてをクリック透過 *\u002F\n  #ld-overlay, #ld-overlay * { pointer-events: none !important; }\n\n  #ld-overlay{\n    position:fixed; top:0; left:50%; transform:translateX(-50%);\n    width:400px; max-width:100vw; height:100dvh; z-index:100;\n    background:#000; overflow:hidden;\n    display:flex; align-items:center; justify-content:center;\n    opacity:1; transition:opacity 1.2s ease;\n  }\n  #ld-overlay.ld-out{ opacity:0; }\n\n  #ld-overlay .ld-bg{\n    position:absolute; inset:0; width:100%; height:100%;\n    object-fit:cover; display:block;\n  }\n\n  #ld-overlay .ld-ui{\n    position:relative; width:min(75%, 360px);\n    display:flex; flex-direction:column; align-items:center;\n    font-family:\"Helvetica Neue\", Arial, sans-serif; color:#fff;\n  }\n  #ld-overlay .ld-label{\n    font-size:14px; font-weight:700; letter-spacing:.06em; margin-bottom:12px;\n    text-shadow:0 0 6px rgba(0,0,0,.8);\n  }\n  #ld-overlay .ld-meter{\n    width:100%; height:12px; box-sizing:border-box;\n    background:#000; border:1px solid #e5e5e5; padding:1px;\n  }\n  #ld-overlay .ld-fill{\n    height:100%; width:0%; background:#22AC38;\n    transition:width .18s linear;\n  }\n  #ld-overlay .ld-glow{\n    position:absolute; bottom:-26px; width:70px; height:8px; border-radius:50%;\n    background:radial-gradient(ellipse, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);\n    filter:blur(2px);\n  }\n  #ld-overlay .ld-glow-l{ left:-6%; }\n  #ld-overlay .ld-glow-r{ right:6%; }\n\n  @media (prefers-reduced-motion: reduce){\n    #ld-overlay{ transition:none; }\n    #ld-overlay .ld-fill{ transition:none; }\n  }\n\u003C\u002Fstyle>\n\n\u003Cscript>\n(function(){\n  var DURATION = 3000;   \u002F\u002F 溜まりきるまでの時間 (ms)\n  var HOLD     = 400;    \u002F\u002F 100%になってからフェード開始までの間 (ms)\n\n  var overlay = document.getElementById('ld-overlay');\n  var fill    = document.getElementById('ld-fill');\n  var video   = document.getElementById('ld-video');\n  var canvas  = document.getElementById('ld-canvas');\n  if (!overlay) return;\n\n  \u002F* ---- 動画が無い\u002F読めない場合は canvas でノイズを生成 ---- *\u002F\n  function startCanvasNoise(){\n    video.hidden = true; canvas.hidden = false;\n    var ctx = canvas.getContext('2d');\n    function size(){\n      canvas.width  = Math.ceil(overlay.clientWidth  \u002F 3);\n      canvas.height = Math.ceil(overlay.clientHeight \u002F 3);\n    }\n    size(); window.addEventListener('resize', size);\n    var stopped = false;\n    (function draw(){\n      if (stopped) return;\n      var w = canvas.width, h = canvas.height;\n      var img = ctx.createImageData(w, h), d = img.data;\n      for (var i = 0; i \u003C d.length; i += 4){\n        var v = Math.random() * 60;\n        d[i] = v * .6; d[i+1] = v; d[i+2] = v * .7; d[i+3] = 255;\n      }\n      ctx.putImageData(img, 0, 0);\n      ctx.fillStyle = 'rgba(255,255,255,.08)';\n      for (var k = 0; k \u003C 4; k++){\n        ctx.fillRect(0, Math.random() * h, w, 1 + Math.random() * 2);\n      }\n      requestAnimationFrame(draw);\n    })();\n    overlay.addEventListener('transitionend', function(){ stopped = true; });\n  }\n  video.addEventListener('error', startCanvasNoise);\n  if (!video.getAttribute('src')) startCanvasNoise();\n\n  \u002F* ---- メーター進行 ---- *\u002F\n  var progress = 0, start = performance.now();\n  function tick(){\n    var elapsed = performance.now() - start;\n    var target  = Math.min(100, (elapsed \u002F DURATION) * 100);\n    if (Math.random() > .3) progress += (target - progress) * .5;\n    fill.style.width = progress.toFixed(1) + '%';\n    if (elapsed \u003C DURATION){\n      setTimeout(tick, 120 + Math.random() * 180);\n    } else {\n      fill.style.width = '100%';\n      setTimeout(finish, HOLD);\n    }\n  }\n  function finish(){\n    overlay.classList.add('ld-out');\n    overlay.addEventListener('transitionend', function(){\n      overlay.remove();\n      document.dispatchEvent(new CustomEvent('loading:done'));\n    }, { once:true });\n  }\n  tick();\n})();\n\u003C\u002Fscript>\n\u003C!-- ===== \u002FLOADING overlay ===== -->","852f4541-2473-4e30-a1ab-1ea119011ab4",{"memo":250,"src":251,"uuid":252},"New Code 2","\u003C!-- ===== Text scramble (decode) animation ===== -->\n\u003Cscript>\n(function(){\n  var TARGET_ID = 'hero-text';   \u002F\u002F アニメーションさせる要素のid\n  var DELAY     = 300;           \u002F\u002F 表示されてからアニメーション開始までの待ち時間 (ms)\n  var DURATION  = 1000;          \u002F\u002F 全体が確定するまでの時間 (ms)\n  var FRAME_MS  = 40;            \u002F\u002F ランダム文字を差し替える間隔 (ms)\n  var CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?*#%&@$+=\u003C>' +\n              'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん' +\n              'アイウエオカキクサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';\n\n  function rand(){ return CHARS[Math.floor(Math.random() * CHARS.length)]; }\n  function isSpace(c){ return c === ' ' || c === '\\n' || c === '\\r' || c === '\\t' || c === '\\u3000'; }\n\n  \u002F\u002F \u003Cbr> や \u003Cspan> を壊さないよう、要素内のテキストノードだけを集める\n  function collectTextNodes(el){\n    var nodes = [], walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);\n    var n; while ((n = walker.nextNode())) if (n.nodeValue.trim()) nodes.push(n);\n    return nodes;\n  }\n\n  function scramble(el){\n    var nodes = collectTextNodes(el);\n    var originals = nodes.map(function(n){ return n.nodeValue; });\n    var total = originals.join('').length;\n    \u002F\u002F 全ノードを通して左→右の順に確定タイミングを割り当て\n    var settleAt = [], idx = 0;\n    originals.forEach(function(text){\n      var arr = [];\n      for (var i = 0; i \u003C text.length; i++, idx++){\n        arr.push((idx \u002F total) * DURATION + Math.random() * DURATION * 0.25);\n      }\n      settleAt.push(arr);\n    });\n    var start = performance.now();\n\n    function frame(){\n      var elapsed = performance.now() - start, done = true;\n      nodes.forEach(function(node, ni){\n        var text = originals[ni], out = '';\n        for (var i = 0; i \u003C text.length; i++){\n          var c = text[i];\n          if (isSpace(c)) { out += c; continue; }\n          if (elapsed >= settleAt[ni][i]) out += c;\n          else { done = false; out += rand(); }\n        }\n        node.nodeValue = out;\n      });\n      if (!done) setTimeout(frame, FRAME_MS);\n    }\n    frame();\n  }\n\n  \u002F\u002F 「本当に見えている」判定: 画面内 かつ opacity\u002Fvisibility が有効\n  function isVisible(el){\n    var r = el.getBoundingClientRect();\n    if (r.width === 0 || r.height === 0) return false;\n    if (r.bottom \u003C 0 || r.top > window.innerHeight) return false;\n    var e = el;\n    while (e && e !== document.body){\n      var s = getComputedStyle(e);\n      if (s.visibility === 'hidden' || s.display === 'none' || parseFloat(s.opacity) \u003C 0.5) return false;\n      e = e.parentElement;\n    }\n    return true;\n  }\n\n  function init(){\n    var el = document.getElementById(TARGET_ID);\n    if (!el) return;\n    \u002F\u002F 本文がチラ見えしないよう、最初はランダム文字で埋めておく\n    collectTextNodes(el).forEach(function(node){\n      var orig = node.nodeValue, out = '';\n      for (var i = 0; i \u003C orig.length; i++) out += isSpace(orig[i]) ? orig[i] : rand();\n      node.__orig = orig; node.nodeValue = out;\n    });\n    var started = false;\n    function check(){\n      if (started) return;\n      if (isVisible(el)){\n        started = true;\n        setTimeout(function(){\n          \u002F\u002F 元のテキストに戻してからアニメーション開始\n          collectTextNodes(el).forEach(function(n){ if (n.__orig) n.nodeValue = n.__orig; });\n          scramble(el);\n        }, DELAY);\n      } else {\n        requestAnimationFrame(check);\n      }\n    }\n    check();\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\n  else init();\n})();\n\u003C\u002Fscript>\n\u003C!-- ===== \u002FText scramble ===== -->","e639ca1a-1cc5-4947-a4cb-796e19a5881a",[254],{"memo":255,"src":256,"tags":257,"uuid":260},"keyholder animation","\u003Cstyle>\n  #keyholder{\n    animation: floatY 3s ease-in-out infinite;\n  }\n  @keyframes floatY {\n    0%, 100% { transform: translateY(0); }\n    50%      { transform: translateY(-10px); }\n  }\n\u003C\u002Fstyle>",[258],{"children":259,"tagName":224},"#keyholder{\n    animation: floatY 3s ease-in-out infinite;\n  }\n  @keyframes floatY {\n    0%, 100% { transform: translateY(0); }\n    50%      { transform: translateY(-10px); }\n  }","8a565b2b-d6d7-4c55-a101-8ef1df8cd1e8","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002F77f52726-e8fe-468f-94b0-341259e4c41a",{"description":263,"og:image":264},"ヰ空間レーベルのJR東日本×没入型体験ゲーム。舞台は、山手線を中心とした駅や街。NewDays等で販売、2026年10月9日（金）～2027年3月31日（水）で開催中。","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\ なる場合（PCなど）に上にできる余白を黒で埋める -->\n  \u003Cdiv class=\"fv-top-filler\">\u003C\u002Fdiv>\n  \u003Cdiv class=\"fv-content\">\n    \u003C!-- 写真と同じ縦横比（750:1440）の枠。fv-contentに上下の黒余白ができても、\n         この中の要素は常に写真の実際の表示範囲に追従する -->\n    \u003Cdiv class=\"fv-photo-frame\">\n      \u003C!-- 背景写真（画面下部の「TOKYO DOME CITY × 半空間」ロゴと黒背景バーは焼き込み済み） -->\n      \u003Cdiv class=\"fv-bg\" data-img=\"first_view_back\">\u003C\u002Fdiv>\n\n      \u003C!-- ロゴ＋「調査員」「募集中」の文字（画面中央付近に表示） -->\n      \u003Cdiv class=\"fv-deco fv-logo-message\" data-img=\"logo_and_message\">\u003C\u002Fdiv>\n\n      \u003C!-- giza（ギザギザ)・mozaiku（モザイク）の装飾 -->\n      \u003Cdiv class=\"fv-deco fv-giza-4\" data-img=\"giza_4_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-giza-2\" data-img=\"giza_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-giza-3\" data-img=\"giza_3_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-giza-1\" data-img=\"giza_1_gif\">\u003C\u002Fdiv>\n\n      \u003Cdiv class=\"fv-deco fv-mozaiku-2 fv-mozaiku-2-a\" data-img=\"mozaiku_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-mozaiku-2 fv-mozaiku-2-b\" data-img=\"mozaiku_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-mozaiku-2 fv-mozaiku-2-c\" data-img=\"mozaiku_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-mozaiku-2 fv-mozaiku-2-d\" data-img=\"mozaiku_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-mozaiku-2 fv-mozaiku-2-e\" data-img=\"mozaiku_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-mozaiku-2 fv-mozaiku-2-f\" data-img=\"mozaiku_2_gif\">\u003C\u002Fdiv>\n      \u003Cdiv class=\"fv-deco fv-mozaiku-1\" data-img=\"mozaiku_1_gif\">\u003C\u002Fdiv>\n\n      \u003C!-- 気になるボタン（デフォルト\u002Fホバーで画像切り替え） -->\n      \u003Cbutton type=\"button\" id=\"fv-button\" class=\"fv-button\" data-img=\"button_kininaru\" aria-label=\"応募はコチラから\">\u003C\u002Fbutton>\n\n      \u003C!-- ボタン横の手のアイコン（next\u002Fbackで使用しているhand.gifと同一想定） -->\n      \u003Cdiv class=\"fv-deco fv-hand\" data-img=\"hand_gif\">\u003C\u002Fdiv>\n    \u003C\u002Fdiv>\n  \u003C\u002Fdiv>\n  \u003C\u002Fdiv>\n\n  \u003C!-- スマホのホームバー等で下部が隠れる対策：見えている範囲の一番下に固定表示 -->\n  \u003Cdiv class=\"fv-first-view-footer\" data-img=\"first_view_footer\">\u003C\u002Fdiv>\n\u003C\u002Fdiv>\n\n\u003Cstyle>\n\u002F* ============ first_view：全画面オーバーレイ ============ *\u002F\n.fv-overlay {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100dvw;\n  height: 100dvh;\n  z-index: 999999;\n  background-color: #000;\n  overflow: hidden;\n  opacity: 1;\n  transition: opacity 0.4s ease;\n  display: flex;\n  align-items: flex-end;\n  justify-content: center;\n}\n.fv-overlay.fv-closing {\n  opacity: 0;\n  pointer-events: none;\n}\n\n\u002F* 400pxより広い画面の時だけ、外側に見える背景 *\u002F\n.fv-pc-back {\n  position: absolute;\n  inset: 0;\n  background-size: cover;\n  background-position: center;\n  background-repeat: no-repeat;\n  background-color: rgba(255, 255, 255, 0.06);\n}\n\n\u002F* 最大400px幅の縦積みフレーム。fv-top-fillerとfv-contentを縦に並べる *\u002F\n.fv-frame {\n  position: relative;\n  width: min(400px, 100%);\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n\n\u002F* fv-contentの高さが画面より低くなる場合（PCなど）に上にできる余白を黒で埋める *\u002F\n.fv-top-filler {\n  flex: 1 1 auto;\n  background-color: #000;\n}\n\n\u002F* first_viewの中身は常に画面いっぱい（隙間が出ないようにする）。\n   ただし縦横比は400:866（一般的なスマホ実機と同程度の比率、約2.164）を上限にし、\n   PCなど画面が縦長になるほどトリミング量が増えすぎるのを防ぐ（超えた分は上にfv-top-fillerが見える） *\u002F\n.fv-content {\n  position: relative;\n  width: 100%;\n  height: min(100%, calc(400px * 2.164));\n  flex: none;\n  overflow: hidden;\n  background-color: #000;\n}\n\n\u002F* 写真と同じ縦横比（750:1440）の枠。fv-contentの中で上下中央に配置し、\n   ロゴ・装飾・ボタンはすべてこの枠を基準に配置することで写真とのズレを防ぐ *\u002F\n.fv-photo-frame {\n  position: absolute;\n  left: 0;\n  top: 50%;\n  width: 100%;\n  aspect-ratio: 750 \u002F 1440;\n  transform: translateY(-50%);\n}\n\n\u002F* 背景写真：fv-photo-frameと同じ縦横比なので、トリミングも余白も発生しない *\u002F\n.fv-bg {\n  position: absolute;\n  inset: 0;\n  background- ","【#キンムキロク】有限会社■■■■の勤務奇録","kinmukiroku","1ac5c5c3-c01b-433b-b7c9-b0582143a735",[],{"head":482,"id":518,"type":204,"uuid":519,"symbolIds":520},{"customCode":483,"favicon":513,"lang":181,"meta":514,"title":517},{"bodyEnd":484,"headEnd":505},[485,489,493,497,501],{"memo":486,"src":487,"uuid":488},"firstview","\u003Cscript>\n  let ticking = false;\n\n  function updateSections() {\n    const stages = document.querySelectorAll('[id*=\"scroll-stage\"]');\n    const aList  = document.querySelectorAll('[id*=\"section-a\"]');\n    const bList  = document.querySelectorAll('[id*=\"section-b\"]');\n    if (stages.length === 0 || aList.length === 0 || bList.length === 0) {\n      ticking = false;\n      return;\n    }\n\n    const winH = window.innerHeight;\n\n    stages.forEach((stage, i) => {\n      const a = aList[i];\n      const b = bList[i];\n      if (!a || !b) return;\n\n      \u002F\u002F 表示されていない要素はスキップ(モバイル版がPCで非表示など)\n      if (stage.offsetParent === null) return;\n\n      const stageRect = stage.getBoundingClientRect();\n      const stageHeight = stage.offsetHeight;\n      const scrollable = stageHeight - winH;\n      if (scrollable \u003C= 0) return;\n\n      let progress = -stageRect.top \u002F scrollable;\n      progress = Math.min(Math.max(progress, 0), 1);\n\n      a.style.height = ((1 - progress) * 100) + 'vh';\n      b.style.height = (progress * 100) + 'vh';\n    });\n\n    ticking = false;\n  }\n\n  window.addEventListener('scroll', () => {\n    if (!ticking) {\n      requestAnimationFrame(updateSections);\n      ticking = true;\n    }\n  });\n\n  window.addEventListener('resize', () => {\n    if (!ticking) {\n      requestAnimationFrame(updateSections);\n      ticking = true;\n    }\n  });\n\u003C\u002Fscript>","dd374b3e-33e0-4a54-a028-c55c9dba88d4",{"memo":490,"src":491,"uuid":492},"モーダル文字化けギミック","\u003Cscript>\n(function() {\n    \u002F\u002F ===== 設定エリア =====\n    \u002F\u002F 共通スタイル\n    const inlineStyle = \"color: #ff00ff; font-family: 'Hina Mincho', serif;\";\n \n    \u002F\u002F 各要素の正常テキストと文字化けテキストの対応表\n    \u002F\u002F STUDIOで使うIDをキーにして、ここに追加していけば要素を増やせる\n    const textMap = {\n        'umbrella-text': {\n            normal:    \"ここに傘の商品紹介文を入れる\",\n            corrupted: \"縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ\"\n        },\n        'drill-text': {\n            normal:    \"とある家で大量に見つかった漢字ドリル。呪という字のみが大量に書き込まれている。\",\n            corrupted: \"縺薙％縺ｫ繝峨Μ繝ｫ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ\"\n        },\n        'cat-text': {\n            normal:    \"とある人物の断末魔を聞き続けた結果、猫が「これ以上何も聞きたくない、誰も招きたくない」と、その役目を放棄したとされる。猫の手は誰かが抉り取ったような痕が生々しく残っている。\",\n            corrupted: \"縺薙％縺ｫ迹ｫ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉\"\n        },\n        'case-text': {\n            normal:    \"とある事件の犯人のスマホケース。中に入っていたスマホは証拠品として押収された。スマホを入れていないのに、通知音が鳴ることがあり、ケースを伏せると、音は止まる。\",\n            corrupted: \"縺薙％縺ｫ繧ｱ繝ｼ繧ｹ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵枚繧貞・繧後ｋ縺薙％縺ｫ蛻ｺ縺ｮ蝠�刀邏ｹ莉∵\"\n        },\n        'bag-text': {\n            normal:    \"【ダイヤに5回触れよ】\",\n            corrupted: \"【縺薙％縺ｫ迹ｫ縺ｮ】\"\n        },\n    };\n    \u002F\u002F ===== 設定エリアここまで =====\n \n    const targetIds = Object.keys(textMap);\n    const targetSelector = targetIds.map(function(id) { return '#' + id; }).join(',');\n \n    function initializeText(element) {\n        if (element.dataset.mojibakeInitialized === 'true') return;\n \n        const config = textMap[element.id];\n        if (!config) return;\n \n        const normalText = config.normal;\n        const corruptedText = config.corrupted;\n        const len = Math.min(normalText.length, corruptedText.length);\n        if (len === 0) return;\n \n        element.setAttribute('style', (element.getAttribute('style') || '') + ';' + inlineStyle);\n \n        element.innerHTML = '';\n        for (let i = 0; i \u003C len; i++) {\n            const wrapper = document.createElement('span');\n            wrapper.className = 'mojibake-char';\n            wrapper.dataset.index = i;\n            wrapper.dataset.state = 'corrupted';\n            wrapper.setAttribute('style', inlineStyle);\n \n            const normalSpan = document.createElement('span');\n            normalSpan.className = 'mojibake-normal';\n            normalSpan.setAttribute('style', inlineStyle);\n            normalSpan.textContent = normalText[i];\n \n            const corruptedSpan = document.createElement('span');\n            corruptedSpan.className = 'mojibake-corrupted';\n            corruptedSpan.setAttribute('style', inlineStyle);\n            corruptedSpan.textContent = corruptedText[i];\n \n            wrapper.appendChild(normalSpan);\n            wrapper.appendChild(corruptedSpan);\n            element.appendChild(wrapper);\n        }\n        element.dataset.mojibakeInitialized = 'true';\n    }\n \n    function updateTextBasedOnSelection() {\n        const elements = document.querySelectorAll(targetSelector);\n        if (elements.length === 0) return;\n \n        const selection = window.getSelection();\n \n        elements.forEach(function(element) {\n            if (element.dataset.mojibakeInitialized !== 'true') {\n                initializeText(element);\n            }\n \n            const chars = element.querySelectorAll('.mojibake-char');\n \n            if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {\n                chars.forEach(function(span) {\n                    if (span.dataset.state !== 'corrupted') {\n                        span.dataset.state = 'corrupted';\n                    }\n                });\n                return;\n            }\n \n            chars.forEach(function(span) {\n                const isSelected = selection.containsNode(span, true);\n                const newState = isSelected ? 'normal' : 'corrupted';\n                if (span.dataset.state !== newState) {\n                    span.dataset.state = newState;\n                }\n            });\n        });\n    }\n \n    document.addEventListener('selectionchange', updateTextBasedOnSelection);\n \n    const observer = new MutationObserver(function(mutations) {\n        let needsInit = false;\n        mutations.forEach(function(mutation) {\n            mutation.addedNodes.forEach(function(node) {\n                if (node.nodeType !== Node.ELEMENT_NODE) return;\n                if (node.id && textMap[node.id]) {\n                    needsInit = true;\n                } else if (node.querySelector && node.querySelector(targetSelector)) {\n                    needsInit = true;\n                }\n            });\n        });\n        if (needsInit) {\n            const elements = document.querySelectorAll(targetSelector);\n            elements.forEach(function(el) {\n                el.dataset.mojibakeInitialized = 'false';\n                initializeText(el);\n            });\n        }\n    });\n \n    function start() {\n        const elements = document.querySelectorAll(targetSelector);\n        elements.forEach(initializeText);\n \n        observer.observe(document.body, {\n            childList: true,\n            subtree: true\n        });\n    }\n \n    if (document.readyState === 'loading') {\n        document.addEventListener('DOMContentLoaded', start);\n    } else {\n        start();\n    }\n})();\n\u003C\u002Fscript>","65de69d3-eae1-4eaf-9f45-78a13522d34e",{"memo":494,"src":495,"uuid":496},"カサテキスト","\u003Cscript>\n  (function() {\n    const normalText2 = \"雨の日に誰かに盗まれ、その恨みから「盗んだ者の手を離さない」という呪いが宿った傘。傘の内側には「盗んだ人間の名前」が、何者かによってびっしりと貼られている。\";\n    const corruptedText2 = \"縺薙ｌ縺ｯ繝繝ｫ繝槭�蝠�刀邏ｹ莉九〒縺吶％繧後�繝繝ｫ繝槭�蝠�刀邏ｹ莉九〒縺�\";\n \n    const len = Math.min(normalText2.length, corruptedText2.length);\n \n    if (!document.getElementById('umbrella-style')) {\n        const style = document.createElement('style');\n        style.id = 'umbrella-style';\n        style.textContent = `\n            #umbrella-text {\n                word-break: break-all;\n                overflow-wrap: break-word;\n
