name: Validate and Deploy Tokyo Family Events AI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'tests/**'
      - 'prompts/**'
      - 'package.json'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate canonical prompt governance
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Enrich thumbnail URLs from official/source page metadata
        run: python tools/enrich_images.py site/data
      - name: Validate event data strictly
        run: python tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Test copy contract and shared filters
        run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enrich thumbnail URLs for published artifact
        run: python tools/enrich_images.py site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
