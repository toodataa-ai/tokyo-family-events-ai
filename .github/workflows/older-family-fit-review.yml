name: Verify older non-Tamemap assessments while preserving all448 event facts
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/validate_older_family_fit_correction.py'
      - 'tools/validate_family_fit_quality.py'
      - 'tests/test_family_fit_quality.py'
      - 'tests/test_older_family_fit_gate.py'
      - 'research/older_family_fit_review_20261114/**'
      - '.github/workflows/older-family-fit-review.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/checkout@v4
        with:
          ref: 273c8753a9d5ea09f38e580d4c51b4c87abd0189
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression suite including old-record and source-error preservation
        working-directory: scanner
        run: |
          npm test
          python3 -m unittest discover -s tests -p test_older_family_fit_gate.py
      - name: Verify the frozen 58-file assessment candidate and all existing records
        working-directory: candidate
        run: |
          python3 ../scanner/tools/validate_family_fit_quality.py --base-ref 9dce04230d9a8a257f8ce6d035f66122250d5d69
          python3 ../scanner/tools/validate_older_family_fit_correction.py --base-ref 9dce04230d9a8a257f8ce6d035f66122250d5d69
          python3 ../scanner/tools/validate_data.py --strict --min-image-coverage 0.70 site/data
          python3 ../scanner/tools/validate_decisions.py --strict site/data
          python3 ../scanner/tools/validate_rereview.py --strict site/data
          python3 ../scanner/tools/audit_event_image_identity.py --strict site/data
          python3 ../scanner/tools/validate_protected_events.py --base-ref 9dce04230d9a8a257f8ce6d035f66122250d5d69 site/data
          python3 ../scanner/tools/validate_non_regression.py --base-ref 9dce04230d9a8a257f8ce6d035f66122250d5d69 site/data
