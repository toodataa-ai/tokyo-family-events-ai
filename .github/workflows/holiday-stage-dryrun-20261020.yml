name: Six-week protected data-staging readiness dry-run (NO PUSH)
on:
  push:
    branches: [research/holiday-after-individual-fact-crawl-20261020]
    paths:
      - '.github/workflows/holiday-stage-dryrun-20261020.yml'
      - 'tools/holiday_after_staging_dryrun.py'
      - 'research/2026-10-20-confirmed-13-promotion-source-evidence.json'
permissions:
  contents: read
  actions: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/checkout@v4
        with:
          ref: data-production
          path: data-src
      - uses: actions/checkout@v4
        with:
          ref: production
          path: released
      - uses: actions/download-artifact@v4
        with:
          name: six-week-source-review-20261019-v2
          run-id: 39287812668
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/real-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble protected six-week candidate without unknown facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rollover-artifacts/candidate"
          python3 scanner/tools/holiday_after_staging_dryrun.py \
            --baseline data-src/site/data \
            --evidence "$RUNNER_TEMP/real-evidence" \
            --review-ledger scanner/research/2026-10-20-confirmed-13-promotion-source-evidence.json \
            --output "$RUNNER_TEMP/rollover-artifacts/candidate/site/data" \
            > "$RUNNER_TEMP/rollover-artifacts/assembly_report.json"
          cp "$RUNNER_TEMP/rollover-artifacts/candidate/site/candidate_dryrun_status.json" "$RUNNER_TEMP/rollover-artifacts/stage_blockers.json"
      - name: Run released strict validations without changing GitHub branches
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/rollover-artifacts/strict-logs"
          cp -a "$RUNNER_TEMP/rollover-artifacts/candidate/site/data/." data-src/site/data/
          cd data-src
          set +e
          python3 ../released/tools/validate_data.py --strict --min-image-coverage 0.70 site/data > "$RUNNER_TEMP/rollover-artifacts/strict-logs/data.txt" 2>&1
          echo "validate_data=$?" >> "$RUNNER_TEMP/rollover-artifacts/strict-exit-status.txt"
          python3 ../released/tools/validate_decisions.py --strict site/data > "$RUNNER_TEMP/rollover-artifacts/strict-logs/decisions.txt" 2>&1
          echo "validate_decisions=$?" >> "$RUNNER_TEMP/rollover-artifacts/strict-exit-status.txt"
          python3 ../scanner/tools/validate_official_schedule_audit.py site/data > "$RUNNER_TEMP/rollover-artifacts/strict-logs/official_schedule.txt" 2>&1
          echo "official_schedule=$?" >> "$RUNNER_TEMP/rollover-artifacts/strict-exit-status.txt"
          python3 ../scanner/tools/validate_protected_events.py --base-ref HEAD site/data > "$RUNNER_TEMP/rollover-artifacts/strict-logs/protected.txt" 2>&1
          echo "protected=$?" >> "$RUNNER_TEMP/rollover-artifacts/strict-exit-status.txt"
          python3 ../released/tools/validate_non_regression.py --base-ref HEAD site/data > "$RUNNER_TEMP/rollover-artifacts/strict-logs/nonregression.txt" 2>&1
          echo "non_regression=$?" >> "$RUNNER_TEMP/rollover-artifacts/strict-exit-status.txt"
          set -e
          cat "$RUNNER_TEMP/rollover-artifacts/strict-exit-status.txt"
          grep -h '^ERROR' "$RUNNER_TEMP/rollover-artifacts/strict-logs"/*.txt | head -40 || true
          echo 'Failing gates remain BLOCKERS; there is no staging branch update or data promotion.'
      - name: Preserve dry-run logs and editable candidate only
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/rollover-artifacts/proposal"
          candidate="$RUNNER_TEMP/rollover-artifacts/candidate/site/data"
          if [ -f "$candidate/manifest.json" ]; then
            cp "$candidate/manifest.json" "$RUNNER_TEMP/rollover-artifacts/proposal/"
            for sat in 2026-10-24 2026-10-31 2026-11-07 2026-11-14 2026-11-21 2026-11-28; do
              for p in "$candidate/${sat}.json" "$candidate/${sat}-run.json" "$candidate/${sat}-verification.json" "$candidate/${sat}-decisions.json" "$candidate/${sat}-events-01.json"; do
                if [ -f "$p" ]; then cp "$p" "$RUNNER_TEMP/rollover-artifacts/proposal/"; fi
              done
            done
          fi
          rm -rf "$RUNNER_TEMP/rollover-artifacts/candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-six-week-candidate-and-strict-blockers
          path: ${{ runner.temp }}/rollover-artifacts/
          if-no-files-found: warn
          retention-days: 30
