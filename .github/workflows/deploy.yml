name: Validate Staging and Publish Preview

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'tests/**'
      - 'prompts/**'
      - 'package.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/release-trigger.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate canonical prompt governance
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate non-regression against previous published data
        run: python tools/validate_non_regression.py --base-ref HEAD^ site/data
      - name: Enrich thumbnail URLs for validation only
        run: python tools/enrich_images.py site/data
      - name: Validate event data strictly
        run: python tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate family-fit decision audit strictly
        run: python tools/validate_decisions.py --strict site/data
      - name: Validate v1.6 exclusion rereview
        run: python tools/validate_rereview.py --strict site/data
      - name: Test copy contract and shared filters
        run: npm test

  preview:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}staging/
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging-src
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          path: production-src
      - name: Compose production root and hidden staging preview
        shell: bash
        run: |
          mkdir -p pages
          cp -a production-src/site/. pages/
          mkdir -p pages/staging
          cp -a staging-src/site/. pages/staging/
          python - <<'PY'
          from pathlib import Path
          import subprocess

          short_sha = subprocess.check_output(
              ["git","-C","staging-src","rev-parse","--short=7","HEAD"],
              text=True
          ).strip()

          marker = '<meta name="robots" content="noindex,nofollow">'
          style = '''<style id="staging-visual-marker">
          body{padding-top:30px!important}
          .staging-visual-marker{position:fixed;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:center;gap:8px;background:#8a4b08;color:#fff7ed;font-family:"Meiryo UI",Meiryo,sans-serif;font-size:12px;font-weight:800;letter-spacing:.02em;z-index:2147483647;box-shadow:0 1px 4px rgba(0,0,0,.25)}
          .staging-visual-marker small{font-size:10px;font-weight:700;opacity:.9}
          </style>'''
          banner = f'<div class="staging-visual-marker" role="status">STAGING・確認用 <small>本番未反映 / {short_sha}</small></div>'

          for p in Path("pages/staging").glob("*.html"):
              s=p.read_text(encoding="utf-8")
              if marker not in s:
                  s=s.replace("<head>", "<head>\n"+marker, 1)
              if 'id="staging-visual-marker"' not in s:
                  s=s.replace("</head>", style+"\n</head>", 1)
              if 'class="staging-visual-marker"' not in s:
                  body_pos=s.find("<body")
                  if body_pos != -1:
                      body_end=s.find(">", body_pos)
                      if body_end != -1:
                          s=s[:body_end+1]+"\n"+banner+s[body_end+1:]
              p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
