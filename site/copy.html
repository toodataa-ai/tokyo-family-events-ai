<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コピペ用リスト｜東京23区 子連れイベント AIガイド</title>
<link rel="stylesheet" href="styles.css?v=20261010-source-filter">
</head>
<body class="copy-page" data-season="autumn">
<section class="site-hero">
  <div class="hero-inner">
    <div class="site-topbar">
      <a class="site-brand" href="index.html">東京23区子連れイベントAI収集</a>
      <nav class="site-nav"><a id="backLink" href="search.html">イベント検索へ</a></nav>
    </div>
    <div class="hero-eyebrow">COPY LIST</div>
    <h1>コピペ用リスト</h1>
    <p class="hero-copy">検索結果と同じ条件でイベントを絞り込み、必要な項目をそのままコピーできます。</p>
  </div>
</section>
<section class="search-quick" aria-label="検索と絞り込み">
  <div class="search-quick-row copy-search-quick-row">
    <input type="search" id="searchInput" class="unified-search-input" placeholder="イベント名・会場・内容を検索" aria-label="キーワード検索">
    <select id="sourceSelect" aria-label="取得元を選択">
      <option value="all">取得元：両方</option>
      <option value="ai_cross">AI探索</option>
      <option value="explicit">固定サイト</option>
    </select>
    <details class="date-refine" id="dateRefine">
      <summary>日付指定</summary>
      <div class="date-refine-panel">
        <input type="date" id="dateInput" aria-label="対象日">
        <button id="updateBtn">この週末を表示</button>
        <div class="meta" id="rangeText"></div>
        <div class="msg" id="msgBox"></div>
      </div>
    </details>
  </div>
</section>
<nav class="week-tabs compact-week-tabs" id="weekTabs" aria-label="6週間の週末"></nav>
<nav class="chips compact-ward-chips" id="chips"></nav>
<main>
  <div class="result-head result-head-simple copy-result-head"><span id="countText">-</span></div>
  <p class="tip">各カード上部に検索結果と同じイベント情報を表示します。下部の「コピー用項目」から1項目ずつ、またはまとめてコピーできます。公式確認・取得経路・AI判定は画面表示のみで、コピー本文には混ぜません。</p>
  <div class="grid" id="grid"></div>
</main>
<footer>コピペ契約 v1：タイトル → 場所 → 日時 → 料金 → 説明 → 公式サイト → 情報元サイト → 画像URL（画像がある場合のみ）</footer>
<script src="usage-metrics.js?v=20261009-2" defer></script>
<script type="module">
import {WARDS,defaultDate,saturdayOf,fmtRange,filterEvents,countsByWard,loadManifest,loadWeekend,loadDiscoverySources,escapeHtml,safeHttpUrl,rollingWeekSlots,shortWeekendLabel,holidayPeriodSlots,holidayTabMeta,holidayRangeLabel,eventsOverlappingPeriod,verificationStateMeta,verificationSourceHeading,mergeEventsAcrossWeeks,indoorOutdoorLabel,eventPriceCategory,eventPriceLabel,reservationLabel,reservationCategory,eventDiscoveryProvenance,familyFitAxisRows,heroSeasonForDate} from './app.js?v=20261010-source-filter';
import {COPY_CONTRACT_VERSION,copyFieldList,copyAllText} from './copy-contract.js';

let manifest=null,registry=null,currentData=null,currentWard='__all__',allMode=false,currentRecMin='0',currentPrice='all',currentEnvironment='all',currentReservation='all',currentPeriodStart='';
const $=id=>document.getElementById(id);
function applyHeroSeason(){document.body.dataset.season=heroSeasonForDate($('dateInput').value||manifest?.default||defaultDate());}
function showMsg(text){$('msgBox').textContent=text||'';$('msgBox').style.display=text?'block':'none';}
function filters(){return {date:allMode?'':$('dateInput').value,ward:currentWard,q:$('searchInput').value.trim(),recMin:currentRecMin,price:currentPrice,environment:currentEnvironment,reservation:currentReservation,sourceMode:$('sourceSelect').value};}
function syncUrl(){const f=filters(),p=new URLSearchParams();if(allMode)p.set('date','all');else if(f.date)p.set('date',f.date);if(f.ward!=='__all__')p.set('ward',f.ward);if(f.q)p.set('q',f.q);if(Number(f.recMin))p.set('rec',f.recMin);if(f.price!=='all')p.set('price',f.price);if(f.environment!=='all')p.set('env',f.environment);if(f.reservation!=='all')p.set('reserve',f.reservation);if(f.sourceMode!=='all')p.set('src',f.sourceMode);history.replaceState(null,'',p.toString()?'?'+p.toString():location.pathname);$('backLink').href='search.html'+(p.toString()?'?'+p.toString():'');}

async function writeClipboard(text){
  if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);return;}
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed');
}
function flash(btn,label){const old=btn.textContent;btn.textContent=label;btn.classList.add('done');setTimeout(()=>{btn.textContent=old;btn.classList.remove('done');},1500);}
function recordMetric(event){try{window.SiteMetrics?.track(event);}catch{ /* metrics must never block the clipboard */ }}
window.copyOne=async(id,btn)=>{recordMetric('copy_field_click');try{await writeClipboard($(id).textContent);flash(btn,'✓コピー済');recordMetric('copy_field');}catch{showMsg('コピーに失敗しました。ブラウザのクリップボード権限をご確認ください。');}};
window.copyAllCard=async(index,btn)=>{recordMetric('copy_all_click');try{const ev=window.__visibleEvents[index];await writeClipboard(copyAllText(ev));flash(btn,'✓コピーしました');recordMetric('copy_all');}catch{showMsg('コピーに失敗しました。ブラウザのクリップボード権限をご確認ください。');}};

function renderWeekTabs(){
  if(!manifest)return;
  const periods=holidayPeriodSlots(manifest,manifest.default);
  const selected=currentPeriodStart||$('dateInput').value||'';
  $('weekTabs').innerHTML=`<button class="week-tab all-week-tab ${allMode?'active':''}" data-date="all"><b>全期間</b><span>6週間</span></button>`+
    periods.map(period=>{const meta=holidayTabMeta(period,manifest);return `<button class="week-tab ${!allMode&&selected===period.start?'active':''} ${period.available?'':'pending'}" data-date="${period.start}"><b>${escapeHtml(meta.primary)}</b><span>${escapeHtml(meta.secondary)}</span></button>`;}).join('');
}
function renderChips(data){const base=filterEvents(data.events,{...filters(),ward:'__all__',registry,decisionAudit:data.decision_audit});const counts=countsByWard(base);$('chips').innerHTML=[`<button class="chip ${currentWard==='__all__'?'active':''}" data-ward="__all__">すべて <span>${base.length}</span></button>`,...WARDS.map(w=>`<button class="chip ${currentWard===w?'active':''} ${counts[w]===0?'zero':''}" data-ward="${w}">${w} <span>${counts[w]}</span></button>`)].join('');}
function fitClass(grade){return grade==='A'?'fit-a':grade==='B'?'fit-b':grade==='C'?'fit-c':'fit-d';}
function copyStarSvg(){return '<svg class="star-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="width:1em;height:1em;display:block;flex:0 0 1em;fill:#e0a21b;stroke:#b97808;stroke-width:.7"><path d="M12 2.7l2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 16.9l-5.56 2.92 1.06-6.2L3 9.23l6.22-.9L12 2.7z"/></svg>';}
function copyFamilyStars(grade){const n=grade==='A'?3:grade==='B'?2:grade==='C'?1:0;return n?Array.from({length:n},copyStarSvg).join(''):'<span class="no-star">―</span>';}
function renderCopyAxes(fit){const rows=familyFitAxisRows(fit);if(!rows.length)return '';return `<details class="fit-details"><summary>子連れ適性8軸を見る</summary><div class="fit-axis-grid">${rows.map(x=>`<div class="fit-axis"><b>${escapeHtml(x.label)}</b><span class="axis-grade ${fitClass(x.grade)}">${escapeHtml(x.grade)}</span><small>${escapeHtml(x.reason)}</small></div>`).join('')}</div>${fit?.override_reason?`<div class="override"><b>掲載override:</b> ${escapeHtml(fit.override_reason)}</div>`:''}</details>`;}
function copyEventProvenance(ev){
  return eventDiscoveryProvenance(ev,currentData?.decision_audit,registry);
}
function copyProvenanceBadge(prov){
  if(prov.channel==='ai_cross') return '<span class="badge provenance-badge prov-ai">AIのみ</span>';
  if(prov.channel==='explicit') return '<span class="badge provenance-badge prov-explicit">固定サイト</span>';
  if(prov.channel==='both') return '<span class="badge provenance-badge prov-both">両方</span>';
  return '';
}
function fieldHtml(field,id){const url=field.isLink?safeHttpUrl(field.value):'';const inner=url?`<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(field.value)}</a>`:escapeHtml(field.value);return `<div class="copy-field"><div class="field-label">${escapeHtml(field.label)}</div><div class="field-value" id="${id}">${inner}</div><button class="copy-btn" onclick="copyOne('${id}',this)">コピー</button></div>`;}

function render(){
  if(!currentData)return;renderWeekTabs();renderChips(currentData);const visible=filterEvents(currentData.events,{...filters(),registry,decisionAudit:currentData.decision_audit});window.__visibleEvents=visible;
  const verified=currentData.events.filter(x=>x.verification?.status==='verified').length;
  const announced=currentData.events.filter(x=>x.verification?.status==='announced').length;
  const prompt=currentData.run?.prompt?.version||'-';
  const filterBits=[];if(Number(currentRecMin))filterBits.push(currentRecMin==='3'?'★★★':currentRecMin==='2'?'★★以上':'★以上');if(currentPrice!=='all')filterBits.push(currentPrice==='free'?'無料':currentPrice==='mixed'?'無料あり':'有料');if(currentEnvironment!=='all')filterBits.push(currentEnvironment==='indoor'?'屋内':currentEnvironment==='outdoor'?'屋外':'屋内・屋外');if(currentReservation!=='all')filterBits.push(currentReservation==='none'?'申込不要':currentReservation==='required'?'要事前申込':currentReservation==='partial'?'一部要申込':'申込要確認');if($('sourceSelect').value!=='all')filterBits.push($('sourceSelect').value==='ai_cross'?'AI探索':'固定サイト');
  $('rangeText').textContent=allMode?`6週間すべて ／ 同一イベントは重複統合 ／ コピペ契約 v${COPY_CONTRACT_VERSION}${filterBits.length?' ／ '+filterBits.join('・'):''}`:`${holidayRangeLabel(currentData.period_start||currentData.sat,currentData.period_end||currentData.sun,manifest)} ／ GitHub手順 ${prompt} ／ コピペ契約 v${COPY_CONTRACT_VERSION} ／ 公式確認 ${verified}・詳細待ち ${announced}${filterBits.length?' ／ '+filterBits.join('・'):''}`;$('countText').textContent=`全 ${currentData.events.length} 件 ／ コピー対象 ${visible.length} 件`;
  const grid=$('grid');if(!visible.length){grid.innerHTML='<p class="empty">条件に合うイベントはありません。</p>';syncUrl();return;}
  grid.innerHTML=visible.map((ev,index)=>{
    const fields=copyFieldList(ev);
    const grade=ev.family_fit?.overall||ev.family_fit?.grade||'C';
    const state=verificationStateMeta(ev.verification?.status,ev.verification?.source_kind),verifyUrl=safeHttpUrl(ev.verification?.source);
    const href=safeHttpUrl(ev.official_url||ev.url),img=safeHttpUrl(ev.image),environmentLabel=indoorOutdoorLabel(ev),priceText=eventPriceLabel(ev),priceClass=eventPriceCategory(ev),reservationText=reservationLabel(ev),reservationClass=reservationCategory(ev),prov=copyEventProvenance(ev),provBadge=copyProvenanceBadge(prov);
    const thumb=img?`<img class="thumb event-list-thumb" src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph event-list-thumb',textContent:'${escapeHtml(ev.ward.slice(0,1))}'}))">`:`<div class="thumb ph event-list-thumb">${escapeHtml(ev.ward.slice(0,1))}</div>`;
    const title=href?`<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(ev.name||ev.url)}</a>`:escapeHtml(ev.name||ev.url);
    const verifyBadge=`<span class="badge ${state.className}">${escapeHtml(state.label)}</span>`;
    const verifyText=`<div class="source"><b>${verificationSourceHeading(ev.verification)}:</b> ${ev.verification?.verified_on?escapeHtml(ev.verification.verified_on)+' ／ ':''}${verifyUrl?`<a href="${escapeHtml(verifyUrl)}" target="_blank" rel="noopener">検証ソース</a>`:'検証ソース要確認'}${ev.verification?.note?`<br>${escapeHtml(ev.verification.note)}`:''}</div>`;
    return `<article class="copy-card">
      <div class="copy-card-header"><span class="copy-card-index">EVENT ${String(index+1).padStart(2,'0')}</span><b>${escapeHtml(ev.name||'イベント')}</b></div>
      <div class="copy-event-info">
        <div class="event-list-overview copy-event-overview">
          ${thumb}
          <div class="event-list-main">
            <div class="event-title">${title}</div>
            <div class="event-summary-meta"><span class="family-stars ${fitClass(grade)}" aria-label="子連れオススメ度">${copyFamilyStars(grade)}</span><span class="event-date">🗓 ${escapeHtml(ev.period||'')}</span></div>
          </div>
        </div>
        <div class="copy-event-detail">
          <div class="badges user-meta-badges"><span class="badge">${escapeHtml(ev.ward)}</span>${verifyBadge}${environmentLabel?`<span class="badge">${escapeHtml(environmentLabel)}</span>`:''}<span class="badge price-badge price-${priceClass}">${escapeHtml(priceText)}</span><span class="badge reservation-badge reservation-${reservationClass}" title="${escapeHtml(ev.reservation?.note||'')}">${escapeHtml(reservationText)}</span>${provBadge}</div>
          <div class="event-meta">${ev.venue?`📍 ${escapeHtml(ev.venue)}`:''}${ev.time?`<br>🕒 ${escapeHtml(ev.time)}`:''}${ev.price?`<br>💰 ${escapeHtml(ev.price)}`:''}</div>
          ${ev.description?`<div class="desc">${escapeHtml(ev.description)}</div>`:''}
          ${ev.family_fit?.reason?`<div class="desc"><b>AI判定:</b> ${escapeHtml(ev.family_fit.reason)}</div>`:''}
          ${renderCopyAxes(ev.family_fit)}
          ${verifyText}
          ${ev.source?`<div class="source">情報元: ${escapeHtml(ev.source)}</div>`:''}
        </div>
      </div>
      <div class="copy-fields-section">
        <div class="copy-fields-title">コピー用項目</div>
        ${fields.map((f,i)=>fieldHtml(f,`f-${index}-${i}`)).join('')}
        <button class="copy-all" onclick="copyAllCard(${index},this)">この項目をまとめてコピー</button>
      </div>
    </article>`;
  }).join('');syncUrl();
}
async function loadSelected(){try{
  showMsg('');applyHeroSeason();
  if(allMode){
    const loaded=await Promise.all((manifest.weekends||[]).map(w=>loadWeekend(manifest,w.sat)));
    const rows=loaded.map(x=>x.data).filter(Boolean);
    currentData={sat:manifest.weekends?.[0]?.sat||manifest.default,sun:manifest.weekends?.at(-1)?.sun||manifest.default,publication_tier:'all',events:mergeEventsAcrossWeeks(rows),decision_audit:null,run:null};
    render();return;
  }
  const selectedDate=$('dateInput').value;const periods=holidayPeriodSlots(manifest,manifest.default);const period=periods.find(x=>selectedDate>=x.start&&selectedDate<=x.end)||null;const sourceSat=period?.sourceSat||saturdayOf(selectedDate);const {entry,data}=await loadWeekend(manifest,sourceSat);currentPeriodStart=period?.start||selectedDate;renderWeekTabs();
  if(!entry){showMsg('この休日は6週間ローリング探索の対象ですが、現在は取得前です。');currentData=null;$('grid').innerHTML='<p class="empty">次回のローリング更新でイベントを取得します。</p>';$('chips').innerHTML='';$('countText').textContent='';syncUrl();return;}
  const events=period?.kind==='holiday'?eventsOverlappingPeriod(data.events,period.start,period.end):data.events;currentData={...data,events,period_start:period?.start||data.sat,period_end:period?.end||data.sun};render();
}catch(e){console.error(e);showMsg('データの読み込みに失敗しました。');}}
$('weekTabs').addEventListener('click',e=>{const b=e.target.closest('.week-tab');if(!b)return;if(b.dataset.date==='all'){allMode=true;currentPeriodStart='';$('dateInput').value='';}else{allMode=false;currentPeriodStart=b.dataset.date;$('dateInput').value=b.dataset.date;}loadSelected();});
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;currentWard=b.dataset.ward;render();});
$('searchInput').addEventListener('input',render);$('sourceSelect').addEventListener('change',render);$('updateBtn').addEventListener('click',()=>{allMode=!$('dateInput').value;currentPeriodStart='';loadSelected();});
(async()=>{try{[manifest,registry]=await Promise.all([loadManifest(),loadDiscoverySources()]);applyHeroSeason();const p=new URLSearchParams(location.search),dateParam=p.get('date');allMode=!dateParam||dateParam==='all';currentPeriodStart=allMode?'':dateParam;$('dateInput').value=allMode?'':dateParam;const w=p.get('ward');if(WARDS.includes(w))currentWard=w;$('searchInput').value=p.get('q')||'';currentRecMin=['1','2','3'].includes(p.get('rec'))?p.get('rec'):'0';currentPrice=['free','mixed','paid'].includes(p.get('price'))?p.get('price'):'all';currentEnvironment=['indoor','outdoor','mixed'].includes(p.get('env'))?p.get('env'):'all';currentReservation=['none','required','partial','unknown'].includes(p.get('reserve'))?p.get('reserve'):'all';$('sourceSelect').value=['ai_cross','explicit'].includes(p.get('src'))?p.get('src'):'all';renderWeekTabs();await loadSelected();}catch(e){console.error(e);showMsg('初期データの読み込みに失敗しました。');}})();
</script>
</body></html>
