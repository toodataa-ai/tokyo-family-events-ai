name: Diagnose Cloudflare metrics Worker 403 (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-metrics-worker-403.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect current Worker routing and HTTP failures without modifying the Worker
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, re
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          for name,url in [
              ('account_subdomain',base+'/workers/subdomain'),
              ('worker_subdomain',base+'/workers/scripts/tokyo-family-events-metrics/subdomain'),
              ('worker_settings',base+'/workers/scripts/tokyo-family-events-metrics/settings')
          ]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=18) as r:
                      data=json.load(r)
                  if name=='worker_settings':
                      bindings=(data.get('result') or {}).get('bindings',[])
                      print('INFO worker_settings success',data.get('success'),
                            'bindings',[(b.get('name'),b.get('type')) for b in bindings])
                  elif name=='account_subdomain':
                      print('INFO account_subdomain success',data.get('success'),
                            'subdomain_present',bool((data.get('result') or {}).get('subdomain')))
                  else:
                      settings=data.get('result') or {}
                      print('INFO worker_subdomain success',data.get('success'),
                            'enabled',settings.get('enabled'),
                            'previews_enabled',settings.get('previews_enabled'))
              except urllib.error.HTTPError as e:
                  print('INFO',name,'HTTP',e.code)
              except Exception as e:
                  print('INFO',name,'error',type(e).__name__)
          for name,path in [('root','/'),('stats','/stats'),('history','/history?days=7')]:
              u='https://tokyo-family-events-metrics.tooda-t-aa.workers.dev'+path
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Origin':'https://toodataa-ai.github.io'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(170)
                      print('INFO endpoint',name,'HTTP',r.status,'content_type',r.headers.get('Content-Type'),
                            'body_is_json',body.strip().startswith(b'{'))
              except urllib.error.HTTPError as e:
                  body=e.read(180)
                  # Print only the most common non-sensitive Cloudflare error code
                  m=re.search(rb'error code[:\s]*(\d{3,5})',body,re.I)
                  print('INFO endpoint',name,'HTTP',e.code,'content_type',e.headers.get('Content-Type'),
                        'cf_error_code',m.group(1).decode() if m else 'none',
                        'body_size_at_least',len(body))
              except Exception as e:
                  print('INFO endpoint',name,'exception',type(e).__name__)
          PY
