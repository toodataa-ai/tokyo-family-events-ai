name: Validate Staging and Publish Preview

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'tests/**'
      - 'prompts/**'
      - 'package.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/release-trigger.txt'
      - '.github/data-deploy-trigger.txt'
      - '.github/production-releases.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      base_data_production_sha: ${{ steps.gate.outputs.base_data_production_sha }}
      operation: ${{ steps.gate.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          mode="staging"
          candidate=""
          base=""
          operation=""

          if [ "${{ github.event_name }}" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ] && printf '%s\n' "$changed" | grep -Fxq '.github/data-deploy-trigger.txt'; then
              mode="data"
              candidate="$(sed -n 's/^candidate_sha=//p' .github/data-deploy-trigger.txt | tail -1)"
              base="$(sed -n 's/^base_data_production_sha=//p' .github/data-deploy-trigger.txt | tail -1)"
              operation="$(sed -n 's/^operation=//p' .github/data-deploy-trigger.txt | tail -1)"
              if ! printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid candidate_sha in data deploy trigger" >&2
                exit 1
              fi
              if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid base_data_production_sha in data deploy trigger" >&2
                exit 1
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "base_data_production_sha=$base" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  validate_staging:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate canonical prompt governance
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate non-regression against previous published data
        run: python tools/validate_non_regression.py --base-ref HEAD^ site/data
      - name: Enrich thumbnail URLs for validation only
        run: python tools/enrich_images.py site/data
      - name: Validate event data strictly
        run: python tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate family-fit decision audit strictly
        run: python tools/validate_decisions.py --strict site/data
      - name: Validate v1.6 exclusion rereview
        run: python tools/validate_rereview.py --strict site/data
      - name: Test copy contract and shared filters
        run: npm test

  validate_data:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'data' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Checkout released application
        uses: actions/checkout@v4
        with:
          ref: production
          path: production-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm candidate belongs to data-staging
        shell: bash
        run: |
          git fetch origin data-staging --depth=1
          expected="$(git rev-parse origin/data-staging)"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Candidate SHA is not the current data-staging head" >&2
            exit 1
          fi
      - name: Confirm production-data base has not moved
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/data-production | awk '{print $1}')"
          expected="${{ needs.gate.outputs.base_data_production_sha }}"
          if [ "$current" != "$expected" ]; then
            echo "data-production moved: expected $expected but found $current" >&2
            exit 1
          fi
      - name: Validate released prompt governance
        working-directory: production-src
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate data non-regression against current production data
        run: python production-src/tools/validate_non_regression.py --base-ref ${{ needs.gate.outputs.base_data_production_sha }} site/data
      - name: Overlay released static data policy for validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          src = Path("production-src/site/data")
          dst = Path("site/data")
          runtime = re.compile(r"^20\d{2}-\d{2}-\d{2}.*\.json$")

          for p in src.iterdir():
              if not p.is_file():
                  continue
              if runtime.match(p.name) or p.name in {"manifest.json", "update_history.json"}:
                  continue
              shutil.copy2(p, dst / p.name)
          PY
      - name: Enrich candidate thumbnails for validation only
        run: python production-src/tools/enrich_images.py site/data
      - name: Validate candidate event data strictly
        run: python production-src/tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate candidate family-fit decisions strictly
        run: python production-src/tools/validate_decisions.py --strict site/data
      - name: Validate candidate rereview strictly
        run: python production-src/tools/validate_rereview.py --strict site/data
      - name: Run released application regression tests
        working-directory: production-src
        run: npm test

  promote_data:
    needs: [gate, validate_data]
    if: ${{ needs.gate.outputs.mode == 'data' && needs.validate_data.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      previous_sha: ${{ steps.promote.outputs.previous_sha }}
      candidate_sha: ${{ steps.promote.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          fetch-depth: 0
      - id: promote
        shell: bash
        run: |
          expected="${{ needs.gate.outputs.base_data_production_sha }}"
          candidate="$(git rev-parse HEAD)"
          current="$(git ls-remote origin refs/heads/data-production | awk '{print $1}')"

          if [ "$current" != "$expected" ]; then
            echo "data-production moved: expected $expected but found $current" >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/data-production" --force-with-lease="refs/heads/data-production:$expected"
          echo "previous_sha=$expected" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  preview:
    needs: [gate, validate_staging, validate_data, promote_data]
    if: >-
      ${{ always() &&
          ((needs.gate.outputs.mode == 'staging' && needs.validate_staging.result == 'success') ||
           (needs.gate.outputs.mode == 'data' && needs.validate_data.result == 'success' && needs.promote_data.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}staging/
    steps:
      - name: Checkout staging application
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging-src
      - name: Checkout production application
        uses: actions/checkout@v4
        with:
          ref: production
          path: production-src
      - name: Checkout production data
        uses: actions/checkout@v4
        with:
          ref: data-production
          path: data-production-src
      - name: Compose production root and hidden staging preview
        shell: bash
        run: |
          mkdir -p pages
          cp -a production-src/site/. pages/
          mkdir -p pages/staging
          cp -a staging-src/site/. pages/staging/

          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          data_src = Path("data-production-src/site/data")

          def overlay_runtime_data(dest):
              dest = Path(dest)
              dest.mkdir(parents=True, exist_ok=True)
              for p in dest.glob("20??-??-??*.json"):
                  p.unlink()
              for name in ("manifest.json", "update_history.json"):
                  p = dest / name
                  if p.exists():
                      p.unlink()
              for p in data_src.glob("20??-??-??*.json"):
                  shutil.copy2(p, dest / p.name)
              for name in ("manifest.json", "update_history.json"):
                  src = data_src / name
                  if not src.exists():
                      raise SystemExit(f"missing runtime data file: {src}")
                  shutil.copy2(src, dest / name)

          overlay_runtime_data("pages/data")
          overlay_runtime_data("pages/staging/data")

          release_registry = Path("staging-src/.github/production-releases.json")
          if release_registry.exists():
              shutil.copy2(release_registry, "pages/data/production-releases.json")
              shutil.copy2(release_registry, "pages/staging/data/production-releases.json")

          short_sha = subprocess.check_output(
              ["git","-C","staging-src","rev-parse","--short=7","HEAD"],
              text=True
          ).strip()

          marker = '<meta name="robots" content="noindex,nofollow">'
          style = '''<style id="staging-visual-marker">
          html::after{content:"";position:fixed;inset:0;border:2px solid rgba(138,75,8,.8);pointer-events:none;z-index:2147483646}
          .staging-visual-marker{position:fixed;right:6px;bottom:6px;display:flex;align-items:center;gap:5px;background:rgba(138,75,8,.92);color:#fff7ed;border-radius:999px;padding:4px 7px;font-family:"Meiryo UI",Meiryo,sans-serif;font-size:9px;font-weight:800;line-height:1;letter-spacing:.02em;z-index:2147483647;box-shadow:0 1px 3px rgba(0,0,0,.18);pointer-events:none}
          .staging-visual-marker small{font-size:8px;font-weight:700;opacity:.9}
          </style>'''
          banner = f'<div class="staging-visual-marker" role="status">STAGING <small>{short_sha}</small></div>'

          for p in Path("pages/staging").glob("*.html"):
              s=p.read_text(encoding="utf-8")
              if marker not in s:
                  s=s.replace("<head>", "<head>\n"+marker, 1)
              if 'id="staging-visual-marker"' not in s:
                  s=s.replace("</head>", style+"\n</head>", 1)
              if 'class="staging-visual-marker"' not in s:
                  body_pos=s.find("<body")
                  if body_pos != -1:
                      body_end=s.find(">", body_pos)
                      if body_end != -1:
                          s=s[:body_end+1]+"\n"+banner+s[body_end+1:]
              p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4

  snapshot_data:
    needs: [gate, promote_data, preview]
    if: ${{ needs.gate.outputs.mode == 'data' && needs.gate.outputs.operation != 'bootstrap' && needs.promote_data.result == 'success' && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-production
      - name: Preserve immutable production-data snapshot
        shell: bash
        run: |
          stamp="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          branch="data-release/${stamp}-r${GITHUB_RUN_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Snapshot already exists: $branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "Preserved $branch at $(git rev-parse HEAD)"

  rollback_data_on_deploy_failure:
    needs: [gate, promote_data, preview]
    if: ${{ always() && needs.gate.outputs.mode == 'data' && needs.promote_data.result == 'success' && needs.preview.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-staging
          fetch-depth: 0
      - name: Restore prior production-data pointer
        shell: bash
        run: |
          previous="${{ needs.promote_data.outputs.previous_sha }}"
          candidate="${{ needs.promote_data.outputs.candidate_sha }}"
          git fetch origin "$previous"
          git push origin "$previous:refs/heads/data-production" --force-with-lease="refs/heads/data-production:$candidate"
