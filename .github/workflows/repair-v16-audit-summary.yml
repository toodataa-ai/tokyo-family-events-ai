name: Repair v1.6 Rereview Audit Summary

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tools/repair_v16_audit_summary.py'
      - '.github/workflows/repair-v16-audit-summary.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize audit summaries
        run: python tools/repair_v16_audit_summary.py
      - name: Validate prompt governance
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate event data
        run: python tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate base decisions
        run: python tools/validate_decisions.py --strict site/data
      - name: Validate rereview patch
        run: python tools/validate_rereview.py --strict site/data
      - name: Run tests
        run: npm test
      - name: Commit repaired summaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No summary changes"
          else
            git commit -m "Normalize v1.6 rereview audit summaries"
            git push
          fi
