name: Verify frozen additional primary additions without changing published data
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/validate_additional_primary_addition.py'
      - 'tests/test_additional_primary_gate.py'
      - 'research/additional_primary_review_20261114/**'
      - '.github/workflows/additional-primary-review.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/checkout@v4
        with:
          ref: 033c9e12728f1fca18899b3b47d9a8ca62e3ab48
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression suite including old-record and source-error preservation
        working-directory: scanner
        run: npm test
      - name: Verify the frozen 27-file data candidate and all existing records
        working-directory: candidate
        run: |
          python3 ../scanner/tools/validate_additional_primary_addition.py --base-ref 89c9211fa561fcaabf9d03063d5b745978a52cf8
          python3 ../scanner/tools/validate_data.py --strict --min-image-coverage 0.70 site/data
          python3 ../scanner/tools/validate_decisions.py --strict site/data
          python3 ../scanner/tools/validate_rereview.py --strict site/data
          python3 ../scanner/tools/audit_event_image_identity.py --strict site/data
          python3 ../scanner/tools/validate_protected_events.py --base-ref 89c9211fa561fcaabf9d03063d5b745978a52cf8 site/data
          python3 ../scanner/tools/validate_non_regression.py --base-ref 89c9211fa561fcaabf9d03063d5b745978a52cf8 site/data
      - uses: actions/checkout@v4
        with:
          ref: 398036311eda4ac4432a6de92f10af020f9e6d67
          path: app-candidate
          fetch-depth: 0
      - name: Verify isolated pending guidance update
        working-directory: app-candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "34531c0fcb7ac4eddc0c1c261927e4aadd8cc4a5"
          test "$(git diff --name-only HEAD^ HEAD)" = "site/audit/pending_issues_catalog.json"
          git diff --quiet HEAD^ HEAD -- site/data prompts policy tools
          npm test
