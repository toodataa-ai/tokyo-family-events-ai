name: Initial v1.5 Native Full Research

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tools/.cvgz_*'
      - '.github/workflows/initial-v15-native-research.yml'

permissions:
  contents: write

concurrency:
  group: initial-v15-native-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect compressed bootstrap chunks
        id: chunks
        shell: bash
        run: |
          if [ -f tools/.cvgz_00 ] && [ -f tools/.cvgz_04 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.chunks.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: steps.chunks.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Reconstruct native research generator
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          cat tools/.cvgz_00 tools/.cvgz_01 tools/.cvgz_02 tools/.cvgz_03 tools/.cvgz_04 | base64 -d | gzip -d > tools/initial_v15_native_research.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/initial_v15_native_research.py')
          s=p.read_text(encoding='utf-8')
          old="""def prep_legacy():
 if TMP.exists(): subprocess.run(['rm','-rf',str(TMP)],check=True)
 subprocess.run(['git','clone','--depth','1','https://github.com/toodataa-ai/tokyo-weekend-events.git',str(TMP)],check=True)
 subprocess.run([sys.executable,'build_with_extra_sources.py'],cwd=TMP,check=True)"""
          new="""def prep_legacy():
 import urllib.request, json
 if TMP.exists(): subprocess.run(['rm','-rf',str(TMP)],check=True)
 ddir=TMP/'site'/'data'; ddir.mkdir(parents=True,exist_ok=True)
 for w in WEEKS:
  req=urllib.request.Request(f'https://toodataa-ai.github.io/tokyo-weekend-events/data/{w}.json',headers={'User-Agent':'Mozilla/5.0 TokyoFamilyEventsAI/1.5'})
  with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read().decode('utf-8'))
  json.dump(data,open(ddir/f'{w}.json','w',encoding='utf8'),ensure_ascii=False)"""
          if old not in s:
           raise SystemExit('prep_legacy pattern not found')
          s=s.replace(old,new)
          old2="ds=md(parts[0]); de=md(parts[-1]); area=e.get('area','');"
          new2="ds=md(parts[0]); de=md(parts[-1]); de=(str(int(ds[:4])+1)+de[4:]) if ds and de and de<ds else de; area=e.get('area','');"
          if old2 not in s:
           raise SystemExit('date rollover pattern not found')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/initial_v15_native_research.py
      - name: Run v1.5 native six-week research
        if: steps.chunks.outputs.ready == 'true'
        run: python tools/initial_v15_native_research.py
      - name: Remove obsolete event shards
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          for w in 2026-10-10 2026-10-17 2026-10-24 2026-10-31 2026-11-07 2026-11-14; do
            find site/data -maxdepth 1 -type f -name "$w-events-*.json" ! -name "$w-events-01.json" -delete
          done
      - name: Enrich thumbnails
        if: steps.chunks.outputs.ready == 'true'
        run: python tools/enrich_images.py site/data
      - name: Validate prompt governance
        if: steps.chunks.outputs.ready == 'true'
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate event data strictly
        if: steps.chunks.outputs.ready == 'true'
        run: python tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate decision audit strictly
        if: steps.chunks.outputs.ready == 'true'
        run: python tools/validate_decisions.py --strict site/data
      - name: Test copy contract and shared filters
        if: steps.chunks.outputs.ready == 'true'
        run: npm test
      - name: Commit native v1.5 research
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          rm -f tools/.cvgz_00 tools/.cvgz_01 tools/.cvgz_02 tools/.cvgz_03 tools/.cvgz_04
          rm -f tools/.cv15_00 tools/.cv15_01 tools/.cv15_02 tools/.cv15_03 tools/.cv15_04 tools/.initial_v15_chunk_00
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data tools
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Complete v1.5 native six-week research"
            git push
          fi
