<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>イベント検索｜東京23区 子連れイベント AIガイド</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="search-page" data-season="winter">
<section class="site-hero">
  <div class="hero-inner">
    <div class="site-topbar">
      <a class="site-brand" href="index.html">東京23区 子連れイベント AIガイド</a>
      <nav class="site-nav"><a href="index.html">トップ</a><button id="copyBtn">コピペ用リスト</button></nav>
    </div>
    <div class="hero-eyebrow">EVENT SEARCH</div>
    <h1>イベントを探す</h1>
    <p class="hero-copy">6週間分の掲載イベントを、日付・区・キーワードで絞り込み。検索結果を広く、見比べやすく表示します。</p><a class="hero-photo-credit" id="heroPhotoCredit" href="https://unsplash.com/photos/a-group-of-people-standing-in-front-of-a-christmas-tree-bxPS1gNKJso" target="_blank" rel="noopener">背景写真: 冬・クリスマス / Unsplash</a>
  </div>
</section>
<details class="search-refine" id="searchRefine">
  <summary>検索条件を変更</summary>
  <div class="search-refine-body">
    <section class="search-tools">
      <div class="search-panel">
        <div class="controls"><input type="date" id="dateInput" aria-label="対象日"><input type="search" id="searchInput" placeholder="イベント名・会場・内容を検索" aria-label="キーワード検索"><button id="updateBtn">この週末を表示</button></div>
        <div class="meta" id="rangeText"></div><div class="msg" id="msgBox"></div>
      </div>
    </section>
    <nav class="week-tabs" id="weekTabs" aria-label="6週間の週末"></nav>
    <nav class="chips" id="chips"></nav>
    
  </div>
</details>
<main>
  <div class="result-head result-head-simple"><span class="result-count-label">検索結果 <b id="countText">-</b></span></div>
  <div class="grid" id="grid"></div>
</main>
<footer>トップ画面で抽出ロジック・候補件数・掲載件数・除外理由を確認できます。検索画面では6週間分のイベントを区・キーワードで絞り込めます。</footer>
<script type="module">
import {WARDS,defaultDate,saturdayOf,fmtRange,filterEvents,countsByWard,loadManifest,loadWeekend,escapeHtml,safeHttpUrl,buildCopyUrl,rollingWeekSlots,shortWeekendLabel,publicationTierMeta,verificationStateMeta,familyFitAxisRows,heroSeasonForDate,heroSeasonMeta} from './app.js';

let manifest=null,currentData=null,currentWard='__all__';
const $=id=>document.getElementById(id);
function showMsg(text){$('msgBox').textContent=text||'';$('msgBox').style.display=text?'block':'none';}
function applyHeroSeason(){const season=heroSeasonForDate($('dateInput').value||defaultDate());document.body.dataset.season=season;const meta=heroSeasonMeta(season),credit=$('heroPhotoCredit');if(credit){credit.href=meta.source;credit.textContent=`背景写真: ${meta.label} / Unsplash`;}}
function currentFilters(){return {date:$('dateInput').value,ward:currentWard,q:$('searchInput').value.trim()};}
function syncUrl(){const f=currentFilters(),p=new URLSearchParams();if(f.date)p.set('date',f.date);if(f.ward!=='__all__')p.set('ward',f.ward);if(f.q)p.set('q',f.q);history.replaceState(null,'',p.toString()?'?'+p.toString():location.pathname);}

function renderWeekTabs(){
  if(!manifest)return;const currentSat=saturdayOf($('dateInput').value||defaultDate());const slots=rollingWeekSlots(manifest,manifest.default||currentSat);
  $('weekTabs').innerHTML=slots.map(slot=>{const tier=publicationTierMeta(slot.available?slot.publication_tier:'planned');return `<button class="week-tab ${currentSat===slot.sat?'active':''} ${slot.available?'':'pending'}" data-date="${slot.sat}" title="${escapeHtml(tier.description)}"><b>${shortWeekendLabel(slot.sat)}</b><span>${escapeHtml(tier.label)}</span>${slot.available&&slot.entry?.count!=null?`<em>${slot.entry.count}件</em>`:'<em>取得前</em>'}</button>`;}).join('');
}

function renderDecisionAudit(data){
  const audit=data.decision_audit;const box=$('decisionContent');
  if(!audit){box.innerHTML='<p class="audit-note">判断監査データはありません。</p>';return;}
  const s=audit.summary||{};const decisions=Array.isArray(audit.decisions)?audit.decisions:[];const excluded=decisions.filter(x=>x.decision==='excluded');
  const status=audit.migration_incomplete?'移行中（旧方式の個票なし）':'完全監査';
  let html=`<div class="audit-summary"><b>${escapeHtml(status)}</b><span>候補 ${s.candidate_total??'-'} ／ 掲載 ${s.published??'-'} ／ 除外 ${s.excluded??'-'} ／ 重複 ${s.duplicate??'-'}</span></div>`;
  if(audit.migration_incomplete){html+=`<p class="audit-note">旧バージョンでは候補単位の8軸評価・除外理由を保存していなかったため、過去理由は後付けで推測していません。次回v1.5探索から個票が残ります。</p>`;}
  if(excluded.length){
    html+='<div class="excluded-list">'+excluded.map(row=>{const evidence=(row.evidence||[]).map(e=>{const u=safeHttpUrl(e.url);return u?`<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${escapeHtml(e.label||'根拠')}</a>`:''}).filter(Boolean).join(' / ');return `<div class="excluded-item"><b>${escapeHtml(row.name||row.candidate_id||'候補')}</b><span class="decision-tag ${row.exclusion_type==='hard'?'hard':'soft'}">${row.exclusion_type==='hard'?'Hard除外':'Soft判断'}</span><div>${escapeHtml((row.reasons||[]).join(' ／ '))}</div>${evidence?`<div class="source">根拠: ${evidence}</div>`:''}</div>`;}).join('')+'</div>';
  }else if(!audit.migration_incomplete){html+='<p class="audit-note">この週は除外候補なし。</p>';}
  box.innerHTML=html;
}

function renderCoverage(data){
  const c=data.coverage||{},rows=Array.isArray(c.wards)?c.wards:[];const verified=data.events.filter(x=>x.verification?.status==='verified').length;const announced=data.events.filter(x=>x.verification?.status==='announced').length;const tier=publicationTierMeta(data.publication_tier);const ds=data.decision_audit?.summary||{};
  $('covWards').textContent=`${rows.filter(x=>x.status==='checked').length}/23`;$('covSources').textContent=c.sources_checked??'-';$('covCandidates').textContent=c.candidate_count??'-';$('covPublished').textContent=c.published_count??data.events.length;$('covExcluded').textContent=ds.excluded??c.excluded_count??'-';$('covVerified').textContent=`${verified}/${data.events.length}`;$('covAnnounced').textContent=announced;$('covDecision').textContent=data.decision_audit?(data.decision_audit.migration_incomplete?'移行中':'完備'):'-';$('covPrompt').textContent=data.run?.prompt?.version??'-';$('covTier').textContent=tier.label;
  const bits=[];if(data.run?.prompt?.version)bits.push(`GitHub手順 ${data.run.prompt.version}`);bits.push(`${tier.label}: ${tier.description}`);if(data.generated)bits.push(`探索生成 ${data.generated}`);if(data.verification?.verified_on)bits.push(`公式再確認 ${data.verification.verified_on}`);$('generatedText').textContent=bits.join(' ／ ');renderDecisionAudit(data);
}

function renderChips(data){const counts=countsByWard(data.events);$('chips').innerHTML=[`<button class="chip ${currentWard==='__all__'?'active':''}" data-ward="__all__">すべて <span>${data.events.length}</span></button>`,...WARDS.map(w=>`<button class="chip ${currentWard===w?'active':''} ${counts[w]===0?'zero':''}" data-ward="${w}">${w} <span>${counts[w]}</span></button>`)].join('');}
function fitClass(grade){return grade==='A'?'fit-a':grade==='B'?'fit-b':grade==='C'?'fit-c':'fit-d';}
function renderAxes(fit){const rows=familyFitAxisRows(fit);if(!rows.length)return '';return `<details class="fit-details"><summary>子連れ適性8軸を見る</summary><div class="fit-axis-grid">${rows.map(x=>`<div class="fit-axis"><b>${escapeHtml(x.label)}</b><span class="axis-grade ${fitClass(x.grade)}">${escapeHtml(x.grade)}</span><small>${escapeHtml(x.reason)}</small></div>`).join('')}</div>${fit?.override_reason?`<div class="override"><b>掲載override:</b> ${escapeHtml(fit.override_reason)}</div>`:''}</details>`;}

function render(){
  if(!currentData)return;renderWeekTabs();renderChips(currentData);const filtered=filterEvents(currentData.events,currentFilters());const tier=publicationTierMeta(currentData.publication_tier);$('rangeText').textContent=`${fmtRange(currentData.sat,currentData.sun)} ／ ${tier.label}`;$('countText').textContent=`${filtered.length}件`;const grid=$('grid');if(!filtered.length){grid.innerHTML='<p class="empty">条件に合うイベントはありません。</p>';syncUrl();return;}
  grid.innerHTML=filtered.map(ev=>{const href=safeHttpUrl(ev.official_url||ev.url),img=safeHttpUrl(ev.image),grade=ev.family_fit?.overall||ev.family_fit?.grade||'C',state=verificationStateMeta(ev.verification?.status),verifyUrl=safeHttpUrl(ev.verification?.source);const verifyBadge=`<span class="badge ${state.className}">${escapeHtml(state.label)}</span>`;const verifyText=`<div class="source"><b>${ev.verification?.status==='announced'?'開催発表':'公式確認'}:</b> ${ev.verification?.verified_on?escapeHtml(ev.verification.verified_on)+' ／ ':''}${verifyUrl?`<a href="${escapeHtml(verifyUrl)}" target="_blank" rel="noopener">検証ソース</a>`:'検証ソース要確認'}${ev.verification?.note?`<br>${escapeHtml(ev.verification.note)}`:''}</div>`;const thumb=img?`<img class="thumb" src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph',textContent:'${escapeHtml(ev.ward.slice(0,1))}'}))">`:`<div class="thumb ph">${escapeHtml(ev.ward.slice(0,1))}</div>`;return `<article class="card">${thumb}<div class="body"><div class="badges"><span class="badge">${escapeHtml(ev.ward)}</span><span class="badge ${fitClass(grade)}">子連れ ${escapeHtml(grade)}</span>${verifyBadge}${ev.indoor_outdoor?`<span class="badge">${escapeHtml(ev.indoor_outdoor)}</span>`:''}</div><div class="event-title">${href?`<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(ev.name||ev.url)}</a>`:escapeHtml(ev.name||ev.url)}</div><div class="event-meta">🗓 ${escapeHtml(ev.period||'')}${ev.time?'　'+escapeHtml(ev.time):''}<br>📍 ${escapeHtml(ev.venue||ev.ward)}${ev.price?`<br>💰 ${escapeHtml(ev.price)}`:''}</div>${ev.description?`<div class="desc">${escapeHtml(ev.description)}</div>`:''}${ev.family_fit?.reason?`<div class="desc"><b>AI判定:</b> ${escapeHtml(ev.family_fit.reason)}</div>`:''}${renderAxes(ev.family_fit)}${verifyText}${ev.source?`<div class="source">情報元: ${escapeHtml(ev.source)}</div>`:''}</div></article>`;}).join('');syncUrl();
}

async function loadSelected(){try{showMsg('');applyHeroSeason();const sat=saturdayOf($('dateInput').value);const {entry,data}=await loadWeekend(manifest,sat);renderWeekTabs();if(!entry){const slot=rollingWeekSlots(manifest,manifest.default||sat).find(x=>x.sat===sat),tier=slot?publicationTierMeta(slot.publication_tier):publicationTierMeta('planned');showMsg(`この週は6週間ローリング探索の対象です。現在は${tier.label}データの取得前です。`);currentData=null;$('grid').innerHTML='<p class="empty">次回のローリング更新でイベントを取得します。</p>';$('countText').textContent='';$('rangeText').textContent=fmtRange(sat,slot?.sun||sat);return;}currentData=data;render();}catch(e){console.error(e);showMsg('データの読み込みに失敗しました。');}}
$('weekTabs').addEventListener('click',e=>{const b=e.target.closest('.week-tab');if(!b)return;$('dateInput').value=b.dataset.date;loadSelected();});$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;currentWard=b.dataset.ward;render();});$('searchInput').addEventListener('input',render);$('updateBtn').addEventListener('click',loadSelected);$('copyBtn').addEventListener('click',()=>window.open(buildCopyUrl(currentFilters()),'_blank','noopener'));
(async()=>{try{manifest=await loadManifest();const p=new URLSearchParams(location.search),d=p.get('date')||manifest.default||defaultDate();$('dateInput').value=d;applyHeroSeason();const w=p.get('ward');if(WARDS.includes(w))currentWard=w;$('searchInput').value=p.get('q')||'';renderWeekTabs();await loadSelected();}catch(e){console.error(e);showMsg('初期データの読み込みに失敗しました。');}})();
</script>
</body></html>
