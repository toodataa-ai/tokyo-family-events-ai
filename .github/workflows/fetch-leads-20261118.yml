name: Read-only fetch of six-week discovery leads and the Nerima month-less official calendars
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-leads-20261118.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Fetch pages (no data or app change)
        shell: bash
        run: |
          mkdir -p out
          i=0
          while read -r u; do
            i=$((i+1))
            curl -sS -L -m 60 -A "Mozilla/5.0 (compatible; family-events-audit)" -o "out/page$i.html" -w "page$i $u %{http_code} %{size_download} %{url_effective}\n" "$u" | tee -a out/STATUS.txt
          done <<'URLS'
          https://www.city.toshima.lg.jp/231/2609151435.html
          https://www.city.arakawa.tokyo.jp/a015/event/kouenmeigi/hangakousyuukai.html
          https://www.city.arakawa.tokyo.jp/a042/koen/koen/sizenkouen2.html
          https://www.city.tokyo-nakano.lg.jp/event/kosodate/kyouryuuziorama.html
          https://www.city.tokyo-nakano.lg.jp/kanko/city-promotion/chillnightpicnic.html
          https://www.city.nerima.tokyo.jp/kankomoyoshi/event/calendar/list_calendar.html
          https://www.city.nerima.tokyo.jp/nerimakids/event/calendar/list_calendar.html
          https://www.city.nerima.tokyo.jp/kankomoyoshi/event/calendar/list_calendar202611.html
          https://www.city.nerima.tokyo.jp/kankomoyoshi/event/calendar/list_calendar202612.html
          URLS
          date -u +%FT%TZ > out/FETCHED_AT.txt
      - name: Commit raw fetches to a research-only branch
        shell: bash
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan research/leads-20261118
          git rm -rf . >/dev/null 2>&1 || true
          cp -r ../out/. .
          git add -A
          git commit -m "research: raw read-only fetches of discovery leads"
          git push --force origin research/leads-20261118
