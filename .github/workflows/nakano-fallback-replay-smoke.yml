name: One-time Nakano fallback six-week rescan on slim runner

on:
  push:
    branches: [feature/nakano-official-fallback-20261020]
    paths: ['.github/workflows/nakano-fallback-replay-smoke.yml']

permissions:
  contents: read

jobs:
  test-and-research:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/checkout@v4
        with:
          ref: production
          path: released
      - uses: actions/checkout@v4
        with:
          ref: data-production
          path: data-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Nakano source fallback and protected 23 ward worklists
        run: |
          python3 -m unittest discover -s scanner/tests -p 'test_nakano_supplemental_discovery.py' -v
          python3 -m unittest discover -s scanner/tests -p 'test_holiday_after_*.py' -v
      - name: Compute official eligible 2026-10-19 baseline plan
        run: |
          mkdir -p "$RUNNER_TEMP/nakano-fallback"
          python3 scanner/tools/rolling_horizon.py \
            --as-of 2026-10-19 \
            --base-data-production-sha "$(git -C data-src rev-parse HEAD)" \
            --manifest data-src/site/data/manifest.json \
            --sources released/site/data/discovery_sources.json \
            --output "$RUNNER_TEMP/nakano-fallback/plan.json"
      - name: Collect real 23 ward plus Nakano official and community checks
        continue-on-error: true
        run: |
          python3 scanner/tools/holiday_after_collect.py \
            --plan "$RUNNER_TEMP/nakano-fallback/plan.json" \
            --supplemental-config scanner/policy/nakano_supplemental_sources.json \
            --output-dir "$RUNNER_TEMP/nakano-fallback" --workers 12
      - name: Generate protected review packet if research exists
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nakano-fallback/candidate_pool.json" ]; then
            python3 scanner/tools/holiday_after_review_packet.py \
              --plan "$RUNNER_TEMP/nakano-fallback/plan.json" \
              --evidence-dir "$RUNNER_TEMP/nakano-fallback" \
              --published-data data-src/site/data \
              --output "$RUNNER_TEMP/nakano-fallback/review_packet.json"
          fi
      - name: Assert 403 not falsified and supplemental source evidence exists
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'nakano-fallback'
          summary=json.loads((directory/'summary.json').read_text())
          sources=json.loads((directory/'supplemental_sources.json').read_text())
          packet=json.loads((directory/'review_packet.json').read_text())
          assert summary['tamemap_source_still_required']
          assert summary['publishable'] is False and packet['publication_permitted'] is False
          assert len(packet['weeks'])==6 and len(summary['wards'])==23
          assert len(sources)==6, sources
          print('Supplemental statuses:', [(x['source_id'],x.get('month'),x['status'],x.get('candidate_count')) for x in sources])
          print('Original required-source failures:', summary['required_source_failures'])
          print('Total unverified leads:', summary['candidate_links_unverified'])
          print('Confirmed publication permitted: FALSE')
          PY
      - name: Preserve source, candidate and reviewer evidence even on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nakano-fallback-rescan-20261019
          path: ${{ runner.temp }}/nakano-fallback/
          if-no-files-found: warn
          retention-days: 30
