H87"><a>ハイライト</a></div><div class="WideHeader_item__7uH87"><a>作品</a></div><div class="WideHeader_item__7uH87"><a>チームラボについて</a></div><div class="WideHeader_item__7uH87"><a>ニュース</a></div><div class="WideHeader_item__7uH87"><a>近くの展示</a></div></div><div class="WideHeader_contents__z85Dd"><div class="WideHeader_visit-menu__GEZ07"><button class="WideHeader_item__7uH87 WideHeader_-bold__5KRML" type="button" aria-expanded="false">来場案内</button><div class="VisitMenu_visit-menu__XVqJm VisitMenu_-wide__DG9q9"><div class="VisitMenu_item__fAtBt"><a>基本情報</a></div><div class="VisitMenu_item__fAtBt"><a>アクセス</a></div><div class="VisitMenu_item__fAtBt"><a>よくある質問</a></div><div class="VisitMenu_item__fAtBt"><a>お問い合わせ</a></div><div class="VisitMenu_item__fAtBt"><a>チケット</a></div><div class="VisitMenu_item__fAtBt"><a>注意事項</a></div></div></div><div class="WideHeader_item__7uH87"><a target="_blank" rel="noopener noreferrer" class="WideHeader_link___KSE6" href="https://hamarikyu.tickets.teamlab.art/">チケット購入</a></div></div></div></div></div></div></div></header><main class="LayoutExhibitions_content__AOAnK"><h1 class="HiddenH1_hidden-head__mIIWz">チームラボ 浜離宮 | teamLab / チームラボ</h1><div><section class="_slug__main-visual__w6CpM" id="top"><div class="_slug__main-visual-dynamic-loading__oQNdg" aria-hidden="true"></div><div id="highlight"><div class="SectionHighlight_section-highlight__Z7Kqr"><div class="SectionHighlight_highlight-text__7XArJ"><div class="SectionHighlight_text__QDT4M" dir="auto" style="white-space:normal;text-align:unset">浜離宮恩賜庭園は、東京湾の海水を引き入れ、潮の満ち引きによって趣が変わる潮入の池をもつ、江戸時代（1603年 – 1868年）の代表的な大名庭園である。もともとは徳川将軍家の鷹を放って水鳥を狩る海辺のヨシの繁る湿地だった。1654年頃からこの地を埋め立て、その後「甲府浜屋敷」が建てられた。六代将軍時（1709年 – 1712年）からは「御浜御殿」と呼ばれ、約160年にわたって使われた。明治に入ると皇室の離宮となり、震災と戦災で建物の多くを失いながらも、1946年、恩賜庭園として人々に開かれた。
<br /><br />
この地は、鷹狩場から、将軍家の別邸、皇室の離宮、そして人々の庭園へと役割を変えながら約400年にわたり使われ続けてきた。本展では、長い時間を持つこの庭園が、そのまま作品空間となり、風や雨、うつろう森の影響を受けながら、今を生きる人々の存在によって変容していく。

b-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/pillars-constantflux-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">生生流転柱 / Pillars of Constant Flux</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* 風、雨の強さで作品の高さ（長さ）が変化します。強風、強雨時、作品は展示されません。以下は風速と作品の高さの目安ですが、変更する可能性があります。無風〜微風 100m微風〜1.5m/s 80m1.5m/s〜2.5m/s 60m2.5m/s〜5.0m/s もしくは小雨 40m5.0m/s〜 30m<br /><br />すべての生命は、流れの中にあり、流れそのものが構造を作り、維持している。<br />それは、石ころや鉄、そして、これまで人間がつくってきた物体のように、それ自体で独立し、静的で安定的な構造をもつものとは根本的に異なる。<br />この作品は、空気を内部に閉じ込め、その圧力によって立っているのではない。入口と出口は同じ大きさで、空気は内部を絶え間なく流れ抜けていく。その流れそのものによって、作品は、その構造と存在を維持する。流れが止まれば、作品としての存在は消えてしまう。<br />ここでは、流れによって物体が動かされているのではない。流れそのものが構造を生み、存在を立ち上げている。<br />作品は、風や雨、湿度など環境の影響を強く受け、動きや高さを大きく変えていく。それでも、存在を生む環境が維持され、流れが続く限り、絶えず形を変えながらも、その存在は維持される。<br />それは、動き続け、しなやかでやわらかく、そして脆い。<br />《生生流転柱》は、彫刻を、固定された物体から、開かれた環境の中で、絶え間ない流れによって構造が生まれ続ける存在へと拡張する試みである。作家が直接形をつくるのではなく、存在が生まれる環境をつくる。ここでは、彫刻の存在条件が、物質から、流れが生む秩序へと移行する。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/resonatinglife-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">自立しつつも呼応する生命 / Autonomous Resonating Life</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">それぞれのOvoid は、人や野生動物に押されると、もしくは、強い雨や風に吹かれ倒れると、光を強く輝かせ、音色を響かせながら自ら立ち上がる。隣接するOvoid は次々に呼応し、光と音色を連続させていく。Ovoidの光と音色は、隣接する作品《呼応する木々》にも伝播し、連続していく。人々のふるまいや環境、周辺作品によって作品空間は変容し、人々と環境を作品の一部にしていく。<br />本作品は、「呼応する群体彫刻 (2009-)」のシリーズの作品である。個々の彫刻は自律した物理的存在でありながら、互いに呼応し、群体として一つの連続した場を形成する。<br />このシリーズでは、身体で押すこと、他者が動かすこと、野外では風や雨という環境の作用、野生動物のふるまい、そして同じ彫刻群の中の隣接する彫刻や、周辺の別の作品、これらすべてが呼応の契機となる。一つの彫刻に生じた光や音や動きは、その個体に閉じることなく、近くの彫刻へ、さらに周囲の作品や空間へと連鎖し、全体へ連続していく。<br />ここでは、人間だけが作品を動かすのではない。身体、他者、環境、作品が同一の生態系的な応答場に接続され、個々の彫刻は単体として完結するのではなく、関係の中で存在し続ける。<br />この構造は、彫刻を「自律した個としての物体」から、身体・他者・環境・他作品との関係の中で生成し続ける、ネットワーク的な存在へと拡張する試みである。人間と非人間がともに参与するこの生態系的な応答場において、彫刻の境界は、個々の物体の輪郭にはとどまらない。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=384,quality=100 384w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/resonatingtrees-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">呼応する木々 / Resonating Trees</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">木々は、隣接する木や、隣接する作品《自立しつつも呼応する生命》や《呼応する小宇宙 - 固形化された光》と呼応し、光と音色を連続させていく。木々の奥から光が押し寄せてくれば、それは向こうの方に人、あるいは野生動物がいることを意味する。身体、他者、野生動物のふるまい、そして周辺作品によって作品空間は変容し、人々と環境も作品の一部になっていく。<br />本作は、「Digitized Nature (2002-)」 の作品である。Digitized Nature は、自然を破壊することなく、自然が自然のままアートになる試みである。<br />森の木々そのものの姿形、質感、変化の中には、長い時間、生命の連続性、生態系との関係が内在している。木は、それ自体が生態系の一部でありながら、その表面や内部にも生命を宿し、生態系を成している。人間が作る物体とは違い、その存在の輪郭は曖昧である。<br />そのような木々に、センシング、ネットワーク、光や音といった非物質的なマテリアルが重なることで、木々は木々のまま、互いに呼応し、群体として一つの連続した場を形成する。これは、人間が自然を素材として彫刻するのではなく、長い時間と生態系の中で形づくられた木々が、木々のまま、呼応する群体彫刻として立ち上がる試みである。<br />ここでは、人間だけが作品を変化させるのではない。身体、他者、野生動物、環境、木々、そして周辺作品が、同一の生態系的な応答場に接続される。個々の木は単体として完結するのではなく、関係の中で存在し続ける。人々は作品を見るだけではなく、木々の呼応の中に入り、他者や野生動物、環境の存在を、光と音の連続性を通して感じる。<br />この構造は、自然を作品の外部にある対象としてではなく、人々や環境とともに変化する生態系的な場として提示する。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img し、連続していく。人々のふるまいや環境、周辺作品によって作品空間は変容し、人々と環境を作品の一部にしていく。<br />その内側に現れる色彩の模様の姿形は、見られるまでは無限の可能性として存在し、鑑賞されるその瞬間に、その人の視点において一つの姿形として確定する。そして、鑑賞者の動く身体、その彫刻自体の揺らぎ、周囲の環境に呼応して、その色彩の姿形は変容し続ける。<br />本作品は、「呼応する群体彫刻 (2009-)」のシリーズの作品である。個々の彫刻は自律した物理的存在でありながら、互いに呼応し、群体として一つの連続した場を形成する。<br /><br />このシリーズでは、身体で押すこと、他者が動かすこと、野外では風や雨という環境の作用、野生動物のふるまい、そして同じ彫刻群の中の隣接する彫刻や、周辺の別の作品、これらすべてが呼応の契機となる。一つの彫刻に生じた光や音や動きは、その個体に閉じることなく、近くの彫刻へ、さらに周囲の作品や空間へと連鎖し、全体へ連続していく。<br /><br />ここでは、人間だけが作品を動かすのではない。身体、他者、環境、作品が同一の生態系的な応答場に接続され、個々の彫刻は単体として完結するのではなく、関係の中で存在し続ける。<br /><br />この構造は、彫刻を「自律した個としての物体」から、身体・他者・環境・他作品との関係の中で生成し続ける、ネットワーク的な存在へと拡張する試みである。人間と非人間がともに参与するこの生態系的な応答場において、彫刻の境界は、個々の物体の輪郭にはとどまらない。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/continuouslifedeath-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">巨樹の今の中で連続する生と死 / Continuous Life and Death at the Now of an Ancient Tree</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">森に立つ巨木は、大地に根を張り、幹を太らせ、枝を広げ、長い歳月をかけて今の姿を形作ってきた。<br />人は通常、自分が生きてきた時間を遥かに超えた長い時間、そしてその時間が「今」と地続きであることを認識できない。しかし、巨木と対峙したとき、その圧倒的な姿形や質感の中に、積み重なった膨大な時間が内在していることに気づく。<br />私たちはこの長い時間が刻んだ巨大な存在を「Time-Sculpted Existence (2015-)」と名付けた。<br />この巨大な存在の中で、花々は誕生と死滅を繰り返し、連続する生命の時間が流れ、それが今を生きる人々の存在によって変容していく。<br />森に入り込み、さまよい、この圧倒的な存在と一体化するとき、積み重なった膨大な時間は、今という瞬間と連続していることがあらわになる。<br />そして、樹に積み重なった膨大な時間と、連続する生命の時間、その二つの時間が重なり合う中を歩いていくとき、人は、長い長い時間の境界のない連続性の上に自分の存在があることを、身体ごと実感する。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK Image ける巨木も残る。<br />江戸時代に育まれた江戸菊もまた、株分けや挿し芽を通して、当時の古花が今に受け継がれている。個々の花が散り、消えても、その姿は、生命の中に無形として固定化され、時を超えて保たれてきた。<br />その生きた記憶が、森の長い時間と重なり合う。<br />永遠は、どこに宿るのか。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/concreteabstract-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">具象と抽象 / Concrete and Abstract</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">森は、その複雑さを保ったまま、幾重もの平面の層として立ち現れる。<br />人々が作品の中に入り、立ち止まってしばらくすると、歪みが生まれ、広がっていく。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=384,quality=100 384w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/tracesofforest-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">森の痕跡 / Traces of the Forest</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">闇が手前にあり、光はその深淵に存在する。実体と知覚の区別は曖昧になり、物質的な境界は消失する。<br />庭園の森と一体となって無数に立つ、積層された森の痕跡の幽体。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=384,quality=100 384w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/solidifiedsparks-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">我々の中にある火花 / Cognitive Solidified Spark</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">私たちは、見ている世界を認識しているのではない。私たちは、認識している世界を見ている。<br />細く赤い光の線は、中心から放射状に無数に広がり、真っ赤なウニのような球体を形づくっている。光源は動かないが、無数の線はうごめき続ける。<br />この球体は光だけでできている。しかし、見えているその場所に、光が凝固した線の集まりがあるわけではない。<br />これは、人間の認識世界にのみ立ち現れる彫刻、「Cognitive Sculpture / 認識上の彫刻」である。彫刻の姿形は、物質的な輪郭によって決定されていない。造形の主体は、鑑賞者自身の身体と認識である。<br />ここで立ち上がる存在は、虚構ではない。その存在を成立させる物理的なエネルギーは、その鑑賞者に対して実在している。しかし、その姿形そのものは、物理世界には存在しない。つまり、その姿形をなす物質的な輪郭は、存在しない。<br />環境と認識者との関係の中に実在する現象が、ひとつの存在として形づくられる。<br />本作は、「誰が形をつくるのか」、そして「存在とは何か」を問う。<br />この線群の球体を一度認識すると、日常のいたるところにも、その姿を見いだすようになるだろう。認識している世界が変わると、見えている世界が変わっていく。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=384,quality=100 384w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/spatialcalligraphy-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">風の空書 / Spatial Calligraphy of Wind</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* 晴れた夜、風が吹く時<br />晴れた夜、風が吹く時、この作品は空に出現する。そして、風が止めば、作品は消える。<br />コンクリートなど、これまで人間がつくってきたものは、石ころのようにそれ自体で安定的な構造をもつ。<br />しかし、渦潮は、外部から内部へ、内部から外部へと流れ続ける水が渦潮の構造を生み、秩序が維持される。生命もまた、食物を通してエネルギーと物質が流れ続けることで生命の秩序が維持される。<br />この作品は、空気を内部に閉じ込め、その圧力によって空に浮かんでいるのではない。風は内部を絶え間なく流れ抜けていく。その流れそのものが、空に舞う存在の構造を生み、維持する。作品はそれ自体で構造を持たず、流れの中に生まれ、しなやかでやわらかく、脆い。そして、流れは混沌からの秩序を生み出す。<br />風は、いつ吹くか、どれほど強く吹くか、人間にはコントロールできない。作品の存在は、人間の意図ではなく、環境の側に立脚している。本作は、彫刻を、固定された物体から、開かれた環境の中で、絶え間ない流れによって構造が生まれ続ける存在へと拡張する試みである。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=384,quality=100 384w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/sphericalcrystallizedlight-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">大覗きの光の球体結晶 / Spherical Crystallized Light in the Onozoki</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">浜離宮の鴨場は、18世紀後半に築かれた。大覗き（おおのぞき）は、鴨に気づかれないように姿を隠し、池や鴨の様子をのぞき見るための観察所である。現在の施設は、修復を重ねて受け継がれている。<br />何を見ているのか？　そして、それは存在か？<br />透明の球体の中心に存在する光の球体。この光の球体の表面には、ガラスなどの物体は存在しない。この球体は光だけでできている。しかし、この世界では、光は凝固せず、光が球体状の塊になることはありえない。つまり、この球体の姿形は物理的には存在していない。<br />これは、人間の認識世界にのみ立ち現れる彫刻、「Cognitive Sculpture / 認識上の彫刻」である。彫刻の姿形は、物質的な輪郭によって決定されていない。造形の主体は、鑑賞者自身の身体と認識である。<br />この球体は、それ自体では存在できない。環境が生む現象が、鑑賞者の動的な身体と認識によってはじめて形づくられ、その認識世界において彫刻となる。<br />ここで立ち上がる存在は、虚構ではない。その存在を成立させる物理的なエネルギーは、その鑑賞者に対して実在している。しかし、その姿形そのものは、物理世界には存在しない。つまり、その姿形をなす物質的な輪郭も、その姿形と一致する光や物質の空間的分布も、存在しない。<br />環境と認識者との関係の中に実在する現象が、ひとつの存在として形づくられる。<br />本作は、「誰が形をつくるのか」、そして「存在とは何か」を問う。<br />存在は、物体としてだけではなく、環境の中に立ち上がり、認識の中で形づくられる。<br />存在と環境は切り離せない。存在と私もまた、切り離せない。<br />私たちは、世界を外から見ているのではなく、その連続体の中にいて、その中で存在を認識している。<br /></div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=384,quality=100 384w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=640,quality=100 640w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=750,quality=100 750w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=828,quality=100 828w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=1080,quality=100 1080w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=1200,quality=100 1200w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=1920,quality=100 1920w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=2048,quality=100 2048w, https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=3840,quality=100 3840w" src="https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/jp/ew/300yearpine-hamarikyu/hamarikyu/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">三百年の松 / 300-Year Pine</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">1709年頃に、植えられたと伝わっている黒松。三百年生きた松の枝は横に大きく張り出し、枝張りは17m以上にも及ぶ。</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">もっとみる</div></div></a></div></div></div></div></div></section><section class="_slug__exhibition-artist__aDw5Z" id="artist"><div class="SectionArtist_section-artist__QwN_F"><div class="SectionArtist_title__xQDMx">チームラボについて</div><div class="ArtistCard_artist-card__uZ553"><div class="ArtistCard_content__eR9Af"><div class="ArtistCard_text__zC3_G" dir="auto" style="white-space:pre-wrap;text-align:unset">アートコレクティブ。2001年から活動を開始。アート、サイエンス、テクノロジー、そして自然界の交差点を模索している国際的な学際的集団。アーティスト、プログラマ、エンジニア、CGアニメーター、数学者、建築家など、様々な分野のスペシャリストから構成されている。

チームラボは、アートによって、自分と世界との関係と新たな認識を模索したいと思っている。人は、認識するために世界を切り分けて、境界のある独立したものとして捉えてしまう。その認識の境界、そして、自分と世界との間にある境界、時間の連続性に対する認知の境界などを超えることを模索している。全ては、長い長い時の、境界のない連続性の上に危うく奇跡的に存在する。

チームラボの作品は、ビクトリア国立美術館（メルボルン）、ニュー・サウス・ウェールズ州立美術館（シドニー）、南オーストラリア州立美術館（アデレード）、オーストラリア国立美術館（キャンベラ）、アモス・レックス（ヘルシンキ）、ロサンゼルス現代美術館（ロサンゼルス）、アジア美術館（サンフランシスコ）、ボルサン・コンテンポラリー・アート・コレクション（イスタンブール）、アジア・ソサエティ（ニューヨーク）などに収蔵されている。

都営大江戸線『築地市場駅』A1出口 徒歩7分</div></div></div></div></div></div></div></div><div id="faq"><div class="FaqDetails_faq-details__Bb4M0"><div class="FaqDetails_head__ouWAr">よくある質問</div><div class="FaqDetails_body__W6s2u"><div class="FaqList_faq-list__xOK2P"><div><div id="hamarikyu-faq1" class="FaqTitle_faq-title__6rYbC"><p class="FaqTitle_category__b_hDN">チケットについて</p></div></div><div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">当日券の販売はありますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">完売していない場合は当日でも公式チケットサイトで購入が可能です。
現地での当日券の販売はございません。</div></div></div></div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">チケットの購入方法と支払方法は何がありますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">公式チケットサイトで購⼊できます。
クレジットカードがご利用いただけます。
チケットの日時変更が「3回まで」とキャンセルも可能です（入場日時まで変更可能です）。
また、荒天時の中止情報などの最新情報を、購入時のメールアドレスへお知らせします。</div></div></div></div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">購⼊したチケットの日付変更・キャンセルはできますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">未使用のチケットはキャンセル可能です。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「キャンセルする」ボタンからお⼿続きください。来場予定日時を過ぎるとキャンセル不可となります。

日時変更が可能です。
日時変更は3回まで変更できます。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「入場日を変更する」ボタンからお⼿続きください。
ただし、下記の場合入場日時の変更はできません。
　3回日時変更済みチケットの場合
　種類の異なるチケットへの変更
　チケット完売日時、または、チケット残数が不足している日時への変更
　複数枚まとめて購⼊しているうちの⼀部のチケットのみの日時変更
　複数枚まとめて購入していて、それぞれ異なる日時への変更
　チケット販売開始前の日時への変更
　チケット料金改定後、チケット料金が異なる日時への変更
　来場予定日時を過ぎた場合の変更</div></div></div></div></div></div><div class="FaqList_faq-list__xOK2P"><div><div id="hamarikyu-faq2" class="FaqTitle_faq-title__6rYbC"><p class="FaqTitle_category__b_hDN">入場について</p></div></div><div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">雨天時も開催しますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">開催いたします。ただし、会場の状況により中止中断する場合があります。最新情報は<a href="https://x.com/teamlab_hama" target="_blank">公式SNS</a>をご確認ください。</div></div></div></div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">天候による中止・中断はありますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">暴風警報・大雨警報・雷注意報が発令されている場合は、
開場の遅延や開催を中止または中断する場合がございます。
最新情報は<a href="https://x.com/teamlab_hama" target="_blank">公式SNS</a>をご確認ください。</div></div></div></div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">キャリーバッグなど大きな荷物を持ち込んだり預けることはできますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">キャリーバッグなどの大きな荷物がある場合はご入場いただけません。預ける場所もありませんので、事前に他でお預けいただきお越しください。</div></div></div></div><div class="FaqBox_faq-box__T2Lu_"><div class="FaqBox_question__jx9_y"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:normal;text-align:unset">車椅子・ベビーカーで入場できますか？</div></div><div class="FaqBox_answer__K9tKh"><div class="FaqBox_wrap___iZDp"><div class="FaqBox_text__2rR2x" dir="auto" style="white-space:pre-wrap;text-align:unset">車椅子、ベビーカーでのご入場は可能ですが安全管理上、ご入場、ご体験いただけない作品（車椅子、ベビーカーでは通れない作品）がございます。安全のため、お子様を乗せたままベビーカーを担がないでください。</div></div></div></div></div></div><a class="FaqDetails_view-all-button__mI_81" target="_blank" href="/jp/faq/hamarikyu/"><div class="FaqDetails_button__PBgbU">すべてみる</div></a></div></div></div><div class="ContactDetails_contact-details__Nhkxl" id="contact"><p class="ContactDetails_head__XtpLu">お問い合わせ</p><div class="ContactDetails_contact-list__dGIWi"><div class="ContactDetails_content__hlYoJ"><p class="ContactDetails_sub__pAB_M">チケット・ご来場について</p><div class="ContactDetails_text__9zJOf" dir="auto" style="white-space:normal;text-align:unset"><p id="isPasted">チケット、ご来場、開催状況、その他本展に関するお問い合わせは、以下の窓口へお願いいたします。<br />チームラボ 浜離宮運営事務局（RCC事業部）</p><p><a href="https://docs.google.com/forms/d/e/1FAIpQLSfEWzWHDJhmah05zKoHWzeP7Skt0dHsI10iSSBh4aroVCVaTQ/viewform" target="_blank" rel="noopener noreferrer">お問い合わせフォーム</a></p><p>TEL：<a href="tel:0822221133">082-222-1133</a> 　平日 10:00 ~ 17:00</p></div></div><div class="ContactDetails_content__hlYoJ"><p class="ContactDetails_sub__pAB_M">取材について</p><div class="ContactDetails *現地でのチケット販売はございません。
*完売していない場合は、当日も公式チケットサイトにてご購入いただけます。</div></div></div><div class="TicketDetails_list__1UdSZ"><div class="TicketDetails_ticket-segments__3O8R4"><div class="TicketDetails_segment__UcVQt"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">大人</div></div><p class="TicketDetails_fee__AdEbw">2,500円</p></div><div class="TicketDetails_ticket-segments__3O8R4"><div class="TicketDetails_segment__UcVQt"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">中高生</div></div><p class="TicketDetails_fee__AdEbw">1,500円</p></div><div class="TicketDetails_ticket-segments__3O8R4"><div class="TicketDetails_segment__UcVQt"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">小学生</div></div><p class="TicketDetails_fee__AdEbw">900円</p></div><div class="TicketDetails_ticket-segments__3O8R4"><div class="TicketDetails_segment__UcVQt"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">未就学児</div></div><p class="TicketDetails_fee__AdEbw">無料</p></div><div class="TicketDetails_ticket-segments__3O8R4"><div class="TicketDetails_segment__UcVQt"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">障がいのある方</div><div class="TicketDetails_sub__fuChz" dir="auto" style="white-space:normal;text-align:unset">同伴者もチケットが必要です。手帳をお持ちのご本人様と同伴者一名までは本料金でご購入ください。同伴者二名以降は通常料金でご購入ください。</div></div><p class="TicketDetails_fee__AdEbw">1,250円</p></div></div></div><div class="TicketDetails_ticket-list__yQeFy"><p class="TicketDetails_sub__fuChz">チケット</p><div class="TicketLinkItem_ticket-link-item__fNVPe"><div class="TicketLinkItem_list__h4cmf"><div class="TicketLinkItem_text__r_EeK" dir="auto" style="white-space:normal;text-align:unset">公式チケットサイト</div><a class="TicketLinkItem_link__TMX6w" target="_blank" href="https://hamarikyu.tickets.teamlab.art/">チケット購入</a></div></div></div></div></div><div class="InformationList_notes__1pBtP" id="notes"><div class="InformationNotes_information-notes__nR0Fc"><p class="InformationNotes_title__fWAgz">注意事項</p><div class="InformationNotes_notes__euF5l" dir="auto" style="white-space:normal;text-align:unset"><p id="isPasted"><strong>チケット購入にあたっての注意事項</strong></p><p>・日時指定制になっており、完売する場合がございます。</p><p>・現地でのチケット販売はございません。</p><p>・完売していない場合は当日でも公式チケットサイトで購入が可能です。</p><p>・未使用のチケットはキャンセル可能です。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「キャンセルする」ボタンからお⼿続きください。来場予定日時を過ぎるとキャンセル不可となります。</p><p>・日時変更が可能です。</p><p>日時変更は3回まで変更できます。購入したチケットに記載された来場予定日時までに、チケットに表⽰されている「入場日を変更する」ボタンからお⼿続きください。</p><p>ただし、下記の場合入場日時の変更はできません。</p><p>　3回日時変更済みチケットの場合</p><p>　種類の異なるチケットへの変更</p><p>　チケット完売日時、または、チケット残数が不足している日時への変更</p><p>　複数枚まとめて購⼊しているうちの⼀部のチケットのみの日時変更</p><p>　複数枚まとめて購入していて、それぞれ異なる日時への変更</p><p>　チケット販売開始前の日時への変更</p><p>　チケット料金改定後、チケット料金が異なる日時への変更</p><p id="isPasted">　来場予定日時を過ぎた場合の変更</p><p>・料金は税込の金額となります。</p><p>・障がい者手帳をお持ちの方へ</p><p id="isPasted">障がい者手帳をお持ちの方ご本人様と同伴者1名まで、障がいのある方向けチケットをご購入頂けます（子どもチケットで障がい者手帳をお持ちの場合、同伴者1名まで障がいのある方向けチケットをご購入頂けます）。</p><p>入場ゲートで手帳の確認を行いますので、同伴の方はご一緒にご入場ください。</p><p>各国で発行された障がい者手帳も対象です。</p><p>・子ども（中学生以下）の方のご利用には、18歳以上の保護者の同伴が必要です。無料の子ども含め、子ども3名につき保護者1名が必要です。</p><p>・未就学児は無料です。</p><p>・開場時間はチケット購入ページでの事前の告知を持って、変更になる可能性があります。</p><p><br /></p><p><strong>ご来場にあたっての注意事項</strong></p><p>・当展示のご利用の際のお怪我や損失・損害、その他トラブルなどにつきまして主催者は一切責任を負いません。</p><p>・チケットの転売は禁止しており、転売にて購入いただいたチケットではご入場頂けず、その場合も主催者は一切の責任を負いません。</p><p>・混雑やメンテナンス、天候の関係で、一部の作品をご体験いただけない場合がございます。</p><p>・季節により作品や作品の仕様が変更となる場合がございます。</p><p>・会場内にトイレはございます。</p><p>・主催者の都合により展示を中断・中止する場合がございます。</p><p>・暴風警報・大雨警報/注意報・雷注意報が発令されている場合は開催を中止または中断する場合がございます。</p><p>・その他荒天により安全が確保されないと判断した場合は、展示を中止または中断する場合があります。</p><p>・展示を中止する場合は公式SNSにて公表いたします。</p><p>・ご来場にかかる旅費などの補償は、展示中止の場合も行なっておりません。</p><p>・チケットに記載の開催時間に入場口にご来場いただき、入場列にお並びください。</p><p>・入場後の滞在時間に制限はございません。</p><p>・再入場はできません。</p><p>・混雑時はご入場まで屋外で長時間お待ちいただく場合もございます。季節によって防暑・防寒対策のご用意をお願いします。スケジュールには余裕を持ってご来場ください。</p><p>・入場待機列から離れる際は、必ず代表者の方がお残りください。</p><p>・補助犬（盲導犬・聴導犬・介助犬）を除き、ペットを連れてのご入場はできません。</p><p>※キャリーケース等に入れている場合でもご入場いただけません。</p><p>・補助犬のみご入場いただけます。安全上のため、ご入場は自己責任でお願いいたします。</p><p>・車椅子、ベビーカーでのご入場は可能ですが安全管理上、ご入場、ご体験いただけない作品（車椅子、ベビーカーでは通れない作品）がございます。</p><p>・貴重品は各自の責任にて管理をお願い致します｡万一､盗難･紛失が発生した場合、主催者は一切責任を負いません。</p><p>・会場内は暗く、高低差・不安定な足場の箇所が多数ございます。</p><p>ご自身とお連れ様、ならびに他のお客様の行動に細心の注意を頂き、特にお子様連れのお客様は保護者様の監督責任のもと、安全にお過ごしくださいますようお願いします。</p><p>・降雨によって重くなった枯れ枝が落ちたり（落枝）、木が倒れる可能性があります。ご理解の上、十分ご注意ください。</p><p>万一、落下物があった場合は、お近くのスタッフまでお声掛けください。</p><p>・会場内には未舗装のエリアが多いため歩きやすい運動靴などでのご来場を推奨しております。また虫刺され防止のため肌の露出を避けた服装でお越しください。</p><p>・作品の特性上、光の点滅/点灯、大きい音などの演出がございます。</p><p>・環境保全のためゴミは各自お持ち帰りくださいますようご協力ください。</p><p>・各種メディアの取材・撮影が行われる場合がございます。写り込みに同意をいただけない場合は、お近くのスタッフにお声がけください。</p><p>・入場時に身分証のご提示をお願いする場合がございます。</p><p>身分証：免許証、各種保険証、学生証、パスポート、マイナンバーカード等、氏名/年齢が確認できるもの</p><p><br /></p><p><strong>手荷物に関して</strong></p><p>・下記のものは持ち込みを禁止しております。</p><p>　酒類、食べ物（お弁当等）</p><p>　全長50cm以上の荷物</p><p>　危険物、臭気物、生花など</p><p>　ペットボトル、水筒以外の蓋が無いドリンク類</p><p>　その他、スタッフが危険であると判断した物品</p><p>・キャリーバッグなどの大きな荷物がある場合はご入場いただけません。</p><p>・安全のため、お子様を乗せたままベビーカーを担がないでください。</p><p>・ベビーカーを含む手荷物のお預かりは行っておりません。</p><p><br /></p><p><strong>禁止事項</strong></p><p>・体調不良・泥酔状態でのご入場はお断りしております。</p><p>・お写真・動画の撮影は可能ですが、他のお客様へご迷惑をおかけすることのないようにお気をつけください。</p><p>・フラッシュ撮影、および会場内でのドローンの使用は禁止しております。</p><p>・一脚、三脚、自分撮りスティック等の撮影補助機材の持ち込み、使用もお断りしております。</p><p>・事前承諾のない商業目的の撮影や取材はお断りしております。</p><p>・プロジェクター、センサー、ライト、その他機材には、作品維持ならびに安全のため絶対にお手を触れぬようお願い致します。</p><p>・会場内でのアメ・ガムを含む飲食はお断りしております。お飲物のみお召し上がりいただけます。</p><p>・会場内は火気厳禁となっております。全面禁煙のご協力をお願い致します。</p><p>・会場内で柵がある場所には入らないでください。</p><p>・立入禁止となっているエリア（作品展示エリア以外）への侵入は行わないでください</p><p>・スタッフの指示を守りお過ごしください。お守り頂けない場合は退場いただく場合がございます。</p></div><button type="button" class="InformationNotes_read-more__bJ4Wv">もっとみる</button></div></div></div></div></div></section><section class="_slug__related-news__QgCbb" id="news"><div class="SectionRelatedNews_section-related-news__1A7n3"><h2 class="SectionRelatedNews_title__ffAdc">ニュース</h2><div class="SectionRelatedNews_cards__4A18c"><article class="NewsCard_news-card__yifQO" style="opacity:0"><a target="_blank" class="NewsCard_link__WI4PO" href="https://livejapan.com/en/in-tokyo/in-pref-tokyo/in-tokyo_train_station/article-a0005957/"><div class="NewsCard_header__HH40w"><p>LIVE JAPANに、掲載。Oct 28, 2026</p></div><div dir="auto" class="NewsCard_body__i74oM"><h3 class="NewsCard_title__x1CDS">teamLab Takes Over a 400-Year-Old Edo Garden! Special Night Exhibition Arrives at Tokyo&#x27;s Hama-rikyu</h3><p class="NewsCard_text__pcQ__">Calling all teamLab fans! Tokyo’s historic Hama-rikyu Gardens—boasting over 400 years of rich history—is getting an enchanting after-dark makeover. Blending the serene landscape of a traditional Edo-period feudal lord's retreat with cutting-edge digital art, the outdoor night exhibition "teamLab Hama-rikyu" runs for a limited time from November 25 to December 24, 2026.(Excerpt from the text)</p></div></a></article><article class="NewsCard_news-card__yifQO" style="opacity:0"><a target="_blank" class="NewsCard_link__WI4PO" href="https://bijutsutecho.com/magazine/news/exhibition/33240"><div class="NewsCard_header__HH40w"><p>美術手帖に、掲載。2026年10月27日</p></div><div dir="auto" class="NewsCard_body__i74oM"><h3 class="NewsCard_title__x1CDS">チームラボが夜の浜離宮恩賜庭園をアート空間に。「チームラボ 浜離宮」が11月25日から開催</h3><p class="NewsCard_text__pcQ__">東京・中央区の浜離宮恩賜庭園を舞台に、アートコレクティブ・チームラボによる夜間アートプロジェクト「チームラボ 浜離宮」が開催される。会期は11月25日〜12月24日。
本企画は、東京都および東京国際文化芸術祭実行委員会が主催する新たな文化芸術祭「ARTE TOKYO（アルテ・トーキョー）」の特別企画として実施されるもの。アートとテクノロジーを掛け合わせた都市型プロジェクトを数多く手がけてきた杉山央（新領域株式会社）をプロデューサーに迎える。(本文抜粋)</p></div></a></article><article class="NewsCard_news-card__yifQO" style="opacity:0"><a target="_blank" class="NewsCard_link__WI4PO" href="https://www.nikkei.com/article/DGXZQOCC235220T21C26A0000000/"><div class="NewsCard_header__HH40w"><p>日本経済新聞 電子版に、掲載。2026年10月26日</p></div><div dir="auto" class="NewsCard_body__i74oM"><h3 class="NewsCard_title__x1CDS">東京都、浜離宮でチームラボ展　国際芸術祭のプログラムで夜間帯活用</h3><p class="NewsCard_text__pcQ__">東京都は11月から、国が特別名勝・特別史跡に指定する浜離宮恩賜庭園（東京・中央）で夜間にアート集団のチームラボ（東京・千代田）の野外アート展を開く。閉園する午後5時以降の時間帯を活用し、庭園の新たな魅力を発信する。(本文抜粋)</p></div></a></article></div><div class="SectionRelatedNews_button__98_ud"><button type="button" class="ViewMoreButton_view-more-button__H9fVS">もっとみる</button></div></div></section><section class="_slug__section-about___BR2j"><div class="SectionAbout_section-about__Z1NdG"><div class="SectionAbout_event__e4v0Q"><div class="InformationEvent_information-event__lNoMo"><div class="InformationEvent_table__akD60"><p class="InformationEvent_head__Iedtv">主催</p><div class="InformationEvent_text__k_SXA" dir="auto" style="white-space:normal;text-align:unset">東京都／東京国際文化芸術祭実行委員会</div></div><div class="InformationEvent_table__akD60"><p class="InformationEvent_head__Iedtv">プロデューサー</p><div class="InformationEvent_text__k_SXA" dir="auto" style="white-space:normal;text-align:unset"><p>杉山 央（新領域株式会社）</p></div></div><div class="InformationEvent_table__akD60"><p class="InformationEvent_head__Iedtv">助成</p><div class="InformationEvent_text__k_SXA" dir="auto" style="white-space:normal;text-align:unset"><p>令和８年度 日本博による地域固有文化コンテンツ創出補助事業</p></div></div><div class="InformationEvent_table__akD60"><p class="InformationEvent_head__Iedtv">ARTE TOKYO 公式サイト</p><div class="InformationEvent_text__k_SXA" dir="auto" style="white-space:normal;text-align:unset"><p><a href="https://artetokyo.jp/" target="_blank" rel="noopener noreferrer">ht た。1654年頃からこの地を埋め立て、その後「甲府浜屋敷」が建てられた。六代将軍時（1709年 – 1712年）からは「御浜御殿」と呼ばれ、約160年にわたって使われた。明治に入ると皇室の離宮となり、震災と戦災で建物の多くを失いながらも、1946年、恩賜庭園として人々に開かれた。\n\u003cbr\u003e\u003cbr\u003e\nこの地は、鷹狩場から、将軍家の別邸、皇室の離宮、そして人々の庭園へと役割を変えながら約400年にわたり使われ続けてきた。本展では、長い時間を持つこの庭園が、そのまま作品空間となり、風や雨、うつろう森の影響を受けながら、今を生きる人々の存在によって変容していく。\n\u003cbr\u003e\u003cbr\u003e\n庭園の森をさまよい、積み重なった時間と今が重なり合う中を歩いていくとき、自然と人々、長い時間と今が境界なく連続していく。"},"mainVisualUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/public","mainVisualUrlSp":null,"mainPcVideoId":"l_54LkNKGrA","pcMovieThumbnail":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/67415a82-5837-4fe8-7aa3-2a700faa5400/public","spMovieThumbnail":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/67415a82-5837-4fe8-7aa3-2a700faa5400/public","subGalleries":[{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/c0335d58-0b6c-40d0-83b4-23988345ac00/public","caption":null,"isWide":true},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26633e8e-cfa4-4cd4-e785-60f0e00cee00/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/1f8ed0eb-ffe4-4754-14cb-ad246ae60200/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/fcd9fa2d-1249-4d40-df1d-303e11f67b00/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/425d6777-84bc-4b25-fd08-fccc70327100/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/c2b2a111-7265-48df-4e20-894cc25c9d00/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/6b91dc97-9eb0-4fd2-7a14-dc95ffafa900/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/2072b5cc-80df-4202-e941-17cab5ab2300/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/25ec49d4-1df6-45fd-60da-fdf6f8c0e600/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/076a8b41-9a9e-4ae4-05c9-c60e0a499000/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/11282cad-6a5c-4132-4989-65f9220b8500/public","caption":null,"isWide":false},{"imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/9a197bd3-e5a0-404d-b80f-62299e4ff800/public","caption":null,"isWide":false}],"bigNewExhibitionWorks":[],"newExhibitionWorks":[],"themes":[{"concept":{"url":"","isExternal":false},"title":"ARTWORKS","description":null,"displayType":null,"cards":[{"title":"生生流転柱 / Pillars of Constant Flux","url":"/ew/pillars-constantflux-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/7bef7205-2ef8-4157-76a3-e668b6f66000/public","description":"\u003cp id=\"isPasted\"\u003e* 風、雨の強さで作品の高さ（長さ）が変化します。強風、強雨時、作品は展示されません。\u003c/p\u003e\u003cp\u003e以下は風速と作品の高さの目安ですが、変更する可能性があります。\u003c/p\u003e\u003cp\u003e無風〜微風 100m\u003c/p\u003e\u003cp\u003e微風〜1.5m/s 80m\u003c/p\u003e\u003cp\u003e1.5m/s〜2.5m/s 60m\u003c/p\u003e\u003cp\u003e2.5m/s〜5.0m/s もしくは小雨 40m\u003c/p\u003e\u003cp\u003e5.0m/s〜 30m\u003cbr\u003e\u003cbr\u003eすべての生命は、流れの中にあり、流れそのものが構造を作り、維持している。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eそれは、石ころや鉄、そして、これまで人間がつくってきた物体のように、それ自体で独立し、静的で安定的な構造をもつものとは根本的に異なる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの作品は、空気を内部に閉じ込め、その圧力によって立っているのではない。入口と出口は同じ大きさで、空気は内部を絶え間なく流れ抜けていく。その流れそのものによって、作品は、その構造と存在を維持する。流れが止まれば、作品としての存在は消えてしまう。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eここでは、流れによって物体が動かされているのではない。流れそのものが構造を生み、存在を立ち上げている。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e作品は、風や雨、湿度など環境の影響を強く受け、動きや高さを大きく変えていく。それでも、存在を生む環境が維持され、流れが続く限り、絶えず形を変えながらも、その存在は維持される。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eそれは、動き続け、しなやかでやわらかく、そして脆い。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e《生生流転柱》は、彫刻を、固定された物体から、開かれた環境の中で、絶え間ない流れによって構造が生まれ続ける存在へと拡張する試みである。作家が直接形をつくるのではなく、存在が生まれる環境をつくる。ここでは、彫刻の存在条件が、物質から、流れが生む秩序へと移行する。\u003c/p\u003e","label":"","term":"","videoId":"D35CicxbwhM","isLong":false,"isWide":false},{"title":"自立しつつも呼応する生命 / Autonomous Resonating Life","url":"/ew/resonatinglife-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/d2f421de-347f-49a1-ca57-1b3c51222500/public","description":"\u003cp id=\"isPasted\"\u003eそれぞれのOvoid は、人や野生動物に押されると、もしくは、強い雨や風に吹かれ倒れると、光を強く輝かせ、音色を響かせながら自ら立ち上がる。隣接するOvoid は次々に呼応し、光と音色を連続させていく。\u003c/p\u003e\u003cp\u003eOvoidの光と音色は、隣接する作品《\u003ca href=\"https://www.teamlab.art/jp/ew/resonatingtrees-hamarikyu/hamarikyu/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e呼応する木々\u003c/a\u003e》にも伝播し、連続していく。人々のふるまいや環境、周辺作品によって作品空間は変容し、人々と環境を作品の一部にしていく。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e本作品は、「\u003ca href=\"https://www.teamlab.art/jp/concept/resonant-collective-sculpture/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e呼応する群体彫刻\u003c/a\u003e (2009-)」のシリーズの作品である。個々の彫刻は自律した物理的存在でありながら、互いに呼応し、群体として一つの連続した場を形成する。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこのシリーズでは、身体で押すこと、他者が動かすこと、野外では風や雨という環境の作用、野生動物のふるまい、そして同じ彫刻群の中の隣接する彫刻や、周辺の別の作品、これらすべてが呼応の契機となる。一つの彫刻に生じた光や音や動きは、その個体に閉じることなく、近くの彫刻へ、さらに周囲の作品や空間へと連鎖し、全体へ連続していく。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eここでは、人間だけが作品を動かすのではない。身体、他者、環境、作品が同一の生態系的な応答場に接続され、個々の彫刻は単体として完結するのではなく、関係の中で存在し続ける。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの構造は、彫刻を「自律した個としての物体」から、身体・他者・環境・他作品との関係の中で生成し続ける、ネットワーク的な存在へと拡張する試みである。人間と非人間がともに参与するこの生態系的な応答場において、彫刻の境界は、個々の物体の輪郭にはとどまらない。\u003c/p\u003e","label":"","term":"","videoId":"J11DT7Nx0_M","isLong":false,"isWide":false},{"title":"呼応する木々 / Resonating Trees","url":"/ew/resonatingtrees-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/f730c427-7b44-4f59-2305-0340106f8900/public","description":"\u003cp id=\"isPasted\"\u003e木々は、隣接する木や、隣接する作品《\u003ca href=\"https://www.teamlab.art/jp/ew/resonatinglife-hamarikyu/hamarikyu/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e自立しつつも呼応する生命\u003c/a\u003e》や《\u003ca href=\"https://www.teamlab.art/jp/ew/resonatingmicrocosms-hamarikyu/hamarikyu/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e呼応する小宇宙 - 固形化された光\u003c/a\u003e》と呼応し、光と音色を連続させていく。木々の奥から光が押し寄せてくれば、それは向こうの方に人、あるいは野生動物がいることを意味する。身体、他者、野生動物のふるまい、そして周辺作品によって作品空間は変容し、人々と環境も作品の一部になっていく。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e本作は、「\u003ca href=\"https://www.teamlab.art/jp/concept/digitizednature/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eDigitized Nature\u003c/a\u003e (2002-)」 の作品である。Digitized Nature は、自然を破壊することなく、自然が自然のままアートになる試みである。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e森の木々そのものの姿形、質感、変化の中には、長い時間、生命の連続性、生態系との関係が内在している。木は、それ自体が生態系の一部でありながら、その表面や内部にも生命を宿し、生態系を成している。人間が作る物体とは違い、その存在の輪郭は曖昧である。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eそのような木々に、センシング、ネットワーク、光や音といった非物質的なマテリアルが重なることで、木々は木々のまま、互いに呼応し、群体として一つの連続した場を形成する。これは、人間が自然を素材として彫刻するのではなく、長い時間と生態系の中で形づくられた木々が、木々のまま、呼応する群体彫刻として立ち上がる試みである。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eここでは、人間だけが作品を変化させるのではない。身体、他者、野生動物、環境、木々、そして周辺作品が、同一の生態系的な応答場に接続される。個々の木は単体として完結するのではなく、関係の中で存在し続ける。人々は作品を見るだけではなく、木々の呼応の中に入り、他者や野生動物、環境の存在を、光と音の連続性を通して感じる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの構造は、自然を作品の外部にある対象としてではなく、人々や環境とともに変化する生態系的な場として提示する。\u003c/p\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"呼応する小宇宙 - 固形化された光 / Resonating Microcosms - Solidified Light","url":"/ew/resonatingmicrocosms-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26633e8e-cfa4-4cd4-e785-60f0e00cee00/public","description":"\u003cp id=\"isPasted\"\u003eそれぞれのOvoidは、人や野生動物に押されると、もしくは、強い雨や風に吹かれ倒れると、光を強く輝かせ、音色を響かせながら自ら立ち上がる。隣接する Ovoidも次々に呼応し、光と音色と揺らぎを連続させていく。\u003c/p\u003e\u003cp\u003eOvoidの光と音色は、隣接する作品《\u003ca href=\"https://www.teamlab.art/jp/ew/resonatingtrees-hamarikyu/hamarikyu/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e呼応する木々\u003c/a\u003e》にも伝播し、連続していく。人々のふるまいや環境、周辺作品によって作品空間は変容し、人々と環境を作品の一部にしていく。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eその内側に現れる色彩の模様の姿形は、見られるまでは無限の可能性として存在し、鑑賞されるその瞬間に、その人の視点において一つの姿形として確定する。そして、鑑賞者の動く身体、その彫刻自体の揺らぎ、周囲の環境に呼応して、その色彩の姿形は変容し続ける。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e本作品は、「\u003ca href=\"https://www.teamlab.art/jp/concept/resonant-collective-sculpture/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e呼応する群体彫刻\u003c/a\u003e (2009-)」のシリーズの作品である。個々の彫刻は自律した物理的存在でありながら、互いに呼応し、群体として一つの連続した場を形成する。\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこのシリーズでは、身体で押すこと、他者が動かすこと、野外では風や雨という環境の作用、野生動物のふるまい、そして同じ彫刻群の中の隣接する彫刻や、周辺の別の作品、これらすべてが呼応の契機となる。一つの彫刻に生じた光や音や動きは、その個体に閉じることなく、近くの彫刻へ、さらに周囲の作品や空間へと連鎖し、全体へ連続していく。\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eここでは、人間だけが作品を動かすのではない。身体、他者、環境、作品が同一の生態系的な応答場に接続され、個々の彫刻は単体として完結するのではなく、関係の中で存在し続ける。\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの構造は、彫刻を「自律した個としての物体」から、身体・他者・環境・他作品との関係の中で生成し続ける、ネットワーク的な存在へと拡張する試みである。人間と非人間がともに参与するこの生態系的な応答場において、彫刻の境界は、個々の物体の輪郭にはとどまらない。\u003c/p\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"巨樹の今の中で連続する生と死 / Continuous Life and Death at the Now of an Ancient Tree","url":"/ew/continuouslifedeath-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/db18392d-0159-42df-248a-5b5e7e673e00/public","description":"\u003cp id=\"isPasted\"\u003e森に立つ巨木は、大地に根を張り、幹を太らせ、枝を広げ、長い歳月をかけて今の姿を形作ってきた。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e人は通常、自分が生きてきた時間を遥かに超えた長い時間、そしてその時間が「今」と地続きであることを認識できない。しかし、巨木と対峙したとき、その圧倒的な姿形や質感の中に、積み重なった膨大な時間が内在していることに気づく。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e私たちはこの長い時間が刻んだ巨大な存在を「\u003ca href=\"https://www.teamlab.art/jp/concept/timesculptedexistence/\"\u003eTime-Sculpted Existence\u003c/a\u003e (2015-)」と名付けた。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの巨大な存在の中で、花々は誕生と死滅を繰り返し、連続する生命の時間が流れ、それが今を生きる人々の存在によって変容していく。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e森に入り込み、さまよい、この圧倒的な存在と一体化するとき、積み重なった膨大な時間は、今という瞬間と連続していることがあらわになる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eそして、樹に積み重なった膨大な時間と、連続する生命の時間、その二つの時間が重なり合う中を歩いていくとき、人は、長い長い時間の境界のない連続性の上に自分の存在があることを、身体ごと実感する。\u003c/p\u003e","label":"","term":"","videoId":"GM9GpMz1ja8","isLong":false,"isWide":false},{"title":"幽けき花々 / Ethereal Flowers","url":"/ew/etherealflowers-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a3f39cf6-d6a1-4e67-8687-0c54b737af00/public","description":"\u003cp id=\"isPasted\"\u003e庭園の森の中に、江戸菊の花群れが現れる。花々はゆらめき、重なり合い、古色を帯びた森と一体となる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e一つひとつの花は、生まれ、咲き、やがて散り、消えていく。花々の生と死が繰り返されることで、花群れは存在し続ける。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e浜離宮の庭園は、江戸時代中期から後期（18世紀前半〜19世紀前半）にかけて、現在につながる姿へと整えられた。園内には、三百年以上の時を生き続ける巨木も残る。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e江戸時代に育まれた江戸菊もまた、株分けや挿し芽を通して、当時の古花が今に受け継がれている。個々の花が散り、消えても、その姿は、生命の中に無形として固定化され、時を超えて保たれてきた。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eその生きた記憶が、森の長い時間と重なり合う。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e永遠は、どこに宿るのか。\u003c/p\u003e","label":"","term":"","videoId":"RZLreB4VWDI","isLong":false,"isWide":false},{"title":"具象と抽象 / Concrete and Abstract","url":"/ew/concreteabstract-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a694ffd6-0791-4d1b-bddb-98a49195a500/public","description":"\u003cp id=\"isPasted\"\u003e森は、その複雑さを保ったまま、幾重もの平面の層として立ち現れる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e人々が作品の中に入り、立ち止まってしばらくすると、歪みが生まれ、広がっていく。\u003c/p\u003e","label":"","term":"","videoId":"xjOk3y_9k-c","isLong":false,"isWide":false},{"title":"森の痕跡 / Traces of the Forest","url":"/ew/tracesofforest-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/a9eede14-a189-45a5-d7b5-9626b4e66600/public","description":"\u003cp id=\"isPasted\"\u003e闇が手前にあり、光はその深淵に存在する。\u003c/p\u003e\u003cp\u003e実体と知覚の区別は曖昧になり、物質的な境界は消失する。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e庭園の森と一体となって無数に立つ、積層された森の痕跡の幽体。\u003c/p\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"我々の中にある火花 / Cognitive Solidified Spark","url":"/ew/solidifiedsparks-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/e18f5c16-6e0d-4266-4070-6f79f7190b00/public","description":"\u003cp id=\"isPasted\"\u003e私たちは、見ている世界を認識しているのではない。\u003c/p\u003e\u003cp\u003e私たちは、認識している世界を見ている。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e細く赤い光の線は、中心から放射状に無数に広がり、真っ赤なウニのような球体を形づくっている。光源は動かないが、無数の線はうごめき続ける。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの球体は光だけでできている。しかし、見えているその場所に、光が凝固した線の集まりがあるわけではない。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこれは、人間の認識世界にのみ立ち現れる彫刻、「\u003ca href=\"https://www.teamlab.art/jp/concept/cognitive-sculpture/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCognitive Sculpture / 認識上の彫刻\u003c/a\u003e」である。彫刻の姿形は、物質的な輪郭によって決定されていない。造形の主体は、鑑賞者自身の身体と認識である。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eここで立ち上がる存在は、虚構ではない。その存在を成立させる物理的なエネルギーは、その鑑賞者に対して実在している。しかし、その姿形そのものは、物理世界には存在しない。つまり、その姿形をなす物質的な輪郭は、存在しない。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e環境と認識者との関係の中に実在する現象が、ひとつの存在として形づくられる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e本作は、「誰が形をつくるのか」、そして「存在とは何か」を問う。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの線群の球体を一度認識すると、日常のいたるところにも、その姿を見いだすようになるだろう。\u003c/p\u003e\u003cp\u003e認識している世界が変わると、見えている世界が変わっていく。\u003c/p\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"風の空書 / Spatial Calligraphy of Wind","url":"/ew/spatialcalligraphy-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/26bd4aed-0e37-4821-f082-cf22d1a0f500/public","description":"\u003cp id=\"isPasted\"\u003e* 晴れた夜、風が吹く時\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003e晴れた夜、風が吹く時、この作品は空に出現する。そして、風が止めば、作品は消える。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eコンクリートなど、これまで人間がつくってきたものは、石ころのようにそれ自体で安定的な構造をもつ。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eしかし、渦潮は、外部から内部へ、内部から外部へと流れ続ける水が渦潮の構造を生み、秩序が維持される。生命もまた、食物を通してエネルギーと物質が流れ続けることで生命の秩序が維持される。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの作品は、空気を内部に閉じ込め、その圧力によって空に浮かんでいるのではない。風は内部を絶え間なく流れ抜けていく。その流れそのものが、空に舞う存在の構造を生み、維持する。作品はそれ自体で構造を持たず、流れの中に生まれ、しなやかでやわらかく、脆い。そして、流れは混沌からの秩序を生み出す。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e風は、いつ吹くか、どれほど強く吹くか、人間にはコントロールできない。作品の存在は、人間の意図ではなく、環境の側に立脚している。\u003c/p\u003e\u003cp\u003e本作は、彫刻を、固定された物体から、開かれた環境の中で、絶え間ない流れによって構造が生まれ続ける存在へと拡張する試みである。\u003c/p\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"大覗きの光の球体結晶 / Spherical Crystallized Light in the Onozoki","url":"/ew/sphericalcrystallizedlight-hamarikyu/hamarikyu/","imageUrl":"https://teamlab-site.imagewave.pictures/b5EBo9Uo-OK6SM09ZTkEZQ/93e74718-60d0-4c77-017f-1dab83747700/public","description":"\u003cp id=\"isPasted\"\u003e浜離宮の鴨場は、18世紀後半に築かれた。大覗き（おおのぞき）は、鴨に気づかれないように姿を隠し、池や鴨の様子をのぞき見るための観察所である。現在の施設は、修復を重ねて受け継がれている。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e何を見ているのか？　そして、それは存在か？\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e透明の球体の中心に存在する光の球体。この光の球体の表面には、ガラスなどの物体は存在しない。この球体は光だけでできている。しかし、この世界では、光は凝固せず、光が球体状の塊になることはありえない。つまり、この球体の姿形は物理的には存在していない。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこれは、人間の認識世界にのみ立ち現れる彫刻、「\u003ca href=\"https://www.teamlab.art/jp/concept/cognitive-sculpture/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCognitive Sculpture / 認識上の彫刻\u003c/a\u003e」である。彫刻の姿形は、物質的な輪郭によって決定されていない。造形の主体は、鑑賞者自身の身体と認識である。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eこの球体は、それ自体では存在できない。環境が生む現象が、鑑賞者の動的な身体と認識によってはじめて形づくられ、その認識世界において彫刻となる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eここで立ち上がる存在は、虚構ではない。その存在を成立させる物理的なエネルギーは、その鑑賞者に対して実在している。しかし、その姿形そのものは、物理世界には存在しない。つまり、その姿形をなす物質的な輪郭も、その姿形と一致する光や物質の空間的分布も、存在しない。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e環境と認識者との関係の中に実在する現象が、ひとつの存在として形づくられる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e本作は、「誰が形をつくるのか」、そして「存在とは何か」を問う。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e存在は、物体としてだけではなく、環境の中に立ち上がり、認識の中で形づくられる。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e存在と環境は切り離せない。存在と私もまた、切り離せない。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e私たちは、世界を外から見ているのではなく、その連続体の中にいて、その中で存在を認識している。\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"三百年の松 / 300-Year Pine","url":"/ew/300yearpine-hamar
