name: Validate Staging and Publish Preview

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'tests/**'
      - 'prompts/**'
      - 'package.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/release-trigger.txt'
      - '.github/data-deploy-trigger.txt'
      - '.github/production-releases.json'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      base_data_production_sha: ${{ steps.gate.outputs.base_data_production_sha }}
      operation: ${{ steps.gate.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          mode="staging"
          candidate=""
          base=""
          operation=""

          if [ "${{ github.event_name }}" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ] && printf '%s\n' "$changed" | grep -Fxq '.github/data-deploy-trigger.txt'; then
              mode="data"
              candidate="$(sed -n 's/^candidate_sha=//p' .github/data-deploy-trigger.txt | tail -1)"
              base="$(sed -n 's/^base_data_production_sha=//p' .github/data-deploy-trigger.txt | tail -1)"
              operation="$(sed -n 's/^operation=//p' .github/data-deploy-trigger.txt | tail -1)"
              if ! printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid candidate_sha in data deploy trigger" >&2
                exit 1
              fi
              if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid base_data_production_sha in data deploy trigger" >&2
                exit 1
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "base_data_production_sha=$base" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  validate_staging:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate canonical prompt governance
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate non-regression against previous published data
        run: python tools/validate_non_regression.py --base-ref HEAD^ site/data
      - name: Block every unapproved removal of previously published events
        run: python tools/validate_protected_events.py --base-ref HEAD^ site/data
      - name: Enrich thumbnail URLs for validation only
        run: python tools/enrich_images.py site/data
      - name: Audit event-specific images on multi-event official pages
        run: |
          python tools/audit_event_image_identity.py site/data --strict
          python -m unittest discover -s tests -p 'test_event_image_identity.py'
      - name: Validate event data strictly
        run: python tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate family-fit decision audit strictly
        run: python tools/validate_decisions.py --strict site/data
      - name: Validate v1.6 exclusion rereview
        run: python tools/validate_rereview.py --strict site/data
      - name: Validate official schedule discovery evidence
        run: python tools/validate_official_schedule_audit.py site/data
      - name: Test copy contract and shared filters
        run: npm test
      - name: Classify intentional staging-only differences (never auto-approve new ones)
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_environment_diff_policy.py'
          python3 tools/audit_environment_diff.py --fetch --ref HEAD --base origin/production

  validate_data:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'data' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Checkout released application
        uses: actions/checkout@v4
        with:
          ref: production
          path: production-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm candidate belongs to data-staging
        shell: bash
        run: |
          git fetch origin data-staging --depth=1
          expected="$(git rev-parse origin/data-staging)"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Candidate SHA is not the current data-staging head" >&2
            exit 1
          fi
      - name: Confirm production-data base has not moved
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/data-production | awk '{print $1}')"
          expected="${{ needs.gate.outputs.base_data_production_sha }}"
          if [ "$current" != "$expected" ]; then
            echo "data-production moved: expected $expected but found $current" >&2
            exit 1
          fi
      - name: Validate released prompt governance
        working-directory: production-src
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate data non-regression against current production data
        run: python production-src/tools/validate_non_regression.py --base-ref ${{ needs.gate.outputs.base_data_production_sha }} site/data
      - name: Overlay released static data policy for validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          src = Path("production-src/site/data")
          dst = Path("site/data")
          runtime = re.compile(r"^20\d{2}-\d{2}-\d{2}.*\.json$")

          for p in src.iterdir():
              if not p.is_file():
                  continue
              if runtime.match(p.name) or p.name in {"manifest.json", "update_history.json"}:
                  continue
              shutil.copy2(p, dst / p.name)
          PY
      - name: Preserve frozen candidate data during validation
        run: echo 'Use existing staged image URLs; image coverage is checked strictly without modifying event files'
      - name: Validate candidate event data strictly
        run: python production-src/tools/validate_data.py --strict --min-image-coverage 0.70 site/data
      - name: Validate candidate family-fit decisions strictly
        run: python production-src/tools/validate_decisions.py --strict site/data
      - name: Validate candidate rereview strictly
        run: python production-src/tools/validate_rereview.py --strict site/data
      - name: Checkout staging audit policy
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging-policy-src
      - name: Download immutable 2026-10-26 source evidence for verified horizon subset
        if: ${{ needs.gate.outputs.operation == 'verified-horizon-subset' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12621285469
          run-id: 40239302863
          github-token: ${{ github.token }}
          path: original-audit-evidence
      - name: Audit image-to-event assignment before data promotion
        run: |
          python staging-policy-src/tools/audit_event_image_identity.py site/data --strict
          python -m unittest discover -s staging-policy-src/tests -p 'test_event_image_identity.py'
      - name: Prevent historical event removal without user approval
        run: python staging-policy-src/tools/validate_protected_events.py --base-ref ${{ needs.gate.outputs.base_data_production_sha }} site/data
      - name: Prove the exact one-field thumbnail-only correction
        if: ${{ needs.gate.outputs.operation == 'thumbnail-correction' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          baseline = "${{ needs.gate.outputs.base_data_production_sha }}"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", baseline, "HEAD"], text=True
          ).splitlines()
          path = "site/data/2026-10-24-events-01.json"
          if changed != [path]:
              raise SystemExit(f"THUMBNAIL-ONLY GUARD: expected only {path}, got {changed!r}")
          before = json.loads(subprocess.check_output(
              ["git", "show", f"{baseline}:{path}"], text=True
          ))
          after = json.loads(Path(path).read_text(encoding="utf-8"))
          if len(before) != len(after):
              raise SystemExit("THUMBNAIL-ONLY GUARD: event count changed")
          target_id = "v15-16abce941248"
          old = "https://www.koho.metro.tokyo.lg.jp/2026/10/images/202610_moyoshi14_07.png"
          new = "https://www.koho.metro.tokyo.lg.jp/2026/10/images/202610_moyoshi14_06.jpg"
          touched = []
          for a, b in zip(before, after):
              if a.get("id") != b.get("id"):
                  raise SystemExit("THUMBNAIL-ONLY GUARD: event order or ID changed")
              if a != b:
                  touched.append(a.get("id"))
                  expect = dict(a)
                  expect["image"] = new
                  if a.get("id") != target_id or a.get("image") != old or b != expect:
                      raise SystemExit("THUMBNAIL-ONLY GUARD: unauthorized record or field change")
          if touched != [target_id]:
              raise SystemExit(f"THUMBNAIL-ONLY GUARD: changed event ids {touched!r}")
          print("THUMBNAIL-ONLY GUARD PASS: one evidence-backed image URL correction; all other files/records intact")
          PY
      - name: Validate candidate official schedule discovery evidence
        if: ${{ needs.gate.outputs.operation != 'thumbnail-correction' }}
        shell: bash
        run: |
          if [ "${{ needs.gate.outputs.operation }}" = "verified-forest-table-addition" ]; then
            python3 staging-policy-src/tools/validate_nerima_forest_addition.py \
              --base-ref "${{ needs.gate.outputs.base_data_production_sha }}"
          elif [ "${{ needs.gate.outputs.operation }}" = "verified-horizon-subset" ]; then
            python3 staging-policy-src/tools/validate_verified_horizon_rollover.py \
              --data-dir site/data \
              --main-dir staging-policy-src \
              --evidence-dir original-audit-evidence/holiday-after-source-evidence \
              --base-ref "${{ needs.gate.outputs.base_data_production_sha }}"
          elif [ "${{ needs.gate.outputs.operation }}" = "verified-subset-addition" ]; then
            subset_kind="$(python3 -c 'import json; print(json.load(open("site/data/update_history.json"))["history"][-1]["run_type"])')"
            if [ "$subset_kind" = "manual_verified_week_holiday_addition" ]; then
              python staging-policy-src/tools/validate_this_week_verified_addition.py \
                --base-ref "${{ needs.gate.outputs.base_data_production_sha }}"
            elif [ "$subset_kind" = "manual_verified_weekend_subset_addition" ]; then
              python staging-policy-src/tools/validate_verified_weekend_subset.py \
                --base-ref "${{ needs.gate.outputs.base_data_production_sha }}"
            elif [ "$subset_kind" = "manual_verified_subset_addition" ]; then
              python staging-policy-src/tools/validate_verified_subset.py \
                --base-ref "${{ needs.gate.outputs.base_data_production_sha }}"
            else
              echo "Unknown subset operation: $subset_kind" >&2; exit 1
            fi
          elif [ "${{ needs.gate.outputs.operation }}" = "manual-independent-holiday-addition" ]; then
            python staging-policy-src/tools/validate_official_schedule_audit.py site/data \
              --allow-unchanged-historical-gaps-base "${{ needs.gate.outputs.base_data_production_sha }}"
          else
            python staging-policy-src/tools/validate_official_schedule_audit.py site/data
          fi
      - name: Refuse holiday-after refresh if official weekday holidays are missing from six-week manifest
        if: ${{ needs.gate.outputs.operation == 'holiday-after-update' || needs.gate.outputs.operation == 'verified-horizon-subset' }}
        run: |
          python3 -m unittest discover -s staging-policy-src/tests -p 'test_weekday_holiday_coverage.py'
          python3 staging-policy-src/tools/audit_weekday_holiday_coverage.py --manifest site/data/manifest.json --strict
      - name: Validate holiday-after data publication history
        if: ${{ needs.gate.outputs.operation == 'holiday-after-update' }}
        run: node staging-policy-src/tools/holiday_update_history.mjs --check --base-ref ${{ needs.gate.outputs.base_data_production_sha }} --data-dir site/data
      - name: Run released application regression tests
        working-directory: production-src
        run: npm test

  promote_data:
    needs: [gate, validate_data]
    if: ${{ needs.gate.outputs.mode == 'data' && needs.validate_data.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      previous_sha: ${{ steps.promote.outputs.previous_sha }}
      candidate_sha: ${{ steps.promote.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          fetch-depth: 0
      - id: promote
        shell: bash
        run: |
          expected="${{ needs.gate.outputs.base_data_production_sha }}"
          candidate="$(git rev-parse HEAD)"
          current="$(git ls-remote origin refs/heads/data-production | awk '{print $1}')"

          if [ "$current" != "$expected" ]; then
            echo "data-production moved: expected $expected but found $current" >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/data-production" --force-with-lease="refs/heads/data-production:$expected"
          echo "previous_sha=$expected" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  preview:
    needs: [gate, validate_staging, validate_data, promote_data]
    if: >-
      ${{ always() &&
          ((needs.gate.outputs.mode == 'staging' && needs.validate_staging.result == 'success') ||
           (needs.gate.outputs.mode == 'data' && needs.validate_data.result == 'success' && needs.promote_data.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}staging/
    steps:
      - name: Checkout staging application
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging-src
      - name: Checkout production application
        uses: actions/checkout@v4
        with:
          ref: production
          path: production-src
      - name: Checkout production data
        uses: actions/checkout@v4
        with:
          ref: data-production
          path: data-production-src
      - name: Checkout unpublished staging data candidate
        uses: actions/checkout@v4
        with:
          ref: data-staging
          fetch-depth: 0
          path: data-staging-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # When the production-data SHA advances, pending additive staging history must
      # be rebased to that exact SHA before the immutable preview audit is rerun.
      - name: Validate staging preview data separately and freeze both data branch heads
        shell: bash
        run: |
          set -euo pipefail
          base="$(git -C data-production-src rev-parse HEAD)"
          stage="$(git -C data-staging-src rev-parse HEAD)"
          test "$(git -C data-production-src ls-remote origin refs/heads/data-production | cut -f1)" = "$base"
          test "$(git -C data-staging-src ls-remote origin refs/heads/data-staging | cut -f1)" = "$stage"
          git -C data-staging-src merge-base --is-ancestor "$base" "$stage"
          (
            cd data-staging-src
            python3 ../production-src/tools/validate_data.py --strict --min-image-coverage 0.70 site/data
            python3 ../production-src/tools/validate_decisions.py --strict site/data
            if [ "$stage" = "$base" ]; then
              echo "UNCHANGED_DATA_SHA: no new source checks were claimed; prior required-source audit debt remains recorded as before"
            elif [ "${{ needs.gate.outputs.operation }}" = "verified-horizon-subset" ] && [ "${{ needs.gate.outputs.mode }}" = "data" ]; then
              echo "Preview inherits source evidence plus immutable roll proof from the successful validate_data job for exact stage SHA"
            elif [ "${{ needs.gate.outputs.operation }}" = "verified-subset-addition" ] && [ "${{ needs.gate.outputs.mode }}" = "data" ]; then
              echo "Preview inherits immutable verified-subset proof and scoped source audit from validate_data on candidate SHA"
            elif [ "${{ needs.gate.outputs.operation }}" = "verified-forest-table-addition" ] && [ "${{ needs.gate.outputs.mode }}" = "data" ]; then
              echo "Preview inherits strict three-week Nerima official schedule additive audit from validate_data job"
            elif [ "${{ needs.gate.outputs.operation }}" = "thumbnail-correction" ] && [ "${{ needs.gate.outputs.mode }}" = "data" ]; then
              echo "Preview source audit inherits the exact one-field thumbnail guard from validate_data; unchanged historical source checks remain recorded as-is"
            else
              if [ "${{ needs.gate.outputs.operation }}" = "manual-independent-holiday-addition" ]; then
                if [ "${{ needs.gate.outputs.mode }}" = "data" ]; then
                  audit_base="${{ needs.gate.outputs.base_data_production_sha }}"
                else
                  audit_base="$base"
                fi
                python3 ../staging-src/tools/validate_official_schedule_audit.py site/data \
                  --allow-unchanged-historical-gaps-base "$audit_base"
              else
                python3 ../staging-src/tools/validate_official_schedule_audit.py site/data
              fi
            fi
            if [ "$stage" != "$base" ]; then
              python3 ../staging-src/tools/validate_protected_events.py --base-ref "$base" site/data
              python3 ../staging-src/tools/validate_non_regression.py --base-ref "$base" site/data
            else
              echo "ALREADY_PROMOTED_SAME_SHA: pre-promotion validate_data passed, no self-comparison required"
            fi
            python3 ../production-src/tools/validate_rereview.py site/data --strict
            if [ "$stage" != "$base" ]; then
              if [ "${{ needs.gate.outputs.operation }}" = "verified-forest-table-addition" ]; then
                python3 ../staging-src/tools/validate_nerima_forest_addition.py --base-ref "$base"
              elif [ "${{ needs.gate.outputs.operation }}" = "verified-horizon-subset" ]; then
                echo "Immutable source+history already audited by validate_data on candidate before promotion; data-staging unchanged."
              elif [ "${{ needs.gate.outputs.operation }}" = "verified-subset-addition" ]; then
                subset_kind="$(python3 -c 'import json; print(json.load(open("site/data/update_history.json"))["history"][-1]["run_type"])')"
                if [ "$subset_kind" = "manual_verified_week_holiday_addition" ]; then
                  python3 ../staging-src/tools/validate_this_week_verified_addition.py --base-ref "$base"
                elif [ "$subset_kind" = "manual_verified_weekend_subset_addition" ]; then
                  python3 ../staging-src/tools/validate_verified_weekend_subset.py --base-ref "$base"
                elif [ "$subset_kind" = "manual_verified_subset_addition" ]; then
                  python3 ../staging-src/tools/validate_verified_subset.py --base-ref "$base"
                else
                  echo "Unknown subset operation: $subset_kind" >&2; exit 1
                fi
              else
                node ../staging-src/tools/holiday_update_history.mjs --check --base-ref "$base" --data-dir site/data
              fi
            fi
          )
          echo "STAGING_PREVIEW_DATA_STRICT_PASS stage=$stage production=$base"
      - name: Verify real staging all-period event identity
        run: node staging-src/tests/staging_real_arts_identity.test.mjs data-staging-src/site/data
      - name: Compose production root and hidden staging preview
        shell: bash
        run: |
          mkdir -p pages
          cp -a production-src/site/. pages/
          mkdir -p pages/staging
          cp -a staging-src/site/. pages/staging/

          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          production_data_src = Path("data-production-src/site/data")
          staging_data_src = Path("data-staging-src/site/data")

          def overlay_runtime_data(data_src, dest):
              dest = Path(dest)
              dest.mkdir(parents=True, exist_ok=True)
              for p in dest.glob("20??-??-??*.json"):
                  p.unlink()
              for name in ("manifest.json", "update_history.json"):
                  p = dest / name
                  if p.exists():
                      p.unlink()
              for p in data_src.glob("20??-??-??*.json"):
                  shutil.copy2(p, dest / p.name)
              for name in ("manifest.json", "update_history.json"):
                  src = data_src / name
                  if not src.exists():
                      raise SystemExit(f"missing runtime data file: {src}")
                  shutil.copy2(src, dest / name)

          # Production and preview are intentionally backed by independent branches.
          # Never promote data-staging or modify the production tree in a preview run.
          overlay_runtime_data(production_data_src, "pages/data")
          overlay_runtime_data(staging_data_src, "pages/staging/data")
          for source, dest in [
              (production_data_src, Path("pages/data")),
              (staging_data_src, Path("pages/staging/data")),
          ]:
              for name in ("manifest.json", "update_history.json"):
                  if (dest / name).read_bytes() != (source / name).read_bytes():
                      raise SystemExit(f"Preview composition mismatch: {dest / name}")
          print("PRODUCTION_DATA_UNCHANGED_AND_STAGING_CANDIDATE_VISIBLE")

          release_registry = Path("staging-src/.github/production-releases.json")
          if release_registry.exists():
              shutil.copy2(release_registry, "pages/data/production-releases.json")
              shutil.copy2(release_registry, "pages/staging/data/production-releases.json")

          short_sha = subprocess.check_output(
              ["git","-C","staging-src","rev-parse","--short=7","HEAD"],
              text=True
          ).strip()
          data_sha = subprocess.check_output(
              ["git","-C","data-staging-src","rev-parse","--short=7","HEAD"],
              text=True
          ).strip()

          marker = '<meta name="robots" content="noindex,nofollow">'
          style = '''<style id="staging-visual-marker">
          html::after{content:"";position:fixed;inset:0;border:2px solid rgba(138,75,8,.8);pointer-events:none;z-index:2147483646}
          .staging-visual-marker{position:fixed;right:6px;bottom:6px;display:flex;align-items:center;gap:5px;background:rgba(138,75,8,.92);color:#fff7ed;border-radius:999px;padding:4px 7px;font-family:"Meiryo UI",Meiryo,sans-serif;font-size:9px;font-weight:800;line-height:1;letter-spacing:.02em;z-index:2147483647;box-shadow:0 1px 3px rgba(0,0,0,.18);pointer-events:none}
          .staging-visual-marker small{font-size:8px;font-weight:700;opacity:.9}
          </style>'''
          banner = f'<div class="staging-visual-marker" role="status">STAGING <small>{short_sha} / DATA {data_sha}</small></div>'

          for p in Path("pages/staging").glob("*.html"):
              s=p.read_text(encoding="utf-8")
              if marker not in s:
                  s=s.replace("<head>", "<head>\n"+marker, 1)
              if 'id="staging-visual-marker"' not in s:
                  s=s.replace("</head>", style+"\n</head>", 1)
              if 'class="staging-visual-marker"' not in s:
                  body_pos=s.find("<body")
                  if body_pos != -1:
                      body_end=s.find(">", body_pos)
                      if body_end != -1:
                          s=s[:body_end+1]+"\n"+banner+s[body_end+1:]
              p.write_text(s,encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4

  snapshot_data:
    needs: [gate, promote_data, preview]
    if: ${{ always() && needs.gate.outputs.mode == 'data' && needs.gate.outputs.operation != 'bootstrap' && needs.promote_data.result == 'success' && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-production
      - name: Preserve immutable production-data snapshot
        shell: bash
        run: |
          stamp="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          branch="data-release/${stamp}-r${GITHUB_RUN_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Snapshot already exists: $branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "Preserved $branch at $(git rev-parse HEAD)"

  rollback_data_on_deploy_failure:
    needs: [gate, promote_data, preview]
    if: ${{ always() && needs.gate.outputs.mode == 'data' && needs.promote_data.result == 'success' && needs.preview.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-staging
          fetch-depth: 0
      - name: Restore prior production-data pointer
        shell: bash
        run: |
          previous="${{ needs.promote_data.outputs.previous_sha }}"
          candidate="${{ needs.promote_data.outputs.candidate_sha }}"
          git fetch origin "$previous"
          git push origin "$previous:refs/heads/data-production" --force-with-lease="refs/heads/data-production:$candidate"
