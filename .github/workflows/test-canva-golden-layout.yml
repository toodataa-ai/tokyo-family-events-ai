name: Canva golden layout regression (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/canva.html'
      - 'site/canva-draft-contract.js'
      - 'site/canva-prompt-template-v2.txt'
      - 'docs/canva_prompt_template_v2.txt'
      - 'docs/canva_prompt_rules_v2.md'
      - 'docs/canva_visual_quality_contract_v1.md'
      - 'docs/canva_golden_layout_contract_v1.md'
      - 'tests/canva_draft_contract.test.mjs'
      - '.github/workflows/test-canva-golden-layout.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-canva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: node --check site/canva-draft-contract.js
      - name: Canva contract and golden-layout regressions
        run: node --test tests/canva_draft_contract.test.mjs
      - name: Full existing repository tests
        run: npm test
